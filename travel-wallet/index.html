<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Travel Wallet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

<style>
/* =========================
   TRAVEL WALLET
   File: travel-wallet/index.html
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#f3eef8;
  --bg2:#fbf8ff;
  --ink:#1f2433;
  --muted:#777f93;
  --soft:#a4a9b8;
  --card:#ffffff;
  --line:rgba(31,36,51,.10);

  --purple:#6d4aff;
  --purple2:#8d5cff;
  --purple3:#efe9ff;

  --blue:#2f7df6;
  --green:#147a4b;
  --greenBg:#e8f7ef;
  --red:#d74242;
  --redBg:#fff0f0;
  --orange:#d98716;
  --orangeBg:#fff4df;

  --shadow:0 18px 45px rgba(56,42,111,.14);
  --shadow2:0 10px 24px rgba(56,42,111,.12);
}

html,
body{
  width:100%;
  min-height:100%;
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

body{
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font-family:'DM Sans',sans-serif;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:0 auto;
  background:
    radial-gradient(circle at 15% 0%, rgba(141,92,255,.22), transparent 30%),
    radial-gradient(circle at 90% 4%, rgba(47,125,246,.16), transparent 28%),
    linear-gradient(180deg,#faf7ff 0%,#f3eef8 42%,#f8f5fb 100%);
  position:relative;
  padding-bottom:96px;
}

/* =========================
   HEADER
========================= */

.header{
  padding:18px 5% 14px;
  position:relative;
}

.top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:16px;
  background:rgba(255,255,255,.76);
  color:var(--ink);
  box-shadow:0 8px 22px rgba(69,47,123,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.brand-mini{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
  letter-spacing:1.7px;
  text-transform:uppercase;
}

.header-main{
  background:linear-gradient(135deg,#241c45 0%,#5f3fff 58%,#9b6cff 100%);
  border-radius:28px;
  padding:18px;
  color:#fff;
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
}

.header-main:before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  top:-60px;
  right:-45px;
}

.header-main:after{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  bottom:-45px;
  left:30px;
}

.header-content{
  position:relative;
  z-index:2;
}

.logo-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.logo-icon{
  width:48px;
  height:48px;
  border-radius:18px;
  background:rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.22);
}

.logo-icon i{
  font-size:25px;
}

.logo-text{
  flex:1;
}

.logo-title{
  font-size:25px;
  font-weight:700;
  letter-spacing:-.7px;
  line-height:1.05;
}

.logo-subtitle{
  font-size:12px;
  color:rgba(255,255,255,.72);
  margin-top:4px;
}

.stats-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat-box{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.16);
  border-radius:18px;
  padding:11px 8px;
  text-align:center;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.stat-num{
  font-family:'Space Mono',monospace;
  font-size:20px;
  font-weight:700;
  line-height:1;
}

.stat-label{
  font-size:10px;
  color:rgba(255,255,255,.68);
  margin-top:4px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

/* =========================
   SEARCH
========================= */

.search-wrap{
  padding:0 5% 12px;
}

.search-box{
  height:50px;
  border-radius:18px;
  background:rgba(255,255,255,.84);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 12px 28px rgba(69,47,123,.07);
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
}

.search-box i{
  color:var(--soft);
  font-size:20px;
}

.search-box input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  font-size:14px;
  color:var(--ink);
}

.search-box input::placeholder{
  color:var(--soft);
}

/* =========================
   MAIN CONTENT
========================= */

.page{
  display:none;
  padding:0 5% 18px;
}

.page.active{
  display:block;
}

.section-title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0 12px;
}

.section-title{
  font-size:18px;
  font-weight:800;
  letter-spacing:-.4px;
}

.section-small{
  font-size:12px;
  color:var(--muted);
}

.cards-wrap{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.empty-box{
  text-align:center;
  padding:34px 18px;
  background:rgba(255,255,255,.74);
  border:1px dashed rgba(31,36,51,.13);
  border-radius:24px;
  color:var(--muted);
  margin-top:10px;
}

.empty-box i{
  font-size:42px;
  color:var(--soft);
  margin-bottom:10px;
  display:block;
}

.empty-box strong{
  color:var(--ink);
  display:block;
  margin-bottom:4px;
}

/* =========================
   BOARDING PASS CARD
========================= */

.trip-card{
  background:rgba(255,255,255,.92);
  border:1px solid rgba(255,255,255,.85);
  border-radius:26px;
  overflow:hidden;
  box-shadow:var(--shadow2);
  position:relative;
}

.ticket-top{
  padding:15px 16px 13px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px dashed rgba(31,36,51,.16);
  position:relative;
}

.ticket-top:before,
.ticket-top:after{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--bg);
  bottom:-9px;
}

.ticket-top:before{
  left:-9px;
}

.ticket-top:after{
  right:-9px;
}

.trip-card.upcoming .ticket-top{
  background:linear-gradient(135deg,#ffffff 0%,#f4efff 100%);
}

.trip-card.history .ticket-top{
  background:linear-gradient(135deg,#ffffff 0%,#f3f3f6 100%);
}

.trip-title-area{
  flex:1;
  min-width:0;
}

.trip-name{
  font-size:16px;
  font-weight:800;
  letter-spacing:-.3px;
  color:var(--ink);
  line-height:1.15;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.trip-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:7px;
}

.meta-pill{
  font-size:10px;
  font-weight:800;
  border-radius:999px;
  padding:4px 8px;
  background:var(--purple3);
  color:var(--purple);
  font-family:'Space Mono',monospace;
}

.meta-pill.soft{
  background:#eef4ff;
  color:var(--blue);
}

.card-menu-wrap{
  position:relative;
}

.card-menu-btn{
  width:34px;
  height:34px;
  border:none;
  border-radius:13px;
  background:rgba(255,255,255,.86);
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.dropdown{
  position:absolute;
  right:0;
  top:40px;
  width:178px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 18px 40px rgba(31,36,51,.16);
  overflow:hidden;
  z-index:80;
}

.dropdown-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  font-size:13px;
  font-weight:700;
  color:var(--ink);
}

.dropdown-item:not(:last-child){
  border-bottom:1px solid rgba(31,36,51,.07);
}

.dropdown-item i{
  font-size:18px;
  color:var(--muted);
}

.dropdown-item.danger{
  color:var(--red);
}

.dropdown-item.danger i{
  color:var(--red);
}

.ticket-route{
  padding:16px;
}

.route-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.airport-block{
  width:82px;
}

.airport-block.right{
  text-align:right;
}

.airport-code{
  font-family:'Space Mono',monospace;
  font-size:27px;
  font-weight:700;
  color:var(--ink);
  line-height:1;
}

.airport-label{
  font-size:10px;
  color:var(--soft);
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.route-line{
  flex:1;
  display:flex;
  align-items:center;
  min-width:80px;
}

.route-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--purple);
}

.route-dash{
  flex:1;
  border-top:2px dashed rgba(109,74,255,.28);
}

.route-plane{
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 7px;
  box-shadow:0 8px 18px rgba(109,74,255,.25);
}

.route-plane i{
  font-size:18px;
}

.ticket-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:14px;
}

.date-chip{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.status-chip{
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.7px;
  padding:5px 9px;
  border-radius:999px;
}

.status-chip.upcoming{
  background:var(--greenBg);
  color:var(--green);
}

.status-chip.history{
  background:#eeeeF3;
  color:var(--muted);
}

.connect-chip{
  font-size:10px;
  color:var(--orange);
  background:var(--orangeBg);
  padding:5px 8px;
  border-radius:999px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:4px;
}

/* =========================
   TRAVELERS PAGE
========================= */

.traveler-card{
  background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:0 10px 25px rgba(69,47,123,.08);
  border-radius:22px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.traveler-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:17px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:16px;
}

.traveler-name{
  font-size:15px;
  font-weight:800;
}

.traveler-note{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.small-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:35px;
  height:35px;
  border:none;
  border-radius:13px;
  background:#f4f1fa;
  color:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.icon-btn.red{
  background:var(--redBg);
  color:var(--red);
}

/* =========================
   FAB
========================= */

.fab-wrap{
  position:fixed;
  bottom:82px;
  right:calc(50% - 226px);
  z-index:120;
}

.fab{
  min-height:52px;
  border:none;
  border-radius:999px;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:9px;
  color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  box-shadow:0 18px 38px rgba(109,74,255,.32);
  font-size:14px;
  font-weight:900;
}

.fab i{
  font-size:21px;
}

.fab-menu{
  position:absolute;
  right:0;
  bottom:62px;
  width:210px;
  background:#fff;
  border-radius:22px;
  border:1px solid var(--line);
  overflow:hidden;
  box-shadow:0 18px 45px rgba(31,36,51,.18);
}

.fab-item{
  padding:15px 16px;
  display:flex;
  align-items:center;
  gap:11px;
  font-size:14px;
  font-weight:800;
  color:var(--ink);
}

.fab-item:not(:last-child){
  border-bottom:1px solid rgba(31,36,51,.07);
}

.fab-item i{
  font-size:20px;
  color:var(--purple);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:76px;
  padding:8px 4% calc(env(safe-area-inset-bottom) + 8px);
  background:rgba(255,255,255,.88);
  border-top:1px solid rgba(31,36,51,.08);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  z-index:150;
}

.nav-item{
  border:none;
  background:transparent;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:var(--soft);
  font-weight:800;
}

.nav-item i{
  font-size:22px;
}

.nav-item span{
  font-size:10px;
}

.nav-item.active{
  color:var(--purple);
  background:var(--purple3);
}

/* =========================
   MODALS / SHEETS
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(18,18,35,.56);
  z-index:300;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.sheet{
  width:100%;
  max-width:480px;
  max-height:92vh;
  overflow-y:auto;
  background:linear-gradient(180deg,#fbf8ff 0%,#f3eef8 100%);
  border-radius:28px 28px 0 0;
  box-shadow:0 -20px 45px rgba(18,18,35,.20);
  padding-bottom:28px;
}

.sheet-handle{
  width:44px;
  height:5px;
  border-radius:10px;
  background:rgba(31,36,51,.16);
  margin:13px auto 4px;
}

.sheet-header{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 5%;
  background:rgba(251,248,255,.92);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(31,36,51,.07);
}

.sheet-title{
  font-size:18px;
  font-weight:900;
  letter-spacing:-.4px;
}

.close-btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:15px;
  background:#fff;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  box-shadow:0 8px 18px rgba(69,47,123,.08);
}

.sheet-body{
  padding:14px 5% 0;
}

.detail-hero{
  background:linear-gradient(135deg,#241c45 0%,#6d4aff 100%);
  color:#fff;
  border-radius:26px;
  padding:18px;
  box-shadow:var(--shadow2);
  margin-bottom:14px;
}

.detail-route{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.detail-airport{
  font-family:'Space Mono',monospace;
  font-size:30px;
  font-weight:800;
}

.detail-mid{
  text-align:center;
  color:rgba(255,255,255,.72);
}

.detail-mid i{
  font-size:24px;
  color:#fff;
}

.detail-trip-title{
  margin-top:14px;
  font-size:17px;
  font-weight:900;
}

.info-section{
  background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.9);
  border-radius:22px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 8px 20px rgba(69,47,123,.06);
}

.info-label{
  font-size:10px;
  font-weight:900;
  color:var(--soft);
  text-transform:uppercase;
  letter-spacing:1.4px;
  margin-bottom:8px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:9px 0;
  border-bottom:1px solid rgba(31,36,51,.07);
}

.info-row:last-child{
  border-bottom:none;
}

.info-key{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  display:flex;
  gap:7px;
  align-items:center;
}

.info-key i{
  font-size:16px;
  color:var(--soft);
}

.info-val{
  color:var(--ink);
  font-size:13px;
  font-weight:800;
  text-align:right;
  word-break:break-word;
  max-width:58%;
}

.mono{
  font-family:'Space Mono',monospace;
  font-size:12px;
}

.action-row{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.action-btn{
  flex:1;
  border:none;
  border-radius:17px;
  min-height:48px;
  font-size:14px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.action-btn.light{
  background:#fff;
  color:var(--ink);
  border:1px solid rgba(31,36,51,.10);
}

.action-btn.dark{
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  color:#fff;
}

/* =========================
   FORM
========================= */

.form-section-title{
  font-size:11px;
  font-weight:900;
  color:var(--soft);
  letter-spacing:1.4px;
  text-transform:uppercase;
  margin:16px 0 8px;
}

.form-group{
  margin-bottom:11px;
}

.form-label{
  display:block;
  font-size:12px;
  color:var(--muted);
  font-weight:800;
  margin-bottom:6px;
}

.form-input{
  width:100%;
  min-height:46px;
  border:1px solid rgba(31,36,51,.10);
  border-radius:17px;
  background:rgba(255,255,255,.92);
  outline:none;
  padding:11px 13px;
  color:var(--ink);
  font-size:14px;
  box-shadow:0 6px 16px rgba(69,47,123,.04);
}

textarea.form-input{
  resize:vertical;
  min-height:84px;
  line-height:1.5;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.checkbox-card{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(31,36,51,.10);
  border-radius:18px;
  padding:12px;
  margin:10px 0;
}

.checkbox-card input{
  width:18px;
  height:18px;
  accent-color:var(--purple);
}

.checkbox-card label{
  font-size:14px;
  font-weight:900;
}

.save-btn{
  width:100%;
  min-height:52px;
  border:none;
  border-radius:19px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  color:#fff;
  font-size:15px;
  font-weight:900;
  margin-top:14px;
  box-shadow:0 14px 28px rgba(109,74,255,.25);
}

.secondary-btn{
  width:100%;
  min-height:48px;
  border:none;
  border-radius:18px;
  background:#fff;

  font-size:14px;
  font-weight:900;
  margin-top:10px;

}

.import-note{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
  margin-bottom:10px;
}

.import-area{
  width:100%;
  min-height:160px;
  border:1.5px dashed rgba(109,74,255,.28);

  padding:14px;
  font-size:13px;

}

.traveler-picker{

  flex-wrap:wrap;
  gap:8px;

}

.picker-chip{

/* =========================

========================= */

}

@media(max-width:520px){

    right:5%;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================== -->
  <header class="header">

      </button>
      <div class="brand-mini">Smart Tools</div>
      <button class="back-btn" onclick="openAddMenu()" aria-label="Add">
        <i class="ti ti-plus"></i>
      </button>
    </div>

    <div class="header-main">
      <div class="header-content">
        <div class="logo-row">
          <div class="logo-icon">
            <i class="ti ti-plane"></i>
          </div>
          <div class="logo-text">
            <div class="logo-title">Travel Wallet</div>
            <div class="logo-subtitle">Trips, flights, tickets and travelers</div>
          </div>
        </div>

        <div class="stats-row">

            <div class="stat-label">Upcoming</div>

          <div class="stat-box">
            <div class="stat-num" id="statHistory">0</div>
            <div class="stat-label">History</div>

          <div class="stat-box">
            <div class="stat-num" id="statTravelers">0</div>

  <!-- =========================

  <!-- =========================

  <!-- =========================
       HISTORY PAGE
  ========================== -->
  <main class="page" id="historyPage">

    <div class="cards-wrap" id="historyCards"></div>

  <!-- =========================
       TRAVELERS PAGE

  <main class="page" id="travelersPage">

  <!-- =========================

      <div class="fab-item" onclick="openManualForm()">
        <i class="ti ti-edit"></i>
        Manual Entry
      </div>
      <div class="fab-item" onclick="openImportForm()">
        <i class="ti ti-clipboard-text"></i>
        Import / Paste Receipt
      </div>
      <div class="fab-item" onclick="openTravelerForm()">
        <i class="ti ti-user-plus"></i>
        Save Traveler
      </div>
    </div>

    <button class="fab" onclick="openAddMenu()">
      <i class="ti ti-plus"></i>
      Add
    </button>
  </div>

  <!-- =========================
       BOTTOM NAV
  ========================== -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="navDashboard" onclick="showPage('dashboard')">
      <i class="ti ti-layout-dashboard"></i>

</div>

<!-- =========================
     DETAIL SHEET
========================== -->
<div class="overlay hidden" id="detailOverlay" onclick="closeDetailFromOverlay(event)">

      <div class="sheet-title" id="detailTitle">Trip Details</div>
      <button class="close-btn" onclick="closeDetail()">
        <i class="ti ti-x"></i>
      </button>

    <div class="sheet-body" id="detailBody"></div>
  </div>
</div>

<!-- =========================
     FORM SHEET
========================== -->
<div class="overlay hidden" id="formOverlay" onclick="closeFormFromOverlay(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="formTitle">Add Trip</div>
      <button class="close-btn" onclick="closeForm()">
        <i class="ti ti-x"></i>
      </button>
    </div>
    <div class="sheet-body" id="formBody"></div>
  </div>
</div>

<script>
/* =========================
   STORAGE KEYS
========================= */

const TRAVEL_WALLET_TRIPS_KEY = "smartToolsTravelWalletTrips_v2";
const TRAVEL_WALLET_TRAVELERS_KEY = "smartToolsTravelWalletTravelers_v2";

/* =========================
   APP STATE
========================= */

let trips = loadTrips();
let travelers = loadTravelers();

let currentPage = "dashboard";
let editingTripId = null;
let editingTravelerId = null;
let openMenuId = null;

/* =========================
   SAFE HELPERS
========================= */

function escapeHtml(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getValue(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function makeId(prefix){
  return prefix + "_" + Date.now() + "_" + Math.floor(Math.random() * 99999);
}

function normalizeAirport(value){
  return String(value || "").trim().toUpperCase();
}

function cityName(code){
  const map = {
    JFK:"New York",
    LGA:"New York",
    EWR:"Newark",
    LHR:"London",
    LGW:"London",
    KEF:"Reykjavik",
    DXB:"Dubai",
    ORD:"Chicago",
    MIA:"Miami",
    CUN:"Cancun",
    LAX:"Los Angeles",
    YYZ:"Toronto",
    ISB:"Islamabad",
    LHE:"Lahore",
    KHI:"Karachi",
    JED:"Jeddah",
    MED:"Madinah"
  };
  return map[code] || code || "City";
}

/* =========================
   LOAD / SAVE
========================= */

function loadTrips(){
  try{
    const saved = localStorage.getItem(TRAVEL_WALLET_TRIPS_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed)) return parsed;
    }
  }catch(e){}
  return getDemoTrips();
}

function saveTrips(){
  localStorage.setItem(TRAVEL_WALLET_TRIPS_KEY, JSON.stringify(trips));
}

function loadTravelers(){
  try{
    const saved = localStorage.getItem(TRAVEL_WALLET_TRAVELERS_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed)) return parsed;
    }
  }catch(e){}
  return [];
}

function saveTravelers(){
  localStorage.setItem(TRAVEL_WALLET_TRAVELERS_KEY, JSON.stringify(travelers));
}

/* =========================
   DEMO DATA
========================= */

function getDemoTrips(){
  return [
    {
      id:makeId("trip"),
      name:"London Summer Trip",
      status:"upcoming",
      type:"flight",
      airline:"Icelandair",
      code:"FI",
      flightNum:"FI614",
      from:"JFK",
      firstStop:"KEF",
      to:"LHR",
      connecting:true,
      date:"July 21, 2026",
      dep:"8:30 PM",
      arr:"6:20 AM",
      confirm:"CRDDAB",
      airline2:"Icelandair",
      flight2:"FI450",
      from2:"KEF",
      date2:"July 22, 2026",
      dep2:"7:40 AM",
      arr2:"12:55 PM",
      confirm2:"CRDDAB",
      ticket:"1087446439330",
      bookingCode:"H-UNZZWH",
      traveler:"Farrukh Saeed",
      traveler2:"Arsala Hassan - 1087446439331\nAli Saeed - 1087446439332",
      hotel:"London hotel",
      hotelCheckin:"July 22, 2026",
      hotelCheckout:"July 28, 2026",
      hotelConfirm:"",
      notes:"Imported sample trip. Edit or delete anytime."
    }
  ];
}

/* =========================
   PAGE NAVIGATION
========================= */

function showPage(page){
  currentPage = page;

  document.getElementById("dashboardPage").classList.remove("active");
  document.getElementById("historyPage").classList.remove("active");
  document.getElementById("travelersPage").classList.remove("active");

  document.getElementById("navDashboard").classList.remove("active");
  document.getElementById("navHistory").classList.remove("active");
  document.getElementById("navTravelers").classList.remove("active");

  if(page === "dashboard"){
    document.getElementById("dashboardPage").classList.add("active");
    document.getElementById("navDashboard").classList.add("active");
  }

  if(page === "history"){
    document.getElementById("historyPage").classList.add("active");
    document.getElementById("navHistory").classList.add("active");
  }

  if(page === "travelers"){
    document.getElementById("travelersPage").classList.add("active");
    document.getElementById("navTravelers").classList.add("active");
  }

  closeAddMenu();
  renderCurrentPage();
}

function renderCurrentPage(){
  renderStats();
  renderDashboard();
  renderHistory();
  renderTravelers();
}

/* =========================
   STATS
========================= */

function renderStats(){
  const upcoming = trips.filter(t => t.status !== "history").length;
  const history = trips.filter(t => t.status === "history").length;

  document.getElementById("statUpcoming").textContent = upcoming;
  document.getElementById("statHistory").textContent = history;
  document.getElementById("statTravelers").textContent = travelers.length;
}

/* =========================
   FILTER / SEARCH
========================= */

function getSearchText(){
  return (document.getElementById("searchInput").value || "").toLowerCase().trim();
}

function tripMatchesSearch(t){
  const q = getSearchText();
  if(!q) return true;

  const blob = [
    t.name,
    t.airline,
    t.airline2,
    t.flightNum,
    t.flight2,
    t.from,
    t.firstStop,
    t.to,
    t.from2,
    t.date,
    t.traveler,
    t.traveler2,
    t.confirm,
    t.confirm2,
    t.bookingCode,
    t.ticket,
    t.hotel,
    t.notes
  ].join(" ").toLowerCase();

  return blob.includes(q);
}

/* =========================
   RENDER TRIPS
========================= */

function renderDashboard(){
  const wrap = document.getElementById("dashboardCards");
  const list = trips
    .filter(t => t.status !== "history")
    .filter(tripMatchesSearch)
    .sort((a,b) => String(a.date || "").localeCompare(String(b.date || "")));

  renderTripList(wrap, list, "No upcoming trips", "Tap Add to save your next itinerary.");
}

function renderHistory(){
  const wrap = document.getElementById("historyCards");
  const list = trips
    .filter(t => t.status === "history")
    .filter(tripMatchesSearch);

  renderTripList(wrap, list, "No history yet", "Completed trips will stay here.");
}

function renderTripList(wrap, list, title, subtitle){
  wrap.innerHTML = "";

  if(!list.length){
    wrap.innerHTML = `
      <div class="empty-box">
        <i class="ti ti-plane-off"></i>
        <strong>${escapeHtml(title)}</strong>
        <div>${escapeHtml(subtitle)}</div>
      </div>
    `;
    return;
  }

  list.forEach(function(t){
    wrap.appendChild(createTripCard(t));
  });
}

function createTripCard(t){
  const card = document.createElement("div");
  card.className = "trip-card " + (t.status === "history" ? "history" : "upcoming");

  const from = escapeHtml(t.from || "FROM");
  const to = escapeHtml(t.to || "TO");
  const flightDisplay = escapeHtml((t.flightNum || "") + (t.connecting && t.flight2 ? " · " + t.flight2 : ""));
  const codeDisplay = escapeHtml(t.code || t.type || "TRIP");
  const connectText = t.connecting ? `<span class="connect-chip"><i class="ti ti-git-branch"></i>Connecting</span>` : "";

  card.innerHTML = `
    <div class="ticket-top">
      <div class="trip-title-area" onclick="openDetail('${escapeHtml(t.id)}')">
        <div class="trip-name">${escapeHtml(t.name || "Untitled Trip")}</div>
        <div class="trip-meta">
          <span class="meta-pill">${codeDisplay}</span>
          ${flightDisplay ? `<span class="meta-pill soft">${flightDisplay}</span>` : ""}
        </div>
      </div>

      <div class="card-menu-wrap">
        <button class="card-menu-btn" onclick="toggleCardMenu(event,'${escapeHtml(t.id)}')">
          <i class="ti ti-dots-vertical"></i>
        </button>

        <div class="dropdown hidden" id="menu-${escapeHtml(t.id)}">
          <div class="dropdown-item" onclick="editTrip('${escapeHtml(t.id)}')">
            <i class="ti ti-edit"></i>
            Edit itinerary
          </div>

          <div class="dropdown-item" onclick="toggleTripHistory('${escapeHtml(t.id)}')">
            <i class="ti ti-circle-check"></i>
            ${t.status === "history" ? "Move upcoming" : "Mark as done"}
          </div>

          <div class="dropdown-item" onclick="printTrip('${escapeHtml(t.id)}')">
            <i class="ti ti-printer"></i>
            Print itinerary
          </div>

          <div class="dropdown-item danger" onclick="deleteTrip('${escapeHtml(t.id)}')">
            <i class="ti ti-trash"></i>
            Delete
          </div>
        </div>
      </div>
    </div>

    <div class="ticket-route" onclick="openDetail('${escapeHtml(t.id)}')">
      <div class="route-row">
        <div class="airport-block">
          <div class="airport-code">${from}</div>
          <div class="airport-label">${escapeHtml(cityName(t.from))}</div>
        </div>

        <div class="route-line">
          <div class="route-dot"></div>
          <div class="route-dash"></div>
          <div class="route-plane"><i class="ti ti-plane"></i></div>
          <div class="route-dash"></div>
          <div class="route-dot"></div>
        </div>

        <div class="airport-block right">
          <div class="airport-code">${to}</div>
          <div class="airport-label">${escapeHtml(cityName(t.to))}</div>
        </div>
      </div>

      <div class="ticket-footer">
        <span class="date-chip">
          <i class="ti ti-calendar"></i>
          ${escapeHtml(t.date || "No date")}
        </span>

        <div style="display:flex;align-items:center;gap:7px">
          ${connectText}
          <span class="status-chip ${t.status === "history" ? "history" : "upcoming"}">
            ${t.status === "history" ? "History" : "Upcoming"}
          </span>
        </div>
      </div>
    </div>
  `;

  return card;
}

/* =========================
   CARD MENU
========================= */

function toggleCardMenu(event,id){
  event.stopPropagation();

  if(openMenuId && openMenuId !== id){
    const oldMenu = document.getElementById("menu-" + openMenuId);
    if(oldMenu) oldMenu.classList.add("hidden");
  }

  const menu = document.getElementById("menu-" + id);
  if(!menu) return;

  menu.classList.toggle("hidden");
  openMenuId = menu.classList.contains("hidden") ? null : id;
}

function closeCardMenus(){
  if(openMenuId){
    const menu = document.getElementById("menu-" + openMenuId);
    if(menu) menu.classList.add("hidden");
    openMenuId = null;
  }
}

document.addEventListener("click", function(e){
  if(!e.target.closest(".card-menu-wrap")){
    closeCardMenus();
  }

  if(!e.target.closest(".fab-wrap")){
    closeAddMenu();
  }
});

/* =========================
   ADD MENU
========================= */

function openAddMenu(){
  document.getElementById("fabMenu").classList.toggle("hidden");
}

function closeAddMenu(){
  document.getElementById("fabMenu").classList.add("hidden");
}

/* =========================
   DETAIL VIEW
========================= */

function openDetail(id){
  const t = trips.find(x => x.id === id);
  if(!t) return;

  closeCardMenus();
  closeAddMenu();

  document.getElementById("detailTitle").textContent = t.name || "Trip Details";

  let html = `
    <div class="detail-hero">
      <div class="detail-route">
        <div>
          <div class="detail-airport">${escapeHtml(t.from || "FROM")}</div>
          <div style="font-size:11px;color:rgba(255,255,255,.66);text-transform:uppercase">${escapeHtml(cityName(t.from))}</div>
        </div>

        <div class="detail-mid">
          <i class="ti ti-plane"></i>
          ${t.connecting ? `<div style="font-size:10px;margin-top:3px">via ${escapeHtml(t.firstStop || t.from2 || "")}</div>` : ""}
        </div>

        <div style="text-align:right">
          <div class="detail-airport">${escapeHtml(t.to || "TO")}</div>
          <div style="font-size:11px;color:rgba(255,255,255,.66);text-transform:uppercase">${escapeHtml(cityName(t.to))}</div>
        </div>
      </div>

      <div class="detail-trip-title">${escapeHtml(t.name || "Untitled Trip")}</div>
    </div>

    ${infoSection("Flight 1", [
      ["Airline / Company", t.airline],
      ["Airline Code", t.code],
      ["Flight Number", t.flightNum],
      ["From", t.from],
      ["To / First Stop", t.firstStop || (t.connecting ? t.from2 : t.to)],
      ["Date", t.date],
      ["Departure", t.dep],
      ["Arrival", t.arr],
      ["Confirmation", t.confirm]
    ])}
  `;

  if(t.connecting){
    html += infoSection("Connecting Flight", [
      ["Second Airline", t.airline2],
      ["Second Flight", t.flight2],
      ["From", t.from2],
      ["Final Destination", t.to],
      ["Second Date", t.date2],
      ["Second Departure", t.dep2],
      ["Second Arrival", t.arr2],
      ["Second Confirmation", t.confirm2]
    ]);
  }

  html += infoSection("Tickets & Codes", [
    ["Primary Ticket #", t.ticket],
    ["Website Booking Code", t.bookingCode],
    ["Airline Confirmation", t.confirm]
  ]);

  html += infoSection("Travelers", [
    ["Primary Traveler", t.traveler],
    ["Additional Passengers", t.traveler2]
  ]);

  if(t.hotel || t.hotelCheckin || t.hotelCheckout || t.hotelConfirm){
    html += infoSection("Hotel", [
      ["Hotel", t.hotel],
      ["Check-in", t.hotelCheckin],
      ["Check-out", t.hotelCheckout],
      ["Hotel Confirmation", t.hotelConfirm]
    ]);
  }

  if(t.notes){
    html += `
      <div class="info-section">
        <div class="info-label">Notes</div>
        <div style="font-size:13px;line-height:1.6;color:var(--ink);white-space:pre-wrap">${escapeHtml(t.notes)}</div>
      </div>
    `;
  }

  html += `
    <div class="action-row">
      <button class="action-btn light" onclick="printTrip('${escapeHtml(t.id)}')">
        <i class="ti ti-printer"></i>
        Print
      </button>

      <button class="action-btn dark" onclick="editTrip('${escapeHtml(t.id)}');closeDetail();">
        <i class="ti ti-edit"></i>
        Edit
      </button>
    </div>
  `;

  document.getElementById("detailBody").innerHTML = html;
  document.getElementById("detailOverlay").classList.remove("hidden");
}

function infoSection(title, rows){
  let html = `
    <div class="info-section">
      <div class="info-label">${escapeHtml(title)}</div>
  `;

  rows.forEach(function(row){
    const key = row[0];
    const val = row[1];

    if(!val) return;

    html += `
      <div class="info-row">
        <div class="info-key">
          <i class="ti ti-point"></i>
          ${escapeHtml(key)}
        </div>
        <div class="info-val mono">${escapeHtml(val)}</div>
      </div>
    `;
  });

  html += `</div>`;
  return html;
}

function closeDetailFromOverlay(event){
  if(event.target.id === "detailOverlay") closeDetail();
}

function closeDetail(){
  document.getElementById("detailOverlay").classList.add("hidden");
}

/* =========================
   MANUAL FORM
========================= */

function openManualForm(prefill){
  closeAddMenu();
  editingTripId = null;
  document.getElementById("formTitle").textContent = "Add Trip";
  renderTripForm(prefill || {});
  document.getElementById("formOverlay").classList.remove("hidden");
}

function editTrip(id){
  closeCardMenus();
  closeAddMenu();

  const t = trips.find(x => x.id === id);
  if(!t) return;

  editingTripId = id;
  document.getElementById("formTitle").textContent = "Edit Trip";
  renderTripForm(t);
  document.getElementById("formOverlay").classList.remove("hidden");
}

function renderTripForm(d){
  const travelerChips = travelers.map(function(traveler){
    return `<button class="picker-chip" type="button" onclick="useSavedTraveler('${escapeHtml(traveler.name)}')">${escapeHtml(traveler.name)}</button>`;
  }).join("");

  document.getElementById("formBody").innerHTML = `
    <div class="form-section-title">Main Details</div>

    <div class="form-group">
      <label class="form-label">Trip Name</label>
      <input class="form-input" id="fName" value="${escapeHtml(d.name)}" placeholder="London Summer Trip">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Travel Type</label>
        <select class="form-input" id="fType">
          <option value="flight" ${d.type === "flight" || !d.type ? "selected" : ""}>Flight</option>
          <option value="train" ${d.type === "train" ? "selected" : ""}>Train</option>
          <option value="bus" ${d.type === "bus" ? "selected" : ""}>Bus</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Airline / Company</label>
        <input class="form-input" id="fAirline" value="${escapeHtml(d.airline)}" placeholder="Icelandair">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Flight #</label>
        <input class="form-input" id="fFlightNum" value="${escapeHtml(d.flightNum)}" placeholder="FI614">
      </div>

      <div class="form-group">
        <label class="form-label">Airline Code</label>

function toggleConnectingFields(){
  const checked = document.getElementById("fConnecting").checked;
  document.getElementById("connectingFields").classList.toggle("hidden", !checked);
}

function useSavedTraveler(name){
  document.getElementById("fTraveler").value = name;
}

function saveCurrentPrimaryTraveler(){
  const name = getValue("fTraveler");
  if(!name){
    alert("Please type traveler name first.");
    return;
  }

  const exists = travelers.some(t => t.name.toLowerCase() === name.toLowerCase());
  if(!exists){
    travelers.push({
      id:makeId("traveler"),
      name:name,
      note:"Saved from trip form"
    });
    saveTravelers();
    renderStats();
    alert("Traveler saved.");
    renderTripForm(collectCurrentFormData());
  }else{
    alert("This traveler is already saved.");
  }
}

function collectCurrentFormData(){
  const connecting = document.getElementById("fConnecting") ? document.getElementById("fConnecting").checked : false;

  return {
    name:getValue("fName"),
    type:getValue("fType"),
    airline:getValue("fAirline"),
    code:getValue("fCode").toUpperCase(),
    flightNum:getValue("fFlightNum").toUpperCase(),
    from:normalizeAirport(getValue("fFrom")),
    firstStop:normalizeAirport(getValue("fFirstStop")),
    to:connecting ? normalizeAirport(getValue("fFinalDest")) : normalizeAirport(getValue("fFirstStop")),
    connecting:connecting,
    date:getValue("fDate"),
    dep:getValue("fDep"),
    arr:getValue("fArr"),
    confirm:getValue("fConfirm").toUpperCase(),
    airline2:connecting ? getValue("fAirline2") : "",
    flight2:connecting ? getValue("fFlight2").toUpperCase() : "",
    from2:connecting ? normalizeAirport(getValue("fFrom2")) : "",
    date2:connecting ? getValue("fDate2") : "",
    dep2:connecting ? getValue("fDep2") : "",
    arr2:connecting ? getValue("fArr2") : "",
    confirm2:connecting ? getValue("fConfirm2").toUpperCase() : "",
    ticket:getValue("fTicket"),
    bookingCode:getValue("fBookingCode").toUpperCase(),
    traveler:getValue("fTraveler"),
    traveler2:getValue("fTraveler2"),
    hotel:getValue("fHotel"),
    hotelCheckin:getValue("fHotelCheckin"),
    hotelCheckout:getValue("fHotelCheckout"),
    hotelConfirm:getValue("fHotelConfirm"),
    notes:getValue("fNotes")
  };
}

function saveTrip(){
  const oldTrip = editingTripId ? trips.find(t => t.id === editingTripId) : null;
  const data = collectCurrentFormData();

  const trip = {
    id: editingTripId || makeId("trip"),
    status: oldTrip ? oldTrip.status : "upcoming",
    ...data
  };

  if(!trip.name) trip.name = trip.to ? trip.to + " Trip" : "New Trip";
  if(!trip.code && trip.flightNum) trip.code = trip.flightNum.replace(/[0-9]/g,"").slice(0,2);

  if(editingTripId){
    trips = trips.map(t => t.id === editingTripId ? trip : t);
  }else{
    trips.unshift(trip);
  }

  saveTrips();
  closeForm();
  showPage(trip.status === "history" ? "history" : "dashboard");
}

/* =========================
   IMPORT FORM
========================= */

function openImportForm(){
  closeAddMenu();
  editingTripId = null;

  document.getElementById("formTitle").textContent = "Import / Paste Receipt";
  document.getElementById("formBody").innerHTML = `
    <p class="import-note">
      Paste your flight receipt or confirmation email. The app will try to auto-fill the form.
      Every receipt is different, so review the fields before saving.
    </p>

    <textarea class="import-area" id="importText" placeholder="Paste booking receipt text here..."></textarea>

    <button class="save-btn" onclick="parseImportText()">
      <i class="ti ti-sparkles"></i>
      Auto-fill from Text
    </button>
  `;

  document.getElementById("formOverlay").classList.remove("hidden");
}

function parseImportText(){
  const raw = getValue("importText");
  const d = {};

  if(!raw){
    alert("Paste receipt text first.");
    return;
  }

  let m;

  m = raw.match(/\b([A-Z]{2}\d{2,4})\b/i);
  if(m) d.flightNum = m[1].toUpperCase();

  const allFlights = raw.match(/\b[A-Z]{2}\d{2,4}\b/g);
  if(allFlights && allFlights.length > 1){
    d.connecting = true;
    d.flight2 = allFlights[1].toUpperCase();
  }

  m = raw.match(/\b(JFK|LGA|EWR|LHR|LGW|KEF|DXB|ORD|MIA|CUN|LAX|YYZ|ISB|LHE|KHI|JED|MED)\b[\s\S]{0,80}\b(JFK|LGA|EWR|LHR|LGW|KEF|DXB|ORD|MIA|CUN|LAX|YYZ|ISB|LHE|KHI|JED|MED)\b/i);
  if(m){
    d.from = m[1].toUpperCase();
    d.to = m[2].toUpperCase();
    d.firstStop = d.to;
  }

  const codes = raw.match(/\b(JFK|LGA|EWR|LHR|LGW|KEF|DXB|ORD|MIA|CUN|LAX|YYZ|ISB|LHE|KHI|JED|MED)\b/g);
  if(codes && codes.length >= 3){
    d.from = codes[0].toUpperCase();
    d.firstStop = codes[1].toUpperCase();
    d.from2 = codes[1].toUpperCase();
    d.to = codes[codes.length - 1].toUpperCase();
    d.connecting = true;
  }

  m = raw.match(/confirmation codes?[\s\S]{0,80}\b([A-Z0-9]{5,10})\b/i) || raw.match(/confirmation[:\s#]*([A-Z0-9\-]{4,14})/i);
  if(m) d.confirm = m[1].toUpperCase();

  m = raw.match(/Capital One Travel[\s\S]{0,50}\b([A-Z]-[A-Z0-9]{4,12})\b/i) || raw.match(/booking[:\s#]*([A-Z0-9\-]{4,14})/i);
  if(m) d.bookingCode = m[1].toUpperCase();

  m = raw.match(/\b(ticket|ticket number)[:\s#]*([0-9]{10,16})/i);
  if(m) d.ticket = m[2];

  const tickets = raw.match(/\b[0-9]{10,16}\b/g);
  if(tickets && tickets.length){
    d.ticket = tickets[0];
  }

  const times = raw.match(/\b\d{1,2}:\d{2}\s*(a\.m\.|p\.m\.|AM|PM|am|pm)?\b/g);
  if(times && times.length >= 2){
    d.dep = times[0];
    d.arr = times[1];

    if(times.length >= 4){
      d.connecting = true;
      d.dep2 = times[2];
      d.arr2 = times[3];
    }
  }

  m = raw.match(/\b(January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2},?\s+\d{4}\b/i);
  if(m) d.date = m[0];

  m = raw.match(/\b(American|Delta|United|JetBlue|Southwest|Emirates|Icelandair|British Airways|Lufthansa|Air France|Qatar Airways|Etihad|Turkish Airlines)\b/i);
  if(m) d.airline = m[1];

  if(d.airline && d.airline.toLowerCase().includes("icelandair")) d.code = "FI";
  if(d.flightNum && !d.code) d.code = d.flightNum.replace(/[0-9]/g,"").slice(0,2).toUpperCase();

  m = raw.match(/passenger[:\s]*([A-Za-z ]{3,40})/i);
  if(m) d.traveler = m[1].trim();

  if(!d.name){
    d.name = d.to ? cityName(d.to) + " Trip" : "Imported Trip";
  }

  document.getElementById("formTitle").textContent = "Review & Save";
  renderTripForm(d);
}

/* =========================
   TRAVELERS
========================= */

function renderTravelers(){
  const wrap = document.getElementById("travelersList");
  const q = getSearchText();

  let list = travelers.filter(function(t){
    if(!q) return true;
    return (t.name + " " + (t.note || "")).toLowerCase().includes(q);
  });

  wrap.innerHTML = "";

  if(!list.length){
    wrap.innerHTML = `
      <div class="empty-box">
        <i class="ti ti-users"></i>
        <strong>No saved travelers</strong>
        <div>Tap + to save traveler names for future trips.</div>
      </div>
    `;
    return;
  }

  list.forEach(function(t){
    const first = (t.name || "?").trim().charAt(0).toUpperCase();

    const card = document.createElement("div");
    card.className = "traveler-card";
    card.innerHTML = `
      <div class="traveler-left">
        <div class="avatar">${escapeHtml(first)}</div>
        <div>
          <div class="traveler-name">${escapeHtml(t.name)}</div>
          <div class="traveler-note">${escapeHtml(t.note || "Saved traveler")}</div>
        </div>
      </div>

      <div class="small-actions">
        <button class="icon-btn" onclick="openTravelerForm('${escapeHtml(t.id)}')">
          <i class="ti ti-edit"></i>
        </button>

        <button class="icon-btn red" onclick="deleteTraveler('${escapeHtml(t.id)}')">
          <i class="ti ti-trash"></i>
        </button>
      </div>
    `;

    wrap.appendChild(card);
  });
}

function openTravelerForm(id){
  closeAddMenu();
  editingTravelerId = id || null;

  const traveler = editingTravelerId ? travelers.find(t => t.id === editingTravelerId) : {};

  document.getElementById("formTitle").textContent = editingTravelerId ? "Edit Traveler" : "Save Traveler";
  document.getElementById("formBody").innerHTML = `
    <div class="form-section-title">Traveler Details</div>

    <div class="form-group">
      <label class="form-label">Traveler Name</label>
      <input class="form-input" id="travelerNameInput" value="${escapeHtml(traveler ? traveler.name : "")}" placeholder="Farrukh Saeed">
    </div>

    <div class="form-group">
      <label class="form-label">Note Optional</label>
      <input class="form-input" id="travelerNoteInput" value="${escapeHtml(traveler ? traveler.note : "")}" placeholder="Family, work, child, etc.">
    </div>

    <button class="save-btn" onclick="saveTraveler()">
      Save Traveler
    </button>
  `;

  document.getElementById("formOverlay").classList.remove("hidden");
}

function saveTraveler(){
  const name = getValue("travelerNameInput");
  const note = getValue("travelerNoteInput");

  if(!name){
    alert("Please type traveler name.");
    return;
  }

  const obj = {
    id: editingTravelerId || makeId("traveler"),
    name:name,
    note:note
  };

  if(editingTravelerId){
    travelers = travelers.map(t => t.id === editingTravelerId ? obj : t);
  }else{
    const exists = travelers.some(t => t.name.toLowerCase() === name.toLowerCase());
    if(exists){
      alert("This traveler is already saved.");
      return;
    }
    travelers.unshift(obj);
  }

  saveTravelers();
  closeForm();
  showPage("travelers");
}

function deleteTraveler(id){
  if(!confirm("Delete this saved traveler?")) return;
  travelers = travelers.filter(t => t.id !== id);
  saveTravelers();
  renderCurrentPage();
}

/* =========================
   TRIP ACTIONS
========================= */

function toggleTripHistory(id){
  closeCardMenus();

  trips = trips.map(function(t){
    if(t.id === id){
      return {
        ...t,
        status:t.status === "history" ? "upcoming" : "history"
      };
    }
    return t;
  });

  saveTrips();
  renderCurrentPage();
}

function deleteTrip(id){
  closeCardMenus();

  if(!confirm("Delete this trip?")) return;

  trips = trips.filter(t => t.id !== id);
  saveTrips();
  renderCurrentPage();
}

function printTrip(id){
  closeCardMenus();

  const t = trips.find(x => x.id === id);
  if(!t) return;

  const printWindow = window.open("", "_blank");

  const html = `
    <!DOCTYPE html>
    <html>
    <head>
      <title>${escapeHtml(t.name)}</title>
      <style>
        body{
          font-family:Arial,sans-serif;
          max-width:720px;
          margin:0 auto;
          padding:30px;
          color:#222;
        }
        h1{
          font-size:24px;
          margin:0 0 5px;
        }
        .route{
          font-size:18px;
          font-weight:bold;
          margin-bottom:20px;
        }
        h2{
          font-size:15px;
          border-bottom:1px solid #ddd;
          padding-bottom:6px;
          margin-top:22px;
        }
        p{
          font-size:14px;
          margin:6px 0;
        }
        strong{
          display:inline-block;
          min-width:150px;
        }
        pre{
          white-space:pre-wrap;
          font-family:Arial,sans-serif;
          font-size:14px;
        }
      </style>
    </head>
    <body>
      <h1>${escapeHtml(t.name)}</h1>
      <div class="route">${escapeHtml(t.from)} → ${escapeHtml(t.to)}</div>

      <h2>Flight 1</h2>
      <p><strong>Airline:</strong> ${escapeHtml(t.airline)} ${escapeHtml(t.code)}</p>
      <p><strong>Flight:</strong> ${escapeHtml(t.flightNum)}</p>
      <p><strong>Date:</strong> ${escapeHtml(t.date)}</p>
      <p><strong>From:</strong> ${escapeHtml(t.from)}</p>
      <p><strong>To / Stop:</strong> ${escapeHtml(t.firstStop || t.to)}</p>
      <p><strong>Departure:</strong> ${escapeHtml(t.dep)}</p>
      <p><strong>Arrival:</strong> ${escapeHtml(t.arr)}</p>
      <p><strong>Confirmation:</strong> ${escapeHtml(t.confirm)}</p>

      ${
        t.connecting
        ? `
          <h2>Connecting Flight</h2>
          <p><strong>Airline:</strong> ${escapeHtml(t.airline2)}</p>
          <p><strong>Flight:</strong> ${escapeHtml(t.flight2)}</p>
          <p><strong>From:</strong> ${escapeHtml(t.from2)}</p>
          <p><strong>Final Destination:</strong> ${escapeHtml(t.to)}</p>
          <p><strong>Date:</strong> ${escapeHtml(t.date2)}</p>
          <p><strong>Departure:</strong> ${escapeHtml(t.dep2)}</p>
          <p><strong>Arrival:</strong> ${escapeHtml(t.arr2)}</p>
          <p><strong>Confirmation:</strong> ${escapeHtml(t.confirm2)}</p>
        `
        : ""
      }

      <h2>Travelers & Tickets</h2>
      <p><strong>Primary Traveler:</strong> ${escapeHtml(t.traveler)}</p>
      <p><strong>Primary Ticket:</strong> ${escapeHtml(t.ticket)}</p>
      <p><strong>Booking Code:</strong> ${escapeHtml(t.bookingCode)}</p>
      <pre>${escapeHtml(t.traveler2)}</pre>

      ${
        t.hotel || t.hotelCheckin || t.hotelCheckout || t.hotelConfirm
        ? `
          <h2>Hotel</h2>
          <p><strong>Hotel:</strong> ${escapeHtml(t.hotel)}</p>
          <p><strong>Check-in:</strong> ${escapeHtml(t.hotelCheckin)}</p>
          <p><strong>Check-out:</strong> ${escapeHtml(t.hotelCheckout)}</p>
          <p><strong>Confirmation:</strong> ${escapeHtml(t.hotelConfirm)}</p>
        `
        : ""
      }

      ${
        t.notes
        ? `
          <h2>Notes</h2>
          <pre>${escapeHtml(t.notes)}</pre>
        `
        : ""
      }
    </body>
    </html>
  `;

  printWindow.document.open();
  printWindow.document.write(html);
  printWindow.document.close();

  setTimeout(function(){
    printWindow.print();
  }, 400);
}
