<!DOCTYPE html>
<html lang="en">
<head>

  <!-- =========================
       IPHONE HOME SCREEN ICON
  ========================= -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" href="../images/icon.png">
  <link rel="icon" type="image/png" href="../images/icon.png">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Notes</title>

  <style>
    /* =========================
       RESET
    ========================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      padding-bottom: 34px;
      color: #111827;
      background:
        radial-gradient(circle at top left, rgba(96,165,250,0.24), transparent 30%),
        radial-gradient(circle at top right, rgba(244,114,182,0.22), transparent 32%),
        linear-gradient(180deg, #f4f7ff 0%, #eef2ff 48%, #f8fafc 100%);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    /* =========================
       PAGE TOP BAR
    ========================= */
    .top-bar-wrap {
      width: 100%;
      padding: 20px 4% 0 4%;
    }

    .top-bar {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .back-btn {
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: white;
      color: #111827;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.10);
      cursor: pointer;
      flex-shrink: 0;
    }

    .back-btn:active {
      transform: scale(0.96);
    }

    .top-bar-title {
      flex: 1;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.4px;
    }

    .top-bar-spacer {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    /* =========================
       PAGE LAYOUT
    ========================= */
    .page-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 4% 40px 4%;
    }

    .inner-page-hero {
      margin-top: 18px;
      background: linear-gradient(135deg, #f59e0b 0%, #ec4899 48%, #8b5cf6 100%);
      color: white;
      border-radius: 30px;
      padding: 32px 24px;
      box-shadow: 0 14px 32px rgba(236, 72, 153, 0.20);
    }

    .inner-page-hero h1 {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 12px;
      letter-spacing: -0.8px;
    }

    .inner-page-hero p {
      font-size: 17px;
      line-height: 1.6;
      color: rgba(255,255,255,0.95);
      max-width: 760px;
    }

    /* =========================
       CARDS
    ========================= */
    .card {
      background: white;
      border: 1px solid rgba(15,23,42,0.07);
      color: #111827;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 14px 34px rgba(15,23,42,0.10);
    }

    .card + .card {
      margin-top: 22px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 900;
      color: #111827;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .card-subtitle {
      font-size: 15px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 18px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .action-btn {
      border: none;
      min-height: 58px;
      border-radius: 18px;
      padding: 0 24px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
      flex: 1;
      transition: transform 0.16s ease, opacity 0.16s ease;
      color: white;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .save-btn {
      background: linear-gradient(135deg, #22c55e 0%, #14b8a6 100%);
    }

    .reset-btn {
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
    }

    .edit-btn {
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
    }

    .delete-btn {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    }

    /* =========================
       NOTES PAGE
    ========================= */
    .notes-layout {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 22px;
      align-items: start;
    }

    .notes-input {
      width: 100%;
      height: 58px;
      border: 2px solid #e5e7eb;
      border-radius: 18px;
      outline: none;
      background: #fcfcff;
      color: #111827;
      padding: 0 16px;
      font-size: 17px;
      font-weight: 800;
    }

    .notes-textarea {
      width: 100%;
      min-height: 230px;
      resize: vertical;
      border: 2px solid #e5e7eb;
      border-radius: 18px;
      outline: none;
      background: #fcfcff;
      color: #111827;
      padding: 16px;
      font-size: 17px;
      line-height: 1.6;
      margin-top: 14px;
    }

    .notes-input:focus,
    .notes-textarea:focus {
      border-color: #ec4899;
      box-shadow: 0 0 0 4px rgba(236,72,153,0.10);
    }

    .note-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .note-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid rgba(15,23,42,0.07);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(15,23,42,0.08);
    }

    .note-card-title {
      font-size: 20px;
      font-weight: 900;
      color: #111827;
      line-height: 1.25;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .note-card-date {
      font-size: 13px;
      font-weight: 900;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .note-card-body {
      font-size: 16px;
      line-height: 1.65;
      color: #334155;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 16px;
    }

    .note-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .small-note-btn {
      border: none;
      min-height: 44px;
      border-radius: 14px;
      padding: 0 16px;
      cursor: pointer;
      color: white;
      font-size: 14px;
      font-weight: 900;
      flex: 1;
    }

    .empty-notes-box {
      border-radius: 22px;
      padding: 22px;
      background: linear-gradient(180deg, #f9fafb 0%, #f3f4f6 100%);
      border: 1px dashed #cbd5e1;
      color: #64748b;
      font-size: 16px;
      line-height: 1.7;
      text-align: center;
      font-weight: 800;
    }

    .editing-pill {
      display: none;
      margin-bottom: 14px;
      border-radius: 999px;
      padding: 10px 14px;
      background: #fef3c7;
      color: #92400e;
      font-size: 14px;
      font-weight: 900;
      text-align: center;
    }

    .editing-pill.show {
      display: block;
    }

    /* =========================
       DARK THEME
    ========================= */
    body.smart-tools-dark-theme {
      background:
        radial-gradient(circle at top left, rgba(34,197,94,0.12), transparent 30%),
        radial-gradient(circle at top right, rgba(14,165,233,0.10), transparent 32%),
        linear-gradient(180deg, #07111f 0%, #0b1626 52%, #07111f 100%);
      color: #f8fafc;
    }

    body.smart-tools-dark-theme .top-bar-title,
    body.smart-tools-dark-theme .card-title,
    body.smart-tools-dark-theme .note-card-title {
      color: #f8fafc;
    }

    body.smart-tools-dark-theme .back-btn,
    body.smart-tools-dark-theme .card,
    body.smart-tools-dark-theme .note-card,
    body.smart-tools-dark-theme .empty-notes-box {
      background: linear-gradient(180deg, rgba(30,41,59,0.88), rgba(15,23,42,0.84));
      border-color: rgba(148,163,184,0.20);
      color: #f8fafc;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 14px 34px rgba(0,0,0,0.22);
    }

    body.smart-tools-dark-theme .card-subtitle,
    body.smart-tools-dark-theme .note-card-body,
    body.smart-tools-dark-theme .empty-notes-box {
      color: #cbd5e1;
    }

    body.smart-tools-dark-theme .note-card-date {
      color: #94a3b8;
    }

    body.smart-tools-dark-theme .notes-input,
    body.smart-tools-dark-theme .notes-textarea {
      background: rgba(15,23,42,0.82);
      color: #f8fafc;
      border-color: rgba(148,163,184,0.30);
    }

    body.smart-tools-dark-theme .notes-input::placeholder,
    body.smart-tools-dark-theme .notes-textarea::placeholder {
      color: #94a3b8;
    }

    /* =========================
       COLOR THEME
    ========================= */
    body.smart-tools-color-theme {
      background:
        radial-gradient(circle at top left, rgba(96,165,250,0.24), transparent 30%),
        radial-gradient(circle at top right, rgba(244,114,182,0.22), transparent 32%),
        linear-gradient(180deg, #f4f7ff 0%, #eef2ff 48%, #f8fafc 100%);
      color: #111827;
    }

    body.smart-tools-color-theme .top-bar-title,
    body.smart-tools-color-theme .card-title,
    body.smart-tools-color-theme .note-card-title {
      color: #111827;
    }

    body.smart-tools-color-theme .back-btn,
    body.smart-tools-color-theme .card,
    body.smart-tools-color-theme .note-card {
      background: white;
      color: #111827;
      border-color: rgba(15,23,42,0.07);
      box-shadow: 0 14px 34px rgba(15,23,42,0.10);
    }

    body.smart-tools-color-theme .card-subtitle,
    body.smart-tools-color-theme .note-card-body {
      color: #64748b;
    }

    body.smart-tools-color-theme .notes-input,
    body.smart-tools-color-theme .notes-textarea {
      background: #fcfcff;
      color: #111827;
      border-color: #e5e7eb;
    }

    /* =========================
       RESPONSIVE
    ========================= */
    @media (max-width: 900px) {
      .notes-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .top-bar-wrap {
        padding: 16px 4% 0 4%;
      }

      .page-inner {
        padding: 0 5% 30px 5%;
      }

      .inner-page-hero {
        padding: 26px 18px;
        border-radius: 24px;
      }

      .inner-page-hero h1 {
        font-size: 28px;
      }

      .inner-page-hero p {
        font-size: 16px;
      }

      .card {
        border-radius: 24px;
        padding: 20px;
      }

      .card-title {
        font-size: 21px;
      }

      .top-bar-title {
        font-size: 20px;
      }

      .back-btn,
      .top-bar-spacer {
        width: 48px;
        height: 48px;
      }

      .button-row {
        flex-direction: column;
      }

      .action-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body class="smart-tools-color-theme">

  <!-- =========================
       NOTES PAGE
  ========================= -->
  <div class="top-bar-wrap">
    <div class="top-bar">
      <button class="back-btn" onclick="goBackToMainPage()">←</button>
      <div class="top-bar-title">Notes</div>
      <div class="top-bar-spacer"></div>
    </div>
  </div>

  <div class="page-inner">

    <div class="inner-page-hero">
      <h1>Notes</h1>
      <p>
        Save quick notes, reminders, customer details, or anything you need.
        Your notes stay saved on this phone or browser.
      </p>
    </div>

    <div class="notes-layout">

      <!-- =========================
           NOTE FORM
      ========================= -->
      <div>
        <div class="card">
          <div class="card-title">Add Note</div>
          <div class="card-subtitle">Write your note and press Save Note.</div>

          <div id="editingNotePill" class="editing-pill">
            Editing note
          </div>

          <input
            id="noteTitleInput"
            class="notes-input"
            type="text"
            placeholder="Note title"
          />

          <textarea
            id="noteBodyInput"
            class="notes-textarea"
            placeholder="Write your note here..."
          ></textarea>

          <div class="button-row" style="margin-top:16px;">
            <button id="saveNoteBtn" class="action-btn save-btn" onclick="saveNote()">Save Note</button>
            <button class="action-btn reset-btn" onclick="resetNoteForm()">Clear</button>
          </div>
        </div>
      </div>

      <!-- =========================
           SAVED NOTES
      ========================= -->
      <div>
        <div class="card">
          <div class="card-title">Saved Notes</div>
          <div class="card-subtitle">Your saved notes will show below.</div>

          <div id="notesList" class="note-list"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // =========================
    // BACK TO MAIN PAGE
    // =========================
    function goBackToMainPage() {
      window.location.href = "../";
    }

    // =========================
    // SMART TOOLS THEME
    // Follows main page key: smartToolsHomeTheme
    // =========================
    function applySmartToolsTheme() {
      const savedTheme = localStorage.getItem("smartToolsHomeTheme") || "dark";

      document.body.classList.remove("smart-tools-color-theme");
      document.body.classList.remove("smart-tools-dark-theme");

      if (savedTheme === "color") {
        document.body.classList.add("smart-tools-color-theme");
      } else {
        document.body.classList.add("smart-tools-dark-theme");
      }
    }

    // =========================
    // NOTES STATE
    // =========================
    let editingNoteId = null;

    // =========================
    // GET NOTES DATA
    // =========================
    function getNotesData() {
      const saved = localStorage.getItem("pocketToolsNotes");

      if (!saved) {
        return [];
      }

      try {
        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
          return parsed;
        }

        return [];
      } catch (error) {
        return [];
      }
    }

    // =========================
    // SAVE NOTES DATA
    // =========================
    function saveNotesData(data) {
      localStorage.setItem("pocketToolsNotes", JSON.stringify(data));
    }

    // =========================
    // SAVE NOTE
    // =========================
    function saveNote() {
      const titleInput = document.getElementById("noteTitleInput");
      const bodyInput = document.getElementById("noteBodyInput");

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();

      if (title === "" && body === "") {
        alert("Please write a title or note first.");
        return;
      }

      const notes = getNotesData();
      const now = new Date();

      const noteTitle = title === "" ? "Untitled Note" : title;

      if (editingNoteId) {
        const index = notes.findIndex(note => note.id === editingNoteId);

        if (index !== -1) {
          notes[index].title = noteTitle;
          notes[index].body = body;
          notes[index].updatedAt = now.toISOString();
        }
      } else {
        notes.unshift({
          id: "note_" + Date.now(),
          title: noteTitle,
          body: body,
          createdAt: now.toISOString(),
          updatedAt: now.toISOString()
        });
      }

      saveNotesData(notes);
      resetNoteForm();
      renderNotes();
    }

    // =========================
    // RENDER NOTES
    // =========================
    function renderNotes() {
      const notesList = document.getElementById("notesList");
      const notes = getNotesData();

      if (!notesList) return;

      if (notes.length === 0) {
        notesList.innerHTML = `
          <div class="empty-notes-box">
            No notes yet.<br>
            Add your first note from the left side.
          </div>
        `;
        return;
      }

      notesList.innerHTML = notes.map(note => {
        const safeTitle = escapeHtml(note.title || "Untitled Note");
        const safeBody = escapeHtml(note.body || "");
        const dateText = formatNoteDate(note.updatedAt || note.createdAt);

        return `
          <div class="note-card">
            <div class="note-card-title">${safeTitle}</div>
            <div class="note-card-date">Last updated: ${dateText}</div>
            <div class="note-card-body">${safeBody}</div>

            <div class="note-actions">
              <button class="small-note-btn edit-btn" onclick="editNote('${note.id}')">Edit</button>
              <button class="small-note-btn delete-btn" onclick="deleteNote('${note.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join("");

      applySmartToolsTheme();
    }

    // =========================
    // EDIT NOTE
    // =========================
    function editNote(noteId) {
      const notes = getNotesData();
      const note = notes.find(item => item.id === noteId);

      if (!note) return;

      editingNoteId = noteId;

      document.getElementById("noteTitleInput").value = note.title || "";
      document.getElementById("noteBodyInput").value = note.body || "";

      const editingPill = document.getElementById("editingNotePill");
      const saveBtn = document.getElementById("saveNoteBtn");

      if (editingPill) editingPill.classList.add("show");
      if (saveBtn) saveBtn.innerText = "Update Note";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    // =========================
    // DELETE NOTE
    // =========================
    function deleteNote(noteId) {
      const confirmDelete = confirm("Delete this note?");

      if (!confirmDelete) return;

      let notes = getNotesData();
      notes = notes.filter(note => note.id !== noteId);

      saveNotesData(notes);

      if (editingNoteId === noteId) {
        resetNoteForm();
      }

      renderNotes();
    }

    // =========================
    // RESET NOTE FORM
    // =========================
    function resetNoteForm() {
      editingNoteId = null;

      const titleInput = document.getElementById("noteTitleInput");
      const bodyInput = document.getElementById("noteBodyInput");
      const editingPill = document.getElementById("editingNotePill");
      const saveBtn = document.getElementById("saveNoteBtn");

      if (titleInput) titleInput.value = "";
      if (bodyInput) bodyInput.value = "";
      if (editingPill) editingPill.classList.remove("show");
      if (saveBtn) saveBtn.innerText = "Save Note";
    }

    // =========================
    // FORMAT NOTE DATE
    // =========================
    function formatNoteDate(value) {
      if (!value) return "";

      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleString([], {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    // =========================
    // ESCAPE HTML
    // =========================
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // =========================
    // PAGE LOAD
    // =========================
    document.addEventListener("DOMContentLoaded", function() {
      applySmartToolsTheme();
      renderNotes();
    });
  </script>

</body>
</html>
