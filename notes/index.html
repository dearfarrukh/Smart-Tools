<!DOCTYPE html>
<html lang="en">
<head>

  <!-- =========================
       IPHONE HOME SCREEN ICON
  ========================= -->

  <meta name="apple-mobile-web-app-title" content="Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" href="../images/icon.png">
  <link rel="icon" type="image/png" href="../images/icon.png">

  <!-- =========================

  <style>
    /* =========================
       RESET
    ========================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      background: #f2f2f7;
      color: #111111;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
    }

    /* =========================
       APP SHELL
    ========================= */
    .app-shell {
      width: 100%;
      min-height: 100vh;
      background: #f2f2f7;
    }

    /* =========================
       NOTES LIST PAGE
    ========================= */
    #notesListPage {
      width: 100%;
      min-height: 100vh;
      display: block;
      background: #f2f2f7;
      padding-bottom: 40px;
    }

    .notes-top-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      width: 100%;
      padding: 14px 16px 8px;
      background: rgba(242, 242, 247, 0.92);
      backdrop-filter: blur(22px);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back-main-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #007aff;
      font-size: 27px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .top-title-small {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      color: #111111;
      opacity: 0;
      pointer-events: none;
    }

    .add-note-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;

      font-size: 32px;
      font-weight: 300;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .notes-page-inner {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .big-title-row {

      margin-bottom: 10px;
      display: flex;

    .big-title {

    }

    .recovery-message {

    }

    /* =========================
       CLOUD SYNC BAR
    ========================= */
 .cloud-sync-card {

<body class="smart-tools-color-theme">

  <div class="app-shell">

    <!-- =========================
         NOTES LIST PAGE
    ========================= -->
    <div id="notesListPage">

      <div class="notes-top-bar">
        <button class="back-main-btn" onclick="goBackToMainPage()" aria-label="Back">‹</button>
        <div class="top-title-small">Notes</div>

      </div>

        <div class="big-title-row">
          <h1 class="big-title">Notes</h1>
          <div id="notesCount" class="notes-count">0 notes</div>
        </div>

        <div id="recoveryMessage" class="recovery-message"></div>

        <!-- =========================
             CLOUD SYNC CARD
        ========================= -->
        <div class="cloud-sync-card">
  <div class="cloud-main-line">
    <div id="cloudStatusLine" class="cloud-status-line not-signed-in">
      Cloud: Not signed in
    </div>

    <button id="cloudMenuDotBtn" class="cloud-menu-dot-btn" onclick="toggleCloudMenu()" aria-label="Cloud Menu">⋯</button>

<div class="cloud-btn-row" style="display:none;"></div>

 <div id="cloudMenuBox" class="cloud-menu-box">
  <button id="cloudSaveBtn" class="cloud-btn green" onclick="saveNotesToCloud(); closeCloudMenu();">Save to Cloud</button>
  <button id="cloudLoadBtn" class="cloud-btn orange" onclick="loadNotesFromCloud(); closeCloudMenu();">Load from Cloud</button>
</div>
</div>

        <div class="search-wrap">
          <div class="search-icon">⌕</div>
          <input
            id="notesSearchInput"
            type="text"
            placeholder="Search"
            oninput="renderNotes()"
          />
        </div>

          <div id="notesList"></div>

    ========================= -->

  <!-- =========================
       DELETE CONFIRM POPUP
  ========================= -->

          This note will be deleted from this phone or browser.
        </div>
        <button class="confirm-delete" onclick="confirmDeleteNote()">Delete Note</button>
      </div>

      <button class="confirm-cancel" onclick="cancelDeleteNote()">Cancel</button>
    </div>

  <script>
    // =========================
    // BACK TO MAIN PAGE
    // =========================
    function goBackToMainPage() {
      window.location.href = "../";
    }

    // =========================
    // SMART TOOLS THEME
    // Follows main page key: smartToolsHomeTheme
    // =========================
    function applySmartToolsTheme() {
      const savedTheme = localStorage.getItem("smartToolsHomeTheme") || "dark";

      document.body.classList.remove("smart-tools-color-theme");
      document.body.classList.remove("smart-tools-dark-theme");

      if (savedTheme === "color") {
        document.body.classList.add("smart-tools-color-theme");
      } else {
        document.body.classList.add("smart-tools-dark-theme");
      }
    }

    // =========================
    // NOTES STORAGE KEYS
    // Main key stays same as your old app
    // =========================
    const NOTES_MAIN_KEY = "pocketToolsNotes";
    const NOTES_DELETED_KEY = "pocketToolsDeletedNoteIds";

    const NOTES_RECOVERY_KEYS = [
      "pocketToolsNotes",
      "smartToolsNotes",
      "smartToolsNotesData",
      "smartToolsNotesDataV1",
      "smartToolsNotesDataV2",
      "notesData",
      "notes",
      "appleNotesData",
      "appleStyleNotes",
      "simpleNotes",
      "myNotes",
      "savedNotes",
      "quickNotes",
      "pocketNotes"
    ];

    // =========================
    // NOTES STATE
    // =========================
    let currentNoteId = null;
    let noteHasChanged = false;
    let pendingDeleteNoteId = null;
    let activeSwipeRow = null;
    let swipeStartX = 0;
    let swipeStartY = 0;
    let swipeCurrentX = 0;
    let swipeIsMoving = false;
    let notesCloudAutoSaveTimer = null;
    let notesCloudReady = false;
    let notesCloudAutoCheckDone = false;

    // Allows one cloud save after an intentional delete.
    // Without this, safety block thinks cloud has more notes and blocks delete sync.
    let notesAllowIntentionalDeleteCloudSave = false;

    // =========================
    // SHOW RECOVERY MESSAGE
    // =========================
    function showRecoveryMessage(message) {
      const box = document.getElementById("recoveryMessage");
      if (!box) return;

      box.innerText = message;
      box.classList.add("show");

      setTimeout(function() {
        box.classList.remove("show");
      }, 9000);
    }

    // =========================
    // DELETED NOTES SYNC HELPERS
    // These keep deleted notes deleted on phone and computer.
    // =========================
    function getDeletedNoteIds() {
      try {
        const saved = JSON.parse(localStorage.getItem(NOTES_DELETED_KEY) || "[]");
        return Array.isArray(saved) ? saved.map(String) : [];
      } catch (error) {
        return [];
      }
    }

    function saveDeletedNoteIds(ids) {
      const cleanIds = Array.from(new Set((Array.isArray(ids) ? ids : []).map(String).filter(Boolean)));
      localStorage.setItem(NOTES_DELETED_KEY, JSON.stringify(cleanIds));
      return cleanIds;
    }

    function addDeletedNoteId(noteId) {
      if (!noteId || noteId === "__new_note__") return;
      const ids = getDeletedNoteIds();
      ids.push(String(noteId));
      saveDeletedNoteIds(ids);
    }

    function mergeDeletedNoteIds(localIds, cloudIds) {
      return saveDeletedNoteIds([].concat(localIds || [], cloudIds || []));
    }

    function filterOutDeletedNotes(notes, deletedIds) {
      const deletedMap = {};
      (deletedIds || getDeletedNoteIds()).forEach(function(id) {
        deletedMap[String(id)] = true;
      });

      return (Array.isArray(notes) ? notes : []).filter(function(note) {
        return note && !deletedMap[String(note.id || "")];
      });
    }

    function normalizeDeletedNoteIdsFromCloud(cloudData) {
      if (!cloudData) return [];
      if (Array.isArray(cloudData.deletedNoteIds)) return cloudData.deletedNoteIds.map(String);
      if (Array.isArray(cloudData.deletedIds)) return cloudData.deletedIds.map(String);

    // =========================
    // AUTO CHECK / AUTO LOAD NOTES FROM CLOUD
    // =========================
    async function autoCheckNotesCloud() {
      try {
        if (notesCloudAutoCheckDone) return;
        if (!window.smartToolsCloud) return;

        if (window.smartToolsCloud.waitForAuthReady) {
          await window.smartToolsCloud.waitForAuthReady();
        }

        const user = window.smartToolsCloud.getCurrentUser();
        if (!user) return;

        notesCloudAutoCheckDone = true;
        setCloudStatus("Cloud: Checking notes...", "signed-in");

        const cloudData = await window.smartToolsCloud.loadAppData("notes");

        if (!cloudData || !Array.isArray(cloudData.notes)) {
          setCloudStatus("Cloud: Signed in as " + (user.email || "Google user") + ". No cloud notes found yet.", "signed-in");
          return;
        }

        const cloudDeletedIds = normalizeDeletedNoteIdsFromCloud(cloudData);
        const combinedDeletedIds = mergeDeletedNoteIds(getDeletedNoteIds(), cloudDeletedIds);

        const localNotesBeforeDeletedFilter = readNotesFromStorageKey(NOTES_MAIN_KEY);
        const localNotes = filterOutDeletedNotes(getNotesData(), combinedDeletedIds);

        if (localNotesBeforeDeletedFilter.length !== localNotes.length) {
          localStorage.setItem("smartToolsNotesBeforeDeletedSync", localStorage.getItem(NOTES_MAIN_KEY) || "");
          saveNotesData(localNotes, false);
          renderNotes();
        }

        const cloudNotes = filterOutDeletedNotes(
          cloudData.notes
            .map(function(item, index) {
              return normalizeNote(item, index);
            })
            .filter(function(item) {
              return item !== null;
            }),
          combinedDeletedIds
        );

        const mergedNotes = mergeNotesCloudWins(localNotes, cloudNotes, combinedDeletedIds);

        if (!areNotesListsSame(mergedNotes, localNotes)) {
          localStorage.setItem("smartToolsNotesBeforeCloudAutoLoad", localStorage.getItem(NOTES_MAIN_KEY) || "");
          saveNotesData(mergedNotes, false);
          renderNotes();
          setCloudStatus("Cloud: Auto-loaded latest cloud notes. Total " + mergedNotes.length + " note(s).", "signed-in");
          return;
        }

        if (localNotes.length > cloudNotes.length) {
          setCloudStatus("Cloud: This device has more notes. Save to Cloud when ready.", "signed-in");
          return;
        }

        setCloudStatus("Cloud: Signed in as " + (user.email || "Google user"), "signed-in");
      } catch (error) {
        console.error(error);
        setCloudStatus("Cloud auto-check failed. You can still use Load from Cloud.", "not-signed-in");
      }
    }

    // =========================
    // SAVE NOTES TO CLOUD
    // =========================
    async function saveNotesToCloud() {
      try {
        if (!window.smartToolsCloud) {
          setCloudStatus("Cloud file is not ready yet.", "not-signed-in");
          return;
        }

        const user = window.smartToolsCloud.getCurrentUser();

        if (!user) {
          setCloudStatus("Please sign in before saving to cloud.", "not-signed-in");
          return;
        }

        const deletedNoteIds = getDeletedNoteIds();
        const notes = filterOutDeletedNotes(getNotesData(), deletedNoteIds);

        setCloudStatus("Cloud: Checking before save...", "signed-in");

        const cloudData = await window.smartToolsCloud.loadAppData("notes");
        const cloudDeletedIds = normalizeDeletedNoteIdsFromCloud(cloudData);
        const combinedDeletedIds = mergeDeletedNoteIds(deletedNoteIds, cloudDeletedIds);

        const cloudNotes = cloudData && Array.isArray(cloudData.notes)
          ? filterOutDeletedNotes(cloudData.notes.map(function(item, index) {
              return normalizeNote(item, index);
            }).filter(function(item) {
              return item !== null;
            }), combinedDeletedIds)
          : [];

        const localNotes = filterOutDeletedNotes(notes, combinedDeletedIds);

        if (cloudNotes.length > localNotes.length && !notesAllowIntentionalDeleteCloudSave) {
          setCloudStatus("Cloud has more notes. Load from Cloud first to avoid overwriting.", "not-signed-in");
          alert("Cloud has more notes than this device.\n\nPlease press Load from Cloud first, then add/edit, then save again.");
          return;
        }

        setCloudStatus("Cloud: Saving notes...", "signed-in");

        await window.smartToolsCloud.saveAppData("notes", {
          notes: localNotes,
          deletedNoteIds: combinedDeletedIds,
          savedAt: new Date().toISOString(),
          recordCount: localNotes.length,
          source: "Smart Tools Notes"
        });

        notesAllowIntentionalDeleteCloudSave = false;

        setCloudStatus("Cloud: Saved " + localNotes.length + " note(s).", "signed-in");
      } catch (error) {
        console.error(error);
        setCloudStatus("Cloud save failed. Check Firebase rules and internet.", "not-signed-in");
      }
    }

    // =========================
    // LOAD NOTES FROM CLOUD
    // Merges cloud notes with local notes, then saves locally
    // =========================
    async function loadNotesFromCloud() {
      try {
        if (!window.smartToolsCloud) {
          setCloudStatus("Cloud file is not ready yet.", "not-signed-in");
          return;
        }

        const user = window.smartToolsCloud.getCurrentUser();

        if (!user) {
          setCloudStatus("Please sign in before loading from cloud.", "not-signed-in");
          return;
        }

        setCloudStatus("Cloud: Loading notes...", "signed-in");

        const cloudData = await window.smartToolsCloud.loadAppData("notes");

        if (!cloudData || !Array.isArray(cloudData.notes)) {
          setCloudStatus("Cloud: No saved notes found yet. Press Save to Cloud first.", "signed-in");
          return;
        }

        const combinedDeletedIds = mergeDeletedNoteIds(getDeletedNoteIds(), normalizeDeletedNoteIdsFromCloud(cloudData));

        const localNotes = filterOutDeletedNotes(getNotesData(), combinedDeletedIds);
        const cloudNotes = filterOutDeletedNotes(
          cloudData.notes
            .map(function(item, index) {
              return normalizeNote(item, index);
            })
            .filter(function(item) {
              return item !== null;
            }),
          combinedDeletedIds
        );

        const mergedNotes = mergeNotesCloudWins(localNotes, cloudNotes, combinedDeletedIds);

        localStorage.setItem("smartToolsNotesBeforeCloudLoad", localStorage.getItem(NOTES_MAIN_KEY) || "");
        notesAllowIntentionalDeleteCloudSave = false;
        saveNotesData(mergedNotes, false);
        renderNotes();

        setCloudStatus("Cloud: Loaded latest cloud notes. Total " + mergedNotes.length + " note(s).", "signed-in");
      } catch (error) {

    // =========================
    // SCHEDULE CLOUD AUTO SAVE
    // Saves after local save, but not every second
    // =========================
    function scheduleNotesCloudAutoSave() {
      if (!window.smartToolsCloud) return;

      const user = window.smartToolsCloud.getCurrentUser();

      clearTimeout(notesCloudAutoSaveTimer);

      notesCloudAutoSaveTimer = setTimeout(function() {

    // =========================
    // NORMALIZE NOTE
    // Makes old saved note formats work
    // =========================
    function normalizeNote(rawNote, index) {
      if (!rawNote || typeof rawNote !== "object") {
        return null;
      }

      const now = new Date().toISOString();

      const body =
        rawNote.body ||
        rawNote.text ||
        rawNote.note ||
        rawNote.content ||
        rawNote.description ||
        "";

      const title =
        rawNote.title ||
        rawNote.heading ||
        rawNote.name ||
        "";

      const finalBody = String(body || title || "").trim();

      if (finalBody === "") {
        return null;
      }

      return {
        id: rawNote.id || rawNote.noteId || ("recovered_note_" + Date.now() + "_" + index + "_" + Math.random().toString(16).slice(2)),
        title: "",
        body: finalBody,
        createdAt: rawNote.createdAt || rawNote.dateCreated || rawNote.created || rawNote.date || rawNote.time || now,
        updatedAt: rawNote.updatedAt || rawNote.dateUpdated || rawNote.modified || rawNote.date || rawNote.time || now
      };
    }

    // =========================
    // READ NOTES ARRAY FROM STORAGE KEY
    // Supports array format and object formats
    // =========================
    function readNotesFromStorageKey(key) {
      const saved = localStorage.getItem(key);

      if (!saved) {
        return [];
      }

      try {
        const parsed = JSON.parse(saved);

        let rawList = [];

        if (Array.isArray(parsed)) {
          rawList = parsed;
        } else if (parsed && Array.isArray(parsed.notes)) {
          rawList = parsed.notes;
        } else if (parsed && Array.isArray(parsed.data)) {
          rawList = parsed.data;
        } else if (parsed && Array.isArray(parsed.items)) {
          rawList = parsed.items;
        } else {
          return [];
        }

        return rawList
          .map(function(item, index) {
            return normalizeNote(item, index);
          })
          .filter(function(item) {
            return item !== null;
          });
      } catch (error) {
        return [];
      }
    }

    // =========================
    // DEDUPE NOTES
    // Stops duplicate copies after recovery/cloud merge
    // =========================
    function dedupeNotes(notes) {
      const seenById = {};
      const seenByBody = {};
      const clean = [];

      notes.forEach(function(note) {
        const body = String(note.body || "").trim();

        if (body === "") {
          return;
        }

        if (note.id && seenById[note.id]) {
          return;
        }

        const bodyKey = body + "___" + String(note.updatedAt || "");

        if (seenByBody[bodyKey]) {
          return;
        }

        if (note.id) {
          seenById[note.id] = true;
        }

        seenByBody[bodyKey] = true;
        clean.push(note);
      });

      clean.sort(function(a, b) {
        const timeA = new Date(a.updatedAt || a.createdAt || 0).getTime();
        const timeB = new Date(b.updatedAt || b.createdAt || 0).getTime();
        return timeB - timeA;
      });

      return clean;
    }

    // =========================
    // MERGE NOTES - CLOUD WINS
    // Important:
    // - Local-only notes stay safe.
    // - If the same note exists on cloud and local, cloud version replaces local.
    // - Deleted note IDs stay deleted on every device.
    // =========================
    function mergeNotesCloudWins(localNotes, cloudNotes, deletedIds) {
      const noteMap = {};

      filterOutDeletedNotes(localNotes || [], deletedIds).forEach(function(note) {
        if (!note || !note.id) return;
        noteMap[String(note.id)] = note;
      });

      filterOutDeletedNotes(cloudNotes || [], deletedIds).forEach(function(note) {
        if (!note || !note.id) return;
        noteMap[String(note.id)] = note;
      });

      return filterOutDeletedNotes(dedupeNotes(Object.values(noteMap)), deletedIds);
    }

    // =========================
    // COMPARE NOTES LISTS
    // Used so auto-load can update even when count is same
    // =========================
    function areNotesListsSame(listA, listB) {
      const cleanA = dedupeNotes(listA || []).map(function(note) {
        return {
          id: String(note.id || ""),
          body: String(note.body || ""),
          updatedAt: String(note.updatedAt || ""),
          createdAt: String(note.createdAt || "")
        };
      }).sort(function(a, b) {
        return a.id.localeCompare(b.id);
      });

      const cleanB = dedupeNotes(listB || []).map(function(note) {
        return {
          id: String(note.id || ""),
          body: String(note.body || ""),
          updatedAt: String(note.updatedAt || ""),
          createdAt: String(note.createdAt || "")
        };
      }).sort(function(a, b) {
        return a.id.localeCompare(b.id);
      });

      return JSON.stringify(cleanA) === JSON.stringify(cleanB);
    }

    // =========================
    // RECOVER OLD NOTES IF NEEDED
    // Important:
    // - Does not erase old keys
    // - Copies found notes into pocketToolsNotes
    // =========================
    function recoverOldNotesIfNeeded() {
      const currentNotes = readNotesFromStorageKey(NOTES_MAIN_KEY);
      let allFoundNotes = [].concat(currentNotes);
      let foundFromOtherKeys = 0;

      NOTES_RECOVERY_KEYS.forEach(function(key) {
        if (key === NOTES_MAIN_KEY) {
          return;
        }

        const notesFromKey = readNotesFromStorageKey(key);

        if (notesFromKey.length > 0) {
          foundFromOtherKeys += notesFromKey.length;
          allFoundNotes = allFoundNotes.concat(notesFromKey);
        }
      });

      const mergedNotes = dedupeNotes(allFoundNotes);

      if (mergedNotes.length > currentNotes.length) {
        saveNotesData(mergedNotes, false);
        showRecoveryMessage("Recovered " + mergedNotes.length + " saved notes into this Notes page.");
      } else if (currentNotes.length > 0) {
        saveNotesData(dedupeNotes(currentNotes), false);
      }
    }

    // =========================
    // GET NOTES DATA
    // =========================
    function getNotesData() {
      const saved = localStorage.getItem(NOTES_MAIN_KEY);

      if (!saved) {
        return [];
      }

      try {
        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
          return filterOutDeletedNotes(parsed
            .map(function(item, index) {
              return normalizeNote(item, index);
            })
            .filter(function(item) {
              return item !== null;
            }));
        }

        if (parsed && Array.isArray(parsed.notes)) {
          return filterOutDeletedNotes(parsed.notes
            .map(function(item, index) {
              return normalizeNote(item, index);
            })
            .filter(function(item) {
              return item !== null;
            }));
        }

        return [];
      } catch (error) {
        return [];
      }
    }

    // =========================
    // SAVE NOTES DATA
    // =========================
    function saveNotesData(data, shouldCloudSave = true) {
      const cleanData = filterOutDeletedNotes(dedupeNotes(Array.isArray(data) ? data : []));
      localStorage.setItem(NOTES_MAIN_KEY, JSON.stringify(cleanData));

      // Safety backup with same latest data
      localStorage.setItem("smartToolsNotesBackup", JSON.stringify(cleanData));

      if (shouldCloudSave) {
        scheduleNotesCloudAutoSave();
      }
    }

    // =========================
    // CLEAN NOTE BODY
    // =========================
    function cleanNoteBody(value) {
      return String(value || "").replace(/\r\n/g, "\n").trim();
    }

    // =========================
    // GET NOTE HEADING
    // If no title, first line becomes heading
    // =========================
    function getNoteHeading(note) {
      const title = String(note.title || "").trim();
      const body = String(note.body || "").trim();

      if (title !== "" && title !== "Untitled Note") {
        return title;
      }

      if (body !== "") {
        const lines = body.split("\n").map(function(line) {
          return line.trim();
        }).filter(function(line) {
          return line !== "";
        });

        if (lines.length > 0) {
          return lines[0];
        }
      }

      return "New Note";
    }

    // =========================
    // GET NOTE PREVIEW
    // =========================
    function getNotePreview(note) {
      const body = String(note.body || "").trim();

      if (body === "") {
        return "No additional text";
      }

      const lines = body.split("\n").map(function(line) {
        return line.trim();
      }).filter(function(line) {
        return line !== "";
      });

      if (lines.length <= 1) {
        return "No additional text";
      }

      return lines.slice(1).join(" ");
    }

    // =========================
    // RENDER NOTES LIST
    // =========================
    function renderNotes() {
      const notesList = document.getElementById("notesList");
      const notesCount = document.getElementById("notesCount");
      const searchInput = document.getElementById("notesSearchInput");

      if (!notesList) return;

      const allNotes = getNotesData();
      const searchText = searchInput ? searchInput.value.trim().toLowerCase() : "";

      const filteredNotes = allNotes.filter(function(note) {
        const heading = getNoteHeading(note).toLowerCase();
        const body = String(note.body || "").toLowerCase();

        if (searchText === "") {
          return true;
        }

        return heading.includes(searchText) || body.includes(searchText);
      });

      if (notesCount) {
        const total = allNotes.length;
        notesCount.innerText = total === 1 ? "1 note" : total + " notes";
      }

      if (filteredNotes.length === 0) {
        if (allNotes.length === 0) {
          notesList.innerHTML = `
            <div class="empty-notes-box">
              <div class="empty-notes-icon">📝</div>
              No Notes<br>
              Tap + to create your first note.
            </div>
          `;
        } else {
          notesList.innerHTML = `
            <div class="empty-notes-box">
              No matching notes.
            </div>
          `;
        }

        return;
      }

      notesList.innerHTML = filteredNotes.map(function(note) {
        const heading = escapeHtml(getNoteHeading(note));
        const preview = escapeHtml(getNotePreview(note));
        const dateText = escapeHtml(formatAppleNoteDate(note.updatedAt || note.createdAt));

        return `
          <div class="note-row-wrap" data-note-id="${escapeHtml(note.id)}">
            <div class="note-delete-bg">
              <button class="note-delete-btn" onclick="askDeleteNoteFromList('${escapeJs(note.id)}', event)">Delete</button>
            </div>

            <div
              class="note-row"
              onclick="openExistingNote('${escapeJs(note.id)}')"
              ontouchstart="startSwipe(event, this)"
              ontouchmove="moveSwipe(event, this)"
              ontouchend="endSwipe(event, this)"
              onmousedown="startMouseSwipe(event, this)"
            >
              <div class="note-row-title">${heading}</div>
              <div class="note-row-date">${dateText}</div>
              <div class="note-row-preview">${preview}</div>
            </div>
          </div>
        `;
      }).join("");

      applySmartToolsTheme();
    }

    // =========================
    // MARK NOTE CHANGED
    // =========================
    function markNoteChanged() {
      noteHasChanged = true;

      const editor = document.getElementById("noteBodyEditor");
      const editorTopTitle = document.getElementById("editorTopTitle");

      if (editorTopTitle && editor) {

    // =========================
    // SAVE CURRENT NOTE IF NEEDED
    // =========================
    function saveCurrentNoteIfNeeded() {
      const editor = document.getElementById("noteBodyEditor");
      if (!editor) return;

      const body = cleanNoteBody(editor.value);
      const notes = getNotesData();
      const now = new Date().toISOString();

      if (currentNoteId === null && body === "") {
        return;
      }

      if (currentNoteId === null) {
        notes.unshift({
          id: "note_" + Date.now() + "_" + Math.random().toString(16).slice(2),
          title: "",
          body: body,
          createdAt: now,
          updatedAt: now
        });

        saveNotesData(notes);
        return;
      }

      const index = notes.findIndex(function(note) {
        return note.id === currentNoteId;
      });

      if (index === -1) {
        return;
      }

      if (body === "") {
        addDeletedNoteId(currentNoteId);
        notesAllowIntentionalDeleteCloudSave = true;
        notes.splice(index, 1);
        saveNotesData(notes);
        return;
      }

      notes[index].title = "";
      notes[index].body = body;
      notes[index].updatedAt = now;

      saveNotesData(notes);
    }

    // =========================
    // ASK DELETE CURRENT NOTE
    // =========================
    function askDeleteCurrentNote() {
      if (currentNoteId === null) {
        const editor = document.getElementById("noteBodyEditor");

        if (editor && editor.value.trim() !== "") {
          pendingDeleteNoteId = "__new_note__";
          showDeleteConfirm();
        }

        return;
      }

      pendingDeleteNoteId = currentNoteId;
      showDeleteConfirm();
    }

    // =========================
    // ASK DELETE NOTE FROM LIST
    // =========================
    function askDeleteNoteFromList(noteId, event) {
      if (event) {
        event.stopPropagation();
      }

      pendingDeleteNoteId = noteId;
      showDeleteConfirm();
    }

    // =========================
    // SHOW DELETE CONFIRM
    // =========================
    function showDeleteConfirm() {
      const overlay = document.getElementById("deleteConfirmOverlay");
      if (overlay) overlay.classList.add("show");
    }

    // =========================
    // CANCEL DELETE NOTE
    // =========================
    function cancelDeleteNote() {
      const overlay = document.getElementById("deleteConfirmOverlay");
      if (overlay) overlay.classList.remove("show");

      pendingDeleteNoteId = null;
      closeAnyOpenSwipe();
    }

    // =========================
    // CONFIRM DELETE NOTE
    // =========================
    function confirmDeleteNote() {
      const overlay = document.getElementById("deleteConfirmOverlay");
      if (overlay) overlay.classList.remove("show");

      if (!pendingDeleteNoteId) return;

      if (pendingDeleteNoteId === "__new_note__") {
        const editor = document.getElementById("noteBodyEditor");
        if (editor) editor.value = "";

        pendingDeleteNoteId = null;
        closeNoteEditor();
        return;
      }

      let notes = getNotesData();

      addDeletedNoteId(pendingDeleteNoteId);

      notes = notes.filter(function(note) {
        return note.id !== pendingDeleteNoteId;
      });

      notesAllowIntentionalDeleteCloudSave = true;
      saveNotesData(notes);

      if (currentNoteId === pendingDeleteNoteId) {
        currentNoteId = null;
        pendingDeleteNoteId = null;

        const notesListPage = document.getElementById("notesListPage");
        const noteEditorPage = document.getElementById("noteEditorPage");

        if (noteEditorPage) noteEditorPage.style.display = "none";
        if (notesListPage) notesListPage.style.display = "block";

        renderNotes();
        return;
      }

      pendingDeleteNoteId = null;
      closeAnyOpenSwipe();
      renderNotes();
    }

    // =========================
    // AUTO RESIZE EDITOR
    // =========================
    function autoResizeEditor() {
      const editor = document.getElementById("noteBodyEditor");
      if (!editor) return;

      editor.style.height = "auto";
      editor.style.height = Math.max(editor.scrollHeight, window.innerHeight - 145) + "px";
    }

    // =========================
    // SWIPE START TOUCH
    // =========================
    function startSwipe(event, row) {
      if (!event.touches || event.touches.length !== 1) return;

      swipeStartX = event.touches[0].clientX;
      swipeStartY = event.touches[0].clientY;
      swipeCurrentX = swipeStartX;
      swipeIsMoving = false;

      if (activeSwipeRow && activeSwipeRow !== row) {
        activeSwipeRow.style.transform = "translateX(0px)";
        activeSwipeRow = null;
      }
    }

    // =========================
    // SWIPE MOVE TOUCH
    // =========================
    function moveSwipe(event, row) {
      if (!event.touches || event.touches.length !== 1) return;

      const currentX = event.touches[0].clientX;
      const currentY = event.touches[0].clientY;

      const diffX = currentX - swipeStartX;
      const diffY = currentY - swipeStartY;

      if (Math.abs(diffY) > Math.abs(diffX)) {
        return;
      }

      if (diffX < -8) {
        swipeIsMoving = true;
        event.preventDefault();

        const moveAmount = Math.max(diffX, -92);
        row.style.transform = "translateX(" + moveAmount + "px)";
        activeSwipeRow = row;
      }

      if (diffX > 8 && activeSwipeRow === row) {
        swipeIsMoving = true;
        event.preventDefault();

        const moveAmount = Math.min(-92 + diffX, 0);
        row.style.transform = "translateX(" + moveAmount + "px)";
      }

      swipeCurrentX = currentX;
    }

    // =========================
    // SWIPE END TOUCH
    // =========================
    function endSwipe(event, row) {
      const diffX = swipeCurrentX - swipeStartX;

      if (diffX < -46) {
        row.style.transform = "translateX(-92px)";
        activeSwipeRow = row;
      } else {
        row.style.transform = "translateX(0px)";

        if (activeSwipeRow === row) {
          activeSwipeRow = null;
        }
      }

      setTimeout(function() {
        swipeIsMoving = false;
      }, 180);
    }

    // =========================
    // MOUSE SWIPE FOR DESKTOP TESTING
    // =========================
    function startMouseSwipe(event, row) {
      swipeStartX = event.clientX;
      swipeStartY = event.clientY;
      swipeCurrentX = swipeStartX;
      swipeIsMoving = false;

      if (activeSwipeRow && activeSwipeRow !== row) {
        activeSwipeRow.style.transform = "translateX(0px)";
        activeSwipeRow = null;
      }

      function onMouseMove(moveEvent) {
        const diffX = moveEvent.clientX - swipeStartX;
        const diffY = moveEvent.clientY - swipeStartY;

        if (Math.abs(diffY) > Math.abs(diffX)) {
          return;
        }

        if (diffX < -8) {
          swipeIsMoving = true;
          const moveAmount = Math.max(diffX, -92);
          row.style.transform = "translateX(" + moveAmount + "px)";
          activeSwipeRow = row;
        }

        if (diffX > 8 && activeSwipeRow === row) {
          swipeIsMoving = true;
          const moveAmount = Math.min(-92 + diffX, 0);
          row.style.transform = "translateX(" + moveAmount + "px)";
        }

        swipeCurrentX = moveEvent.clientX;
      }

      function onMouseUp() {
        const diffX = swipeCurrentX - swipeStartX;

        if (diffX < -46) {
          row.style.transform = "translateX(-92px)";
          activeSwipeRow = row;
        } else {
          row.style.transform = "translateX(0px)";

          if (activeSwipeRow === row) {
            activeSwipeRow = null;
          }
        }

        setTimeout(function() {
          swipeIsMoving = false;
        }, 180);

        document.removeEventListener("mousemove", onMouseMove);
        document.removeEventListener("mouseup", onMouseUp);
      }

      document.addEventListener("mousemove", onMouseMove);
      document.addEventListener("mouseup", onMouseUp);
    }

    // =========================
    // CLOSE OPEN SWIPE ROW
    // =========================
    function closeAnyOpenSwipe() {
      if (activeSwipeRow) {
        activeSwipeRow.style.transform = "translateX(0px)";
        activeSwipeRow = null;
      }
    }

    // =========================
    // FORMAT APPLE NOTE DATE
    // =========================
    function formatAppleNoteDate(value) {
      if (!value) return "";

      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return "";
      }

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const noteDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const diffDays = Math.round((today - noteDay) / 86400000);

      if (diffDays === 0) {
        return date.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        });
      }

      if (diffDays === 1) {
        return "Yesterday";
      }

      if (diffDays > 1 && diffDays < 7) {
        return date.toLocaleDateString([], {
          weekday: "long"
        });
      }

      return date.toLocaleDateString([], {
        month: "numeric",
        day: "numeric",
        year: "2-digit"
      });
    }

    // =========================
    // FORMAT EDITOR DATE
    // =========================
    function formatEditorDate(value) {
      if (!value) return "";

      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleString([], {
        month: "long",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    // =========================
    // ESCAPE HTML
    // =========================
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // =========================
    // ESCAPE JS STRING
    // =========================
    function escapeJs(value) {
      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "");
    }

    // =========================
    // CLOUD USER CHANGE LISTENER
    // =========================
    window.addEventListener("smartToolsCloudUserChanged", function() {
      updateCloudButtons();
      notesCloudAutoCheckDone = false;
      autoCheckNotesCloud();
    });

    // =========================
    // CLOSE SWIPE WHEN CLICKING OUTSIDE
    // =========================
   document.addEventListener("click", function(event) {
  const rowWrap = event.target.closest(".note-row-wrap");
  const deleteOverlay = event.target.closest("#deleteConfirmOverlay");
  const cloudCard = event.target.closest(".cloud-sync-card");

  if (!rowWrap && !deleteOverlay) {
    closeAnyOpenSwipe();
  }

  if (!cloudCard) {
    closeCloudMenu();
  }
});

    // =========================
    // SAVE WHEN LEAVING PAGE
    // =========================
    window.addEventListener("beforeunload", function() {
      const noteEditorPage = document.getElementById("noteEditorPage");

      if (noteEditorPage && noteEditorPage.style.display === "block") {
        saveCurrentNoteIfNeeded();
      }
    });

    // =========================
    // PAGE LOAD
    // =========================
    document.addEventListener("DOMContentLoaded", function() {
      applySmartToolsTheme();
      recoverOldNotesIfNeeded();
      renderNotes();
      updateCloudButtons();
      waitForCloudFile();
    });
  </script>

</body>
