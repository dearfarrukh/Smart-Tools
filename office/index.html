<!DOCTYPE html>
<html lang="en">
<head>

  <!-- =========================
       IPHONE HOME SCREEN ICON
  ========================= -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Office Tools">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" href="../images/icon.png">
  <link rel="icon" type="image/png" href="../images/icon.png">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Office Tools</title>

  <style>
    /* =========================
       RESET
    ========================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      padding-bottom: 34px;
      color: #111827;
      background:
        radial-gradient(circle at top left, rgba(96,165,250,0.24), transparent 30%),
        radial-gradient(circle at top right, rgba(244,114,182,0.22), transparent 32%),
        linear-gradient(180deg, #f4f7ff 0%, #eef2ff 48%, #f8fafc 100%);
    }

    button {
      font: inherit;
    }

    /* =========================
       PAGE TOP BAR
    ========================= */
    .top-bar-wrap {
      width: 100%;
      padding: 20px 4% 0 4%;
    }

    .top-bar {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .back-btn {
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: white;
      color: #111827;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.10);
      cursor: pointer;
      flex-shrink: 0;
    }

    .back-btn:active {
      transform: scale(0.96);
    }

    .top-bar-title {
      flex: 1;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.4px;
    }

    .top-bar-spacer {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    /* =========================
       PAGE LAYOUT
    ========================= */
    .page-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 4% 40px 4%;
    }

    .inner-page-hero {
      margin-top: 18px;
      background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #8b5cf6 100%);
      color: white;
      border-radius: 30px;
      padding: 32px 24px;
      box-shadow: 0 14px 32px rgba(139, 92, 246, 0.20);
    }

    .inner-page-hero h1 {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 12px;
      letter-spacing: -0.8px;
    }

    .inner-page-hero p {
      font-size: 17px;
      line-height: 1.6;
      color: rgba(255,255,255,0.95);
      max-width: 760px;
    }

    /* =========================
       OFFICE TOOL GRID
    ========================= */
    .office-grid {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .office-card {
      min-height: 190px;
      border: none;
      border-radius: 28px;
      padding: 24px;
      cursor: pointer;
      color: #111827;
      text-align: left;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(15,23,42,0.07);
      box-shadow: 0 14px 34px rgba(15,23,42,0.10);
      position: relative;
      overflow: hidden;
    }

    .office-card:active {
      transform: scale(0.98);
    }

    .office-icon {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 28px;
      background: linear-gradient(135deg, #fef3c7, #dbeafe);
    }

    .office-card h3 {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -0.4px;
    }

    .office-card p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.55;
      max-width: 92%;
      font-weight: 700;
    }

    .office-arrow {
      position: absolute;
      right: 20px;
      bottom: 18px;
      font-size: 30px;
      color: #94a3b8;
    }

    .coming-card {
      opacity: 0.72;
    }

    /* =========================
       DARK THEME
    ========================= */
    body.smart-tools-dark-theme {
      background:
        radial-gradient(circle at top left, rgba(34,197,94,0.12), transparent 30%),
        radial-gradient(circle at top right, rgba(14,165,233,0.10), transparent 32%),
        linear-gradient(180deg, #07111f 0%, #0b1626 52%, #07111f 100%);
      color: #f8fafc;
    }

    body.smart-tools-dark-theme .top-bar-title {
      color: #f8fafc;
    }

    body.smart-tools-dark-theme .back-btn,
    body.smart-tools-dark-theme .office-card {
      background: linear-gradient(180deg, rgba(30,41,59,0.88), rgba(15,23,42,0.84));
      border-color: rgba(148,163,184,0.20);
      color: #f8fafc;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 14px 34px rgba(0,0,0,0.22);
    }

    body.smart-tools-dark-theme .office-card p {
      color: #cbd5e1;
    }

    body.smart-tools-dark-theme .office-arrow {
      color: #94a3b8;
    }

    /* =========================
       RESPONSIVE
    ========================= */
    @media (max-width: 900px) {
      .office-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .top-bar-wrap {
        padding: 16px 4% 0 4%;
      }

      .page-inner {
        padding: 0 5% 30px 5%;
      }

      .inner-page-hero {
        padding: 26px 18px;
        border-radius: 24px;
      }

      .inner-page-hero h1 {
        font-size: 28px;
      }

      .inner-page-hero p {
        font-size: 16px;
      }

      .top-bar-title {
        font-size: 20px;
      }

      .back-btn,
      .top-bar-spacer {
        width: 48px;
        height: 48px;
      }

      .office-grid {
        grid-template-columns: 1fr;
      }

      .office-card {
        min-height: 170px;
        border-radius: 24px;
        padding: 20px;
      }
    }
  </style>
</head>

<body class="smart-tools-color-theme">

  <!-- =========================
       OFFICE TOOLS PAGE
  ========================= -->
  <div class="top-bar-wrap">
    <div class="top-bar">
      <button class="back-btn" onclick="goBackToMainPage()">←</button>
      <div class="top-bar-title">Office</div>
      <div class="top-bar-spacer"></div>
    </div>
  </div>

  <div class="page-inner">

    <div class="inner-page-hero">
      <h1>Office Tools</h1>
      <p>
        Office-only tools for work forms, contracts, customer documents, CSV files, and business shortcuts.
      </p>
    </div>

    <div class="office-grid">

      <!-- =========================
           CONTRACT GENERATOR CARD
      ========================= -->
      <button class="office-card" onclick="openContractGenerator()">
        <div class="office-icon">📄</div>
        <h3>Contract Generator</h3>
        <p>Generate WFC / NFC fuel price contracts from clean templates.</p>
        <div class="office-arrow">›</div>
      </button>

      <!-- =========================
           CSV CONVERTER CARD
      ========================= -->
      <button class="office-card" onclick="openCsvConverter()">
        <div class="office-icon">📊</div>
        <h3>PDF / Excel to CSV</h3>
        <p>Extract bank data and make upload-ready CSV files.</p>
        <div class="office-arrow">›</div>
      </button>

      <!-- =========================
           FUTURE OFFICE TOOL PLACEHOLDER
      ========================= -->
      <button class="office-card coming-card" onclick="showComingSoon()">
        <div class="office-icon">🗂️</div>
        <h3>More Office Tools</h3>
        <p>We can add more office apps here later.</p>
        <div class="office-arrow">›</div>
      </button>

    </div>

  </div>

  <script>
    // =========================
    // BACK TO MAIN PAGE
    // =========================
    function goBackToMainPage() {
      window.location.href = "../";
    }

    // =========================
    // OPEN CONTRACT GENERATOR
    // =========================
    function openContractGenerator() {
      window.location.href = "../contract-generator/";
    }

    // =========================
    // OPEN CSV CONVERTER
    // =========================
    function openCsvConverter() {
      window.location.href = "../csvconverter/";
    }

    // =========================
    // COMING SOON
    // =========================
    function showComingSoon() {
      alert("We can add more office tools here later.");
    }

    // =========================
    // OFFICE PAGE THEME
    // Follows main page key: smartToolsHomeTheme
    // =========================
    function applyOfficeTheme() {
      const savedTheme = localStorage.getItem("smartToolsHomeTheme") || "dark";

      document.body.classList.remove("smart-tools-color-theme");
      document.body.classList.remove("smart-tools-dark-theme");

      if (savedTheme === "color") {
        document.body.classList.add("smart-tools-color-theme");
      } else {
        document.body.classList.add("smart-tools-dark-theme");
      }
    }

    // =========================
    // PAGE LOAD
    // =========================
    document.addEventListener("DOMContentLoaded", function() {
      applyOfficeTheme();
    });
  </script>

</body>
</html>
