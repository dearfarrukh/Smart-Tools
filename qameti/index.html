<!DOCTYPE html>
<html lang="en">
<head>

  <!-- =========================
       IPHONE HOME SCREEN ICON
  ========================= -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Qameti Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" href="../images/icon.png">
  <link rel="icon" type="image/png" href="../images/icon.png">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Qameti Tracker</title>

  <!-- =========================
       FIREBASE CLOUD SYNC FILE
       Uses main Smart Tools Google login
  ========================= -->
  <script type="module" src="../shared/cloud-sync.js"></script>

  <style>
    /* =========================
       RESET
    ========================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
      padding-bottom: 34px;
      color: #111827;
      background:
        radial-gradient(circle at top left, rgba(96,165,250,0.24), transparent 30%),
        radial-gradient(circle at top right, rgba(244,114,182,0.22), transparent 32%),
        linear-gradient(180deg, #f4f7ff 0%, #eef2ff 48%, #f8fafc 100%);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* =========================
       PAGE TOP BAR
    ========================= */
    .top-bar-wrap {
      width: 100%;
      padding: 20px 4% 0 4%;
    }

    .top-bar {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .back-btn {
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: white;
      color: #111827;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.10);
      cursor: pointer;
      flex-shrink: 0;
    }

    .back-btn:active {
      transform: scale(0.96);
    }

    .top-bar-title {
      flex: 1;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.4px;
    }

    /* =========================
       PAGE LAYOUT
    ========================= */
    .page-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px 4% 40px 4%;
    }

    /* =========================
       CLOUD SYNC CARD
    ========================= */
    .cloud-sync-card {
      width: 100%;
      margin-bottom: 18px;
      padding: 10px 12px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 10px 24px rgba(15,23,42,0.08);
      position: relative;
      border: 1px solid rgba(15,23,42,0.07);
    }

    .cloud-main-line {
      width: 100%;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cloud-status-line {
      font-size: 14px;
      line-height: 1.35;
      font-weight: 900;
      color: #9a3412;
    }

    .cloud-status-line.signed-in {
      color: #166534;
    }

    .cloud-menu-dot-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: #e5e5ea;
      color: #111827;
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cloud-menu-dot-btn.show {
      display: flex;
    }

    .cloud-menu-box {
      display: none;
      position: absolute;
      top: 52px;
      right: 12px;
      z-index: 50;
      width: 220px;
      padding: 8px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 14px 34px rgba(0,0,0,0.16);
    }

    .cloud-menu-box.show {
      display: grid;
      gap: 8px;
    }

    .cloud-menu-action {
      min-height: 42px;
      border: none;
      border-radius: 13px;
      color: white;
      font-size: 14px;
      font-weight: 900;
      padding: 0 12px;
      cursor: pointer;
    }

    .cloud-menu-action.green { background: #16a34a; }
    .cloud-menu-action.orange { background: #f97316; }

    /* =========================
       SHARED CARDS
    ========================= */
    .card {
      background: white;
      border: 1px solid rgba(15,23,42,0.07);
      color: #111827;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 14px 34px rgba(15,23,42,0.10);
    }

    .card + .card { margin-top: 22px; }

    .card-title {
      font-size: 24px;
      font-weight: 900;
      color: #111827;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .card-subtitle {
      font-size: 15px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 18px;
    }

    .small-help {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.7;
      color: #64748b;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .action-btn {
      border: none;
      min-height: 58px;
      border-radius: 18px;
      padding: 0 24px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
      flex: 1;
      transition: transform 0.16s ease, opacity 0.16s ease;
      color: white;
    }

    .action-btn:active { transform: scale(0.97); }
    .find-btn { background: linear-gradient(135deg, #22c55e 0%, #14b8a6 100%); }
    .reset-btn { background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%); }
    .purple-btn { background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%); }

    .result-box {
      min-height: 250px;
      border-radius: 22px;
      padding: 18px;
      background: linear-gradient(180deg, #f9fafb 0%, #f3f4f6 100%);
      border: 1px solid #eef2f7;
    }

    .result-success {
      background: linear-gradient(180deg, #ecfdf5 0%, #d1fae5 100%);
      border: 1px solid #86efac;
    }

    .result-placeholder {
      color: #64748b;
      font-size: 16px;
      line-height: 1.7;
    }

    .text-input,
    .date-input,
    .select-input,
    .notes-textarea {
      width: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 18px;
      padding: 0 16px;
      outline: none;
      font-size: 18px;
      background: #fcfcff;
      color: #111827;
    }

    .text-input,
    .date-input,
    .select-input { height: 58px; }

    .notes-textarea {
      min-height: 150px;
      resize: vertical;
      padding: 16px;
      line-height: 1.6;
    }

    .text-input:focus,
    .date-input:focus,
    .select-input:focus,
    .notes-textarea:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16,185,129,0.10);
    }

    /* =========================
       RUNNING QAMETI CARD
    ========================= */
    .running-section-title {
      font-size: 15px;
      font-weight: 900;
      color: #475569;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .running-card-list {
      display: grid;
      gap: 14px;
      margin-bottom: 22px;
    }

    .running-qameti-card {
      border: none;
      width: 100%;
      min-height: 92px;
      text-align: left;
      border-radius: 26px;
      padding: 20px;
      color: white;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.28), transparent 34%),
        linear-gradient(135deg, #16a34a 0%, #0ea5e9 100%);
      box-shadow: 0 16px 34px rgba(14,165,233,0.24);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .running-qameti-card:active { transform: scale(0.98); }

    .running-qameti-name {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }

    .running-qameti-progress {
      font-size: 15px;
      font-weight: 900;
      margin-top: 6px;
      color: rgba(255,255,255,0.92);
    }

    .running-qameti-arrow {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .no-running-box {
      background: white;
      border: 1px dashed #cbd5e1;
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 22px;
      color: #64748b;
      font-size: 16px;
      line-height: 1.6;
      text-align: center;
    }

    /* =========================
       PREVIOUS DROPDOWN AREA
    ========================= */
    .previous-card { margin-bottom: 22px; }

    .previous-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .previous-title {
      font-size: 19px;
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.3px;
    }

    .previous-small {
      font-size: 13px;
      color: #64748b;
      font-weight: 800;
    }

    .qameti-select {
      width: 100%;
      height: 58px;
      border: 2px solid #dbeafe;
      border-radius: 18px;
      padding: 0 16px;
      background: white;
      color: #111827;
      font-size: 17px;
      font-weight: 900;
      outline: none;
      box-shadow: 0 10px 24px rgba(15,23,42,0.06);
    }

    /* =========================
       QAMETI TRACKER DETAIL
    ========================= */
    .qameti-detail-wrap {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 22px;
      align-items: start;
    }

    .qameti-summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .qameti-summary-mini {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 16px;
    }

    .qameti-summary-mini-label {
      font-size: 12px;
      font-weight: 900;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .qameti-summary-mini-value {
      font-size: 22px;
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.5px;
      word-break: break-word;
    }

    .qameti-progress-bar {
      width: 100%;
      height: 14px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 16px;
    }

    .qameti-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e 0%, #0ea5e9 100%);
      border-radius: 999px;
      width: 0%;
    }

    .qameti-month-list {
      display: grid;
      gap: 14px;
    }

    .qameti-month-row {
      border: 1px solid #e5e7eb;
      width: 100%;
      text-align: left;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(15,23,42,0.06);
      cursor: pointer;
    }

    .qameti-month-row.paid {
      background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 100%);
      border-color: #bbf7d0;
    }

    .qameti-month-row.pending {
      background: linear-gradient(180deg, #fff7ed 0%, #ffffff 100%);
      border-color: #fed7aa;
    }

    .qameti-month-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .qameti-month-title {
      font-size: 20px;
      font-weight: 900;
      color: #111827;
    }

    .qameti-status-pill {
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .qameti-status-pill.paid { background: #dcfce7; color: #166534; }
    .qameti-status-pill.pending { background: #ffedd5; color: #9a3412; }

    .qameti-month-details {
      font-size: 15px;
      line-height: 1.7;
      color: #374151;
      font-weight: 700;
    }

    /* =========================
       QAMETI POPUP
    ========================= */
    .qameti-popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(15,23,42,0.55);
      padding: 24px 4%;
      overflow: auto;
    }

    .qameti-popup-card {
      width: 100%;
      max-width: 620px;
      margin: 30px auto;
      background: white;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(15,23,42,0.30);
    }

    .qameti-popup-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .qameti-popup-title {
      font-size: 26px;
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.6px;
    }

    .qameti-close-btn {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: #f3f4f6;
      color: #111827;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
    }

    .qameti-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .qameti-field-label {
      display: block;
      font-size: 13px;
      font-weight: 900;
      color: #475569;
      margin-bottom: 8px;
    }

    .qameti-full-field { grid-column: 1 / -1; }

    .qameti-month-picker-grid {
      display: grid;
      grid-template-columns: 52px 1fr 1fr 52px;
      gap: 8px;
      align-items: center;
    }

    .qameti-year-btn {
      height: 58px;
      border: none;
      border-radius: 18px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 26px;
      font-weight: 900;
      cursor: pointer;
    }

    /* =========================
       DARK THEME
    ========================= */
    body.smart-tools-dark-theme {
      background:
        radial-gradient(circle at top left, rgba(34,197,94,0.12), transparent 30%),
        radial-gradient(circle at top right, rgba(14,165,233,0.10), transparent 32%),
        linear-gradient(180deg, #07111f 0%, #0b1626 52%, #07111f 100%);
      color: #f8fafc;
    }

    body.smart-tools-dark-theme .top-bar-title,
    body.smart-tools-dark-theme .card-title,
    body.smart-tools-dark-theme .qameti-popup-title,
    body.smart-tools-dark-theme .qameti-month-title,
    body.smart-tools-dark-theme .qameti-summary-mini-value,
    body.smart-tools-dark-theme .previous-title,
    body.smart-tools-dark-theme .running-section-title {
      color: #f8fafc;
    }

    body.smart-tools-dark-theme .back-btn,
    body.smart-tools-dark-theme .card,
    body.smart-tools-dark-theme .qameti-popup-card,
    body.smart-tools-dark-theme .qameti-summary-mini,
    body.smart-tools-dark-theme .qameti-month-row,
    body.smart-tools-dark-theme .result-box,
    body.smart-tools-dark-theme .previous-card,
    body.smart-tools-dark-theme .no-running-box,
    body.smart-tools-dark-theme .cloud-sync-card,
    body.smart-tools-dark-theme .cloud-menu-box {
      background: linear-gradient(180deg, rgba(30,41,59,0.88), rgba(15,23,42,0.84));
      border-color: rgba(148,163,184,0.20);
      color: #f8fafc;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 14px 34px rgba(0,0,0,0.22);
    }

    body.smart-tools-dark-theme .card-subtitle,
    body.smart-tools-dark-theme .small-help,
    body.smart-tools-dark-theme .result-placeholder,
    body.smart-tools-dark-theme .qameti-month-details,
    body.smart-tools-dark-theme .qameti-summary-mini-label,
    body.smart-tools-dark-theme .qameti-field-label,
    body.smart-tools-dark-theme .previous-small {
      color: #cbd5e1;
    }

    body.smart-tools-dark-theme .text-input,
    body.smart-tools-dark-theme .date-input,
    body.smart-tools-dark-theme .select-input,
    body.smart-tools-dark-theme .notes-textarea,
    body.smart-tools-dark-theme .qameti-select {
      background: rgba(15,23,42,0.82);
      color: #f8fafc;
      border-color: rgba(148,163,184,0.30);
    }

    body.smart-tools-dark-theme .text-input::placeholder,
    body.smart-tools-dark-theme .notes-textarea::placeholder { color: #94a3b8; }
    body.smart-tools-dark-theme .qameti-month-row.paid { background: linear-gradient(180deg, rgba(20,83,45,0.42), rgba(15,23,42,0.86)); border-color: rgba(34,197,94,0.30); }
    body.smart-tools-dark-theme .qameti-month-row.pending { background: linear-gradient(180deg, rgba(124,45,18,0.42), rgba(15,23,42,0.86)); border-color: rgba(251,146,60,0.30); }
    body.smart-tools-dark-theme .qameti-close-btn,
    body.smart-tools-dark-theme .qameti-year-btn { background: rgba(148,163,184,0.16); color: #f8fafc; }
    body.smart-tools-dark-theme .qameti-progress-bar { background: rgba(148,163,184,0.20); }
    body.smart-tools-dark-theme .cloud-status-line { color: #fed7aa; }
    body.smart-tools-dark-theme .cloud-status-line.signed-in { color: #bbf7d0; }
    body.smart-tools-dark-theme .cloud-menu-dot-btn { background: #2c2c2e; color: #f8fafc; }

    /* =========================
       RESPONSIVE
    ========================= */
    @media (max-width: 900px) {
      .qameti-detail-wrap { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .top-bar-wrap { padding: 16px 4% 0 4%; }
      .page-inner { padding: 18px 5% 30px 5%; }
      .card { border-radius: 24px; padding: 20px; }
      .card-title { font-size: 21px; }
      .top-bar-title { font-size: 20px; }
      .back-btn { width: 48px; height: 48px; }
      .running-qameti-name { font-size: 20px; }
      .qameti-form-grid,
      .qameti-summary-grid { grid-template-columns: 1fr; }
      .qameti-month-picker-grid { grid-template-columns: 44px 1fr 1fr 44px; gap: 6px; }
      .qameti-popup-overlay { padding: 16px 4%; }
      .qameti-popup-card { margin: 14px auto; padding: 20px; border-radius: 24px; }
      .button-row { flex-direction: column; }
      .action-btn { width: 100%; }
    }
  </style>
</head>

<body class="smart-tools-color-theme">

  <!-- =========================
       QAMETI TRACKER PAGE
  ========================= -->
  <div class="top-bar-wrap">
    <div class="top-bar">
      <button class="back-btn" onclick="goBackToMainPage()">←</button>
      <div class="top-bar-title">Qameti Tracker</div>
      <button class="back-btn" onclick="openAddQametiPopup()" title="Add Qameti">+</button>
    </div>
  </div>

  <div class="page-inner">

    <!-- =========================
         CLOUD SYNC CARD
    ========================= -->
    <div class="cloud-sync-card">
      <div class="cloud-main-line">
        <div id="qametiCloudStatusLine" class="cloud-status-line">
          Cloud: Not signed in. Sign in from Smart Tools main menu.
        </div>

        <button id="qametiCloudMenuDotBtn" class="cloud-menu-dot-btn" onclick="toggleQametiCloudMenu()" aria-label="Cloud Menu">⋯</button>
      </div>

      <div id="qametiCloudMenuBox" class="cloud-menu-box">
        <button class="cloud-menu-action green" onclick="saveQametiToCloud(); closeQametiCloudMenu();">Save Qameti to Cloud</button>
        <button class="cloud-menu-action orange" onclick="loadQametiFromCloud(); closeQametiCloudMenu();">Load Qameti from Cloud</button>
      </div>
    </div>

    <!-- =========================
         RUNNING QAMETI CARDS
    ========================= -->
    <div class="running-section-title">Running Qameti</div>
    <div id="runningQametiCards" class="running-card-list"></div>

    <!-- =========================
         PREVIOUS / COMPLETED DROPDOWN ONLY
    ========================= -->
    <div class="card previous-card">
      <div class="previous-title-row">
        <div>
          <div class="previous-title">Previous / Completed</div>
          <div class="previous-small">Dropdown only shows completed qameti records.</div>
        </div>
      </div>

      <select id="qametiSelect" class="qameti-select" onchange="changeSelectedQameti()">
        <option value="">No Completed Qameti Yet</option>
      </select>
    </div>

    <!-- =========================
         DETAIL AREA
    ========================= -->
    <div id="qametiContent"></div>

  </div>

  <!-- =========================
       ADD QAMETI POPUP
  ========================= -->
  <div id="qametiAddPopup" class="qameti-popup-overlay">
    <div class="qameti-popup-card">
      <div class="qameti-popup-title-row">
        <div class="qameti-popup-title">Add New Qameti</div>
        <button class="qameti-close-btn" onclick="closeAddQametiPopup()">×</button>
      </div>

      <div class="qameti-form-grid">
        <label class="qameti-full-field">
          <span class="qameti-field-label">Qameti Name</span>
          <input id="qametiNameInput" class="text-input" type="text" placeholder="Example: Family Qameti 2026">
        </label>

        <label>
          <span class="qameti-field-label">Currency</span>
          <select id="qametiCurrencyInput" class="select-input">
            <option value="$">$ Dollar</option>
            <option value="Rs">Rs Rupees</option>
            <option value="Custom">Custom</option>
          </select>
        </label>

        <label>
          <span class="qameti-field-label">Custom Currency</span>
          <input id="qametiCustomCurrencyInput" class="text-input" type="text" placeholder="Example: AED">
        </label>

        <label>
          <span class="qameti-field-label">Number of Members</span>
          <input id="qametiMembersInput" class="text-input" type="number" min="1" placeholder="10" oninput="updateQametiAutoTotal()">
        </label>

        <label>
          <span class="qameti-field-label">Monthly Contribution</span>

          <input id="qametiTotalInput" class="text-input" type="number" min="0" step="0.01" placeholder="Auto total">

          <span class="qameti-field-label">How Many Months</span>
          <input id="qametiMonthsInput" class="text-input" type="number" min="1" placeholder="10">

        <label>
          <span class="qameti-field-label">Start Month</span>
          <input id="qametiStartMonthInput" type="hidden">

              <option value="04">April</option>
              <option value="05">May</option>
              <option value="06">June</option>
              <option value="07">July</option>
              <option value="08">August</option>

            <button type="button" class="qameti-year-btn" onclick="changeQametiStartYear(1)">›</button>

          <div class="small-help">Use ‹ and › to go back or forward by year.</div>
        </label>

        <label>
          <span class="qameti-field-label">Payment Due Day</span>
          <input id="qametiDueDayInput" class="text-input" type="number" min="1" max="31" value="5">

      <div class="button-row" style="margin-top:20px;">

        <button class="action-btn reset-btn" onclick="closeAddQametiPopup()">Cancel</button>

  <!-- =========================
       QAMETI PAYMENT POPUP
  ========================= -->
  <div id="qametiPaymentPopup" class="qameti-popup-overlay">
    <div class="qameti-popup-card">
      <div class="qameti-popup-title-row">
        <div id="qametiPaymentPopupTitle" class="qameti-popup-title">Edit Payment</div>
        <button class="qameti-close-btn" onclick="closeQametiPaymentPopup()">×</button>
      </div>

      <input id="qametiEditingPaymentIndex" type="hidden">

      <div class="qameti-form-grid">
        <label>
          <span class="qameti-field-label">Due Date</span>
          <input id="qametiPaymentDueDateInput" class="date-input" type="date">

        <label>
          <span class="qameti-field-label">Paid Date</span>
          <input id="qametiPaymentPaidDateInput" class="date-input" type="date">

          <span class="qameti-field-label">How I Paid</span>
          <select id="qametiPaymentMethodInput" class="select-input">

            <option value="Zelle">Zelle</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Check">Check</option>
            <option value="Other">Other</option>
          </select>
        </label>

        <label class="qameti-full-field">
          <span class="qameti-field-label">Notes</span>

      <div class="button-row" style="margin-top:20px;">
        <button class="action-btn find-btn" onclick="saveQametiPayment()">Save Payment</button>
        <button class="action-btn purple-btn" onclick="markQametiPaymentUnpaid()">Mark Unpaid</button>
        <button class="action-btn reset-btn" onclick="closeQametiPaymentPopup()">Cancel</button>
      </div>

  <script>
    // =========================
    // BACK TO MAIN PAGE
    // =========================
    function goBackToMainPage() {
      window.location.href = "../";
    }

    // =========================
    // SMART TOOLS THEME
    // Follows main page key: smartToolsHomeTheme
    // =========================
    function applySmartToolsTheme() {
      const savedTheme = localStorage.getItem("smartToolsHomeTheme") || "dark";

      document.body.classList.remove("smart-tools-color-theme");
      document.body.classList.remove("smart-tools-dark-theme");

      if (savedTheme === "color") {
        document.body.classList.add("smart-tools-color-theme");
      } else {
        document.body.classList.add("smart-tools-dark-theme");
      }
    }

    // =========================
    // QAMETI TRACKER DATA
    // =========================
    const QAMETI_DATA_KEY = "pocketToolsQametiData";
    let currentQametiId = null;

    function getQametiData() {
      try {
        const saved = JSON.parse(localStorage.getItem(QAMETI_DATA_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        return [];
      }
    }

    function saveQametiData(data, shouldCloudSave = true) {
      localStorage.setItem(QAMETI_DATA_KEY, JSON.stringify(data));
      localStorage.setItem("smartToolsQametiBackup", JSON.stringify(data));

      if (shouldCloudSave) {
        scheduleQametiCloudAutoSave();
      }
    }

    // =========================
    // QAMETI CLOUD STATE
    // =========================
    let qametiCloudAutoSaveTimer = null;
    let qametiCloudAutoCheckDone = false;

    function setQametiCloudStatus(message, signedIn) {
      const line = document.getElementById("qametiCloudStatusLine");
      if (!line) return;
      line.innerText = message;
      line.classList.toggle("signed-in", !!signedIn);
    }

    function updateQametiCloudUI() {
      const cloud = window.smartToolsCloud;
      const user = cloud && cloud.getCurrentUser ? cloud.getCurrentUser() : null;
      const dotBtn = document.getElementById("qametiCloudMenuDotBtn");
      const menuBox = document.getElementById("qametiCloudMenuBox");

      if (user) {
        setQametiCloudStatus("Cloud: Signed in as " + (user.email || "Google user"), true);
        if (dotBtn) dotBtn.classList.add("show");
      } else {
        setQametiCloudStatus("Cloud: Not signed in. Sign in from Smart Tools main menu.", false);
        if (dotBtn) dotBtn.classList.remove("show");
        if (menuBox) menuBox.classList.remove("show");
      }
    }

    function waitForQametiCloudFile() {
      let tries = 0;
      const timer = setInterval(function() {
        tries++;
        if (window.smartToolsCloud) {
          clearInterval(timer);
          updateQametiCloudUI();
          autoCheckQametiCloud();
          return;
        }
        if (tries > 40) {
          clearInterval(timer);
          setQametiCloudStatus("Cloud file not loaded. Check shared/cloud-sync.js", false);
        }
      }, 250);
    }

    function toggleQametiCloudMenu() {
      const menuBox = document.getElementById("qametiCloudMenuBox");
      if (!menuBox) return;
      menuBox.classList.toggle("show");
    }

    function closeQametiCloudMenu() {
      const menuBox = document.getElementById("qametiCloudMenuBox");
      if (!menuBox) return;
      menuBox.classList.remove("show");
    }



    // =========================
    // COUNT QAMETI RECORDS
    // =========================
    function countQametiRecords(qametiData) {
      if (!Array.isArray(qametiData)) return 0;

      let total = qametiData.length;

      qametiData.forEach(function(qameti) {
        total += Array.isArray(qameti.payments) ? qameti.payments.length : 0;
      });

      return total;
    }

    // =========================
    // APPLY QAMETI CLOUD DATA
    // =========================
    function applyQametiCloudData(cloudQametiData) {
      localStorage.setItem("smartToolsQametiBeforeCloudLoad", localStorage.getItem(QAMETI_DATA_KEY) || "");
      saveQametiData(cloudQametiData, false);

      currentQametiId = null;
      repairAllQametiPaymentMonths();
      clearSelectedQameti();
      renderQametiPage();
    }

    // =========================
    // AUTO CHECK / AUTO LOAD QAMETI FROM CLOUD
    // =========================
    async function autoCheckQametiCloud() {
      try {
        if (qametiCloudAutoCheckDone) return;
        if (!window.smartToolsCloud) return;

        if (window.smartToolsCloud.waitForAuthReady) {
          await window.smartToolsCloud.waitForAuthReady();
        }

        const user = window.smartToolsCloud.getCurrentUser();
        if (!user) return;

        qametiCloudAutoCheckDone = true;
        setQametiCloudStatus("Cloud: Checking Qameti...", true);

        const cloudData = await window.smartToolsCloud.loadAppData("qameti");

        if (!cloudData || !Array.isArray(cloudData.qametiData)) {
          setQametiCloudStatus("Cloud: Signed in as " + (user.email || "Google user") + ". No cloud Qameti found yet.", true);
          return;
        }

        const localCount = countQametiRecords(getQametiData());
        const cloudCount = countQametiRecords(cloudData.qametiData);

        if (cloudCount > localCount) {
          applyQametiCloudData(cloudData.qametiData);
          setQametiCloudStatus("Cloud: Auto-loaded Qameti from cloud.", true);
          return;
        }

        if (localCount > cloudCount) {
          setQametiCloudStatus("Cloud: This device has more Qameti records. Save to Cloud when ready.", true);
          return;
        }

        setQametiCloudStatus("Cloud: Signed in as " + (user.email || "Google user"), true);
      } catch (error) {
        console.error(error);
        setQametiCloudStatus("Cloud auto-check failed. You can still use Load from Cloud.", false);
      }
    }


    async function saveQametiToCloud() {
      try {
        if (!window.smartToolsCloud) {
          setQametiCloudStatus("Cloud file is not ready yet.", false);
          return;
        }

        const user = window.smartToolsCloud.getCurrentUser();
        if (!user) {
          setQametiCloudStatus("Sign in from Smart Tools main menu first.", false);
          return;
        }

        const qametiData = getQametiData();
        const localCount = countQametiRecords(qametiData);

        setQametiCloudStatus("Cloud: Checking before save...", true);

        const cloudData = await window.smartToolsCloud.loadAppData("qameti");
        const cloudCount = cloudData && Array.isArray(cloudData.qametiData) ? countQametiRecords(cloudData.qametiData) : 0;

        if (cloudCount > localCount) {
          setQametiCloudStatus("Cloud has more Qameti records. Load from Cloud first to avoid overwriting.", false);
          alert("Cloud has more Qameti records than this device.\n\nPlease press Load Qameti from Cloud first, then add/edit, then save again.");
          return;
        }

        setQametiCloudStatus("Cloud: Saving Qameti...", true);

        await window.smartToolsCloud.saveAppData("qameti", {
          qametiData: qametiData,
          savedAt: new Date().toISOString(),
          recordCount: localCount,
          source: "Smart Tools Qameti"
        });

        setQametiCloudStatus("Cloud: Qameti saved.", true);
      } catch (error) {
        console.error(error);
        setQametiCloudStatus("Cloud save failed. Check internet or Firebase rules.", false);
      }
    }

    async function loadQametiFromCloud(skipConfirm = false) {
      try {
        if (!window.smartToolsCloud) {
          setQametiCloudStatus("Cloud file is not ready yet.", false);
          return;
        }

        const user = window.smartToolsCloud.getCurrentUser();
        if (!user) {
          setQametiCloudStatus("Sign in from Smart Tools main menu first.", false);
          return;
        }

        setQametiCloudStatus("Cloud: Loading Qameti...", true);
        const cloudData = await window.smartToolsCloud.loadAppData("qameti");

        if (!cloudData || !Array.isArray(cloudData.qametiData)) {
          setQametiCloudStatus("Cloud: No Qameti data found yet.", true);
          return;
        }

        if (!skipConfirm) {
          const confirmed = confirm("Load Qameti from cloud?\n\nThis will replace Qameti data on this device with your cloud copy. A local backup will be saved before loading.");
          if (!confirmed) {
            setQametiCloudStatus("Cloud load cancelled.", true);
            return;
          }
        }

        applyQametiCloudData(cloudData.qametiData);

        setQametiCloudStatus("Cloud: Qameti loaded.", true);
      } catch (error) {
        console.error(error);
        setQametiCloudStatus("Cloud load failed. Check internet or Firebase rules.", false);
      }
    }

    function scheduleQametiCloudAutoSave() {
      if (!window.smartToolsCloud) return;
      const user = window.smartToolsCloud.getCurrentUser();
      if (!user) return;

      clearTimeout(qametiCloudAutoSaveTimer);
      qametiCloudAutoSaveTimer = setTimeout(function() {
        saveQametiToCloud();
      }, 1800);
    }

    window.addEventListener("smartToolsCloudUserChanged", function() {
      updateQametiCloudUI();
      qametiCloudAutoCheckDone = false;
      autoCheckQametiCloud();
    });

    // =========================
    // CHECK QAMETI COMPLETED
    // =========================
    function isQametiCompleted(qameti) {
      const months = Number(qameti.months || 0);
      if (!months) return false;
      return getQametiPaidCount(qameti) >= months;
    }

    function getRunningQametis() {
      const data = getQametiData();
      return data.filter(qameti => !isQametiCompleted(qameti)).sort((a, b) => {
        const aTime = new Date((a.startMonth || "1900-01") + "-01").getTime();
        const bTime = new Date((b.startMonth || "1900-01") + "-01").getTime();
        return bTime - aTime;
      });
    }

    function getCompletedQametis() {
      const data = getQametiData();
      return data.filter(qameti => isQametiCompleted(qameti)).sort((a, b) => {
        const aTime = new Date((a.startMonth || "1900-01") + "-01").getTime();
        const bTime = new Date((b.startMonth || "1900-01") + "-01").getTime();
        return bTime - aTime;
      });
    }

    function repairAllQametiPaymentMonths() {
      const data = getQametiData();
      let changed = false;

      data.forEach(qameti => {
        const months = Number(qameti.months || 0);
        const monthly = Number(qameti.monthly || 0);
        const dueDay = Number(qameti.dueDay || 5);
        const startMonth = qameti.startMonth || getCurrentMonthInputValue();
        const oldPayments = Array.isArray(qameti.payments) ? qameti.payments : [];
        const newPayments = [];

        for (let i = 0; i < months; i++) {
          const monthInfo = getQametiMonthInfo(startMonth, i, dueDay);
          const oldPayment = oldPayments[i] || {};
          newPayments.push({
            label: monthInfo.label,
            dueDate: oldPayment.dueDate || monthInfo.date,
            paidDate: oldPayment.paidDate || "",
            method: oldPayment.method || "",
            amount: oldPayment.amount || monthly,
            notes: oldPayment.notes || ""
          });
        }

        if (JSON.stringify(oldPayments) !== JSON.stringify(newPayments)) {
          qameti.payments = newPayments;
          changed = true;
        }
      });

      if (changed) saveQametiData(data);
    }

    function clearSelectedQameti() {
      currentQametiId = null;
      const select = document.getElementById("qametiSelect");
      if (select) select.value = "";
      const content = document.getElementById("qametiContent");
      if (content) content.innerHTML = "";
    }

    function changeSelectedQameti() {
      const select = document.getElementById("qametiSelect");
      if (!select) return;
      currentQametiId = select.value || null;
      renderQametiDetailOnly();
    }

    function openRunningQametiDetail(qametiId) {
      currentQametiId = qametiId;
      const select = document.getElementById("qametiSelect");
      if (select) select.value = "";
      renderQametiDetailOnly();
      setTimeout(function() {
        const content = document.getElementById("qametiContent");
        if (content) content.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 80);
    }

    function getCurrentQameti() {
      const data = getQametiData();
      return data.find(item => item.id === currentQametiId) || null;
    }

    function renderQametiPage() {
      renderRunningQametiCards();
      renderQametiDropdown();
      renderQametiDetailOnly();
      applySmartToolsTheme();
    }

    function renderRunningQametiCards() {
      const wrap = document.getElementById("runningQametiCards");
      if (!wrap) return;
      const running = getRunningQametis();

      if (!running.length) {
        wrap.innerHTML = `<div class="no-running-box">No running qameti right now. Press + to create a new one.</div>`;
        return;
      }

      wrap.innerHTML = running.map(qameti => {
        const paidCount = getQametiPaidCount(qameti);
        const months = Number(qameti.months || 0);
        return `
          <button class="running-qameti-card" onclick="openRunningQametiDetail('${escapeHtml(qameti.id)}')">
            <div>
              <div class="running-qameti-name">${escapeHtml(qameti.name)}</div>
              <div class="running-qameti-progress">${paidCount}/${months} done</div>
            </div>
            <div class="running-qameti-arrow">›</div>
          </button>
        `;
      }).join("");
    }

    function renderQametiDropdown() {
      const select = document.getElementById("qametiSelect");
      if (!select) return;
      const completed = getCompletedQametis();

      if (!completed.length) {
        select.innerHTML = `<option value="">No Completed Qameti Yet</option>`;
        select.value = "";
        return;
      }

      let html = `<option value="">Choose Previous / Completed</option>`;
      html += completed.map(item => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)} — Completed</option>`).join("");
      select.innerHTML = html;
      select.value = currentQametiId && completed.some(item => item.id === currentQametiId) ? currentQametiId : "";
    }

    function renderQametiDetailOnly() {
      const content = document.getElementById("qametiContent");
      if (!content) return;
      const qameti = getCurrentQameti();

      if (!qameti) {
        content.innerHTML = "";
        return;
      }

      const months = Number(qameti.months || 0);
      const paidCount = getQametiPaidCount(qameti);
      const percent = months ? Math.round((paidCount / months) * 100) : 0;
      const totalPaid = getQametiTotalPaid(qameti);
      const remaining = Math.max(Number(qameti.total || 0) - totalPaid, 0);
      const receiveText = getQametiReceiveText(qameti);
      const completedText = isQametiCompleted(qameti) ? "Completed" : "Running";

      content.innerHTML = `
        <div class="qameti-detail-wrap">
          <div>
            <div class="card">
              <div class="card-title">${escapeHtml(qameti.name)}</div>
              <div class="card-subtitle">
                Status: ${completedText} • Started: ${escapeHtml(qameti.startMonth || "—")} • Due day: ${escapeHtml(qameti.dueDay || "—")}
              </div>

              <div class="qameti-summary-grid">
                <div class="qameti-summary-mini"><div class="qameti-summary-mini-label">Monthly</div><div class="qameti-summary-mini-value">${escapeHtml(qameti.currency)}${formatQametiMoney(qameti.monthly)}</div></div>
                <div class="qameti-summary-mini"><div class="qameti-summary-mini-label">Total</div><div class="qameti-summary-mini-value">${escapeHtml(qameti.currency)}${formatQametiMoney(qameti.total)}</div></div>
                <div class="qameti-summary-mini"><div class="qameti-summary-mini-label">Members</div><div class="qameti-summary-mini-value">${escapeHtml(qameti.members)}</div></div>
                <div class="qameti-summary-mini"><div class="qameti-summary-mini-label">Months</div><div class="qameti-summary-mini-value">${escapeHtml(qameti.months)}</div></div>
              </div>

              <div class="qameti-progress-bar"><div class="qameti-progress-fill" style="width:${percent}%;"></div></div>
              <div class="small-help"><strong>${paidCount}/${months}</strong> months paid • ${percent}% complete</div>
            </div>

            <div class="card">
              <div class="card-title">My Turn</div>
              <div class="card-subtitle">Track the month you receive the full qameti payout.</div>
              <div class="result-box result-success" style="min-height:auto;"><div class="result-placeholder">${receiveText}</div></div>
            </div>

            <div class="card">
              <div class="card-title">Payment Total</div>
              <div class="qameti-summary-grid">
                <div class="qameti-summary-mini"><div class="qameti-summary-mini-label">Paid So Far</div><div class="qameti-summary-mini-value">${escapeHtml(qameti.currency)}${formatQametiMoney(totalPaid)}</div></div>
                <div class="qameti-summary-mini"><div class="qameti-summary-mini-label">Remaining</div><div class="qameti-summary-mini-value">${escapeHtml(qameti.currency)}${formatQametiMoney(remaining)}</div></div>
              </div>
              <div class="button-row" style="margin-top:18px;"><button class="action-btn reset-btn" onclick="deleteCurrentQameti()">Delete This Qameti</button></div>
            </div>
          </div>

          <div>
            <div class="card">
              <div class="card-title">Monthly Payment Lines</div>
              <div class="card-subtitle">Tap any month to add paid date, payment method, amount, and notes.</div>
              <div class="qameti-month-list">${renderQametiPaymentRows(qameti)}</div>
            </div>
          </div>
        </div>
      `;

      applySmartToolsTheme();
    }

    function renderQametiPaymentRows(qameti) {
      const payments = qameti.payments || [];
      if (!payments.length) return `<div class="result-placeholder">No payment months were created.</div>`;

      return payments.map((payment, index) => {
        const isPaid = !!payment.paidDate;
        const rowClass = isPaid ? "paid" : "pending";
        const statusText = isPaid ? "✅ Paid" : "⏳ Pending";
        const method = payment.method || "—";
        const paidDate = payment.paidDate || "Not yet";
        const amount = Number(payment.amount || qameti.monthly || 0);

        return `
          <button class="qameti-month-row ${rowClass}" onclick="openQametiPaymentPopup(${index})">
            <div class="qameti-month-title-row">
              <div class="qameti-month-title">${escapeHtml(payment.label || ("Month " + (index + 1)))}</div>
              <div class="qameti-status-pill ${rowClass}">${statusText}</div>
            </div>
            <div class="qameti-month-details">
              Due: ${escapeHtml(payment.dueDate || "—")}<br>
              Paid: ${escapeHtml(paidDate)}<br>
              Method: ${escapeHtml(method)}<br>
              Amount: ${escapeHtml(qameti.currency)}${formatQametiMoney(amount)}
            </div>
          </button>
        `;
      }).join("");
    }

    function openAddQametiPopup() {
      const popup = document.getElementById("qametiAddPopup");
      if (!popup) return;

      document.getElementById("qametiNameInput").value = "";
      document.getElementById("qametiCurrencyInput").value = "$";
      document.getElementById("qametiCustomCurrencyInput").value = "";
      document.getElementById("qametiMembersInput").value = "";
      document.getElementById("qametiMonthlyInput").value = "";
      document.getElementById("qametiTotalInput").value = "";
      document.getElementById("qametiMonthsInput").value = "";
      setQametiStartMonthValue(getCurrentMonthInputValue());
      document.getElementById("qametiDueDayInput").value = "5";
      document.getElementById("qametiReceiveMonthInput").value = "";

      popup.style.display = "block";
      applySmartToolsTheme();
    }

    function closeAddQametiPopup() {
      const popup = document.getElementById("qametiAddPopup");
      if (popup) popup.style.display = "none";
    }

    function updateQametiAutoTotal() {
      const members = Number(document.getElementById("qametiMembersInput").value || 0);
      const monthly = Number(document.getElementById("qametiMonthlyInput").value || 0);
      const totalInput = document.getElementById("qametiTotalInput");
      const monthsInput = document.getElementById("qametiMonthsInput");

      if (members > 0 && monthly > 0 && totalInput) totalInput.value = (members * monthly).toFixed(2);
      if (members > 0 && monthsInput && !monthsInput.value) monthsInput.value = members;
    }

    function buildQametiStartYearOptions(selectedYear) {
      const yearSelect = document.getElementById("qametiStartYearSelect");
      if (!yearSelect) return;

      const currentYear = new Date().getFullYear();
      const startYear = currentYear - 30;
      const endYear = currentYear + 30;
      const chosenYear = Number(selectedYear || currentYear);
      let html = "";

      for (let year = startYear; year <= endYear; year++) {
        html += `<option value="${year}" ${year === chosenYear ? "selected" : ""}>${year}</option>`;
      }

      yearSelect.innerHTML = html;
    }

    function setQametiStartMonthValue(value) {
      const cleanValue = value || getCurrentMonthInputValue();
      const parts = cleanValue.split("-");
      const year = parts[0] || String(new Date().getFullYear());
      const month = parts[1] || String(new Date().getMonth() + 1).padStart(2, "0");

      buildQametiStartYearOptions(year);

      const monthSelect = document.getElementById("qametiStartMonthSelect");
      const yearSelect = document.getElementById("qametiStartYearSelect");
      const hiddenInput = document.getElementById("qametiStartMonthInput");

      if (monthSelect) monthSelect.value = month;
      if (yearSelect) yearSelect.value = year;
      if (hiddenInput) hiddenInput.value = year + "-" + month;
    }

    function updateQametiStartMonthHidden() {
      const monthSelect = document.getElementById("qametiStartMonthSelect");
      const yearSelect = document.getElementById("qametiStartYearSelect");
      const hiddenInput = document.getElementById("qametiStartMonthInput");
      if (!monthSelect || !yearSelect || !hiddenInput) return;
      hiddenInput.value = yearSelect.value + "-" + monthSelect.value;
    }

    function changeQametiStartYear(amount) {
      const yearSelect = document.getElementById("qametiStartYearSelect");
      if (!yearSelect) return;
      const currentYear = Number(yearSelect.value || new Date().getFullYear());
      const newYear = currentYear + amount;
      buildQametiStartYearOptions(newYear);
      yearSelect.value = String(newYear);
      updateQametiStartMonthHidden();
    }

    function createNewQameti() {
      const name = document.getElementById("qametiNameInput").value.trim();
      const currencyChoice = document.getElementById("qametiCurrencyInput").value;
      const customCurrency = document.getElementById("qametiCustomCurrencyInput").value.trim();
      const members = Number(document.getElementById("qametiMembersInput").value || 0);
      const monthly = Number(document.getElementById("qametiMonthlyInput").value || 0);
      const total = Number(document.getElementById("qametiTotalInput").value || 0);
      const months = Number(document.getElementById("qametiMonthsInput").value || 0);
      const startMonth = document.getElementById("qametiStartMonthInput").value || getCurrentMonthInputValue();
      const dueDay = Number(document.getElementById("qametiDueDayInput").value || 5);
      const receiveMonth = Number(document.getElementById("qametiReceiveMonthInput").value || 0);

      if (!name) { alert("Please enter qameti name."); return; }
      if (!members || !monthly || !months) { alert("Please enter members, monthly contribution, and months."); return; }

      const currency = currencyChoice === "Custom" ? (customCurrency || "$") : currencyChoice;
      const payments = [];

      for (let i = 0; i < months; i++) {
        const monthInfo = getQametiMonthInfo(startMonth, i, dueDay);
        payments.push({ label: monthInfo.label, dueDate: monthInfo.date, paidDate: "", method: "", amount: monthly, notes: "" });
      }

      const newQameti = {
        id: "qameti_" + Date.now(),
        name,
        currency,
        members,
        monthly,
        total: total || members * monthly,
        months,
        startMonth,
        dueDay,
        receiveMonth,
        payments,
        createdAt: new Date().toISOString()
      };

      const data = getQametiData();
      data.push(newQameti);
      saveQametiData(data);
      currentQametiId = newQameti.id;
      closeAddQametiPopup();
      renderQametiPage();
      openRunningQametiDetail(newQameti.id);
    }

    function openQametiPaymentPopup(index) {
      const qameti = getCurrentQameti();
      if (!qameti) return;
      const payment = (qameti.payments || [])[index];
      if (!payment) return;

      document.getElementById("qametiEditingPaymentIndex").value = index;
      document.getElementById("qametiPaymentPopupTitle").innerText = payment.label || "Edit Payment";
      document.getElementById("qametiPaymentDueDateInput").value = payment.dueDate || "";
      document.getElementById("qametiPaymentPaidDateInput").value = payment.paidDate || "";
      document.getElementById("qametiPaymentAmountInput").value = payment.amount || qameti.monthly || "";
      document.getElementById("qametiPaymentMethodInput").value = payment.method || "";
      document.getElementById("qametiPaymentNotesInput").value = payment.notes || "";

      const popup = document.getElementById("qametiPaymentPopup");
      if (popup) popup.style.display = "block";
      applySmartToolsTheme();
    }

    function closeQametiPaymentPopup() {
      const popup = document.getElementById("qametiPaymentPopup");
      if (popup) popup.style.display = "none";
    }

    function saveQametiPayment() {
      const qameti = getCurrentQameti();
      if (!qameti) return;

      const index = Number(document.getElementById("qametiEditingPaymentIndex").value);
      const data = getQametiData();
      const qametiIndex = data.findIndex(item => item.id === qameti.id);
      if (qametiIndex === -1) return;

      const payment = data[qametiIndex].payments[index];
      if (!payment) return;

      payment.dueDate = document.getElementById("qametiPaymentDueDateInput").value;
      payment.paidDate = document.getElementById("qametiPaymentPaidDateInput").value;
      payment.amount = Number(document.getElementById("qametiPaymentAmountInput").value || 0);
      payment.method = document.getElementById("qametiPaymentMethodInput").value;
      payment.notes = document.getElementById("qametiPaymentNotesInput").value.trim();

      saveQametiData(data);
      closeQametiPaymentPopup();
      renderRunningQametiCards();
      renderQametiDropdown();
      renderQametiDetailOnly();
    }

    function markQametiPaymentUnpaid() {
      const paidDateInput = document.getElementById("qametiPaymentPaidDateInput");
      const methodInput = document.getElementById("qametiPaymentMethodInput");
      if (paidDateInput) paidDateInput.value = "";
      if (methodInput) methodInput.value = "";
      saveQametiPayment();
    }

    function deleteCurrentQameti() {
      const qameti = getCurrentQameti();
      if (!qameti) return;
      const confirmed = confirm("Delete this qameti? This cannot be undone.");
      if (!confirmed) return;
      const data = getQametiData().filter(item => item.id !== qameti.id);
      saveQametiData(data);
      currentQametiId = null;
      renderQametiPage();
    }

    function getQametiPaidCount(qameti) {
      return (qameti.payments || []).filter(payment => payment.paidDate).length;
    }

    function getQametiTotalPaid(qameti) {
      return (qameti.payments || []).reduce((sum, payment) => {
        if (!payment.paidDate) return sum;
        return sum + Number(payment.amount || 0);
      }, 0);
    }

    function getQametiReceiveText(qameti) {
      const receiveMonth = Number(qameti.receiveMonth || 0);
      if (!receiveMonth || receiveMonth < 1) return "Receiving month is not set yet. You can still track all monthly payments.";
      const payment = (qameti.payments || [])[receiveMonth - 1];
      if (!payment) return "Receiving month is outside the qameti month list.";
      return "Your turn: <strong>" + escapeHtml(payment.label) + "</strong><br>Expected payout: <strong>" + escapeHtml(qameti.currency) + formatQametiMoney(qameti.total) + "</strong>";
    }

    function getCurrentMonthInputValue() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      return year + "-" + month;
    }

    function getQametiMonthInfo(startMonth, addMonthsAmount, dueDay) {
      const parts = String(startMonth || getCurrentMonthInputValue()).split("-");
      const year = Number(parts[0]);
      const monthIndex = Number(parts[1]) - 1;
      const date = new Date(year, monthIndex + addMonthsAmount, 1);
      const realYear = date.getFullYear();
      const realMonth = date.getMonth();
      const lastDay = new Date(realYear, realMonth + 1, 0).getDate();
      const safeDay = Math.min(Math.max(Number(dueDay || 5), 1), lastDay);
      const dueDate = new Date(realYear, realMonth, safeDay);
      const yyyy = dueDate.getFullYear();
      const mm = String(dueDate.getMonth() + 1).padStart(2, "0");
      const dd = String(dueDate.getDate()).padStart(2, "0");
      const label = dueDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });
      return { label, date: yyyy + "-" + mm + "-" + dd };
    }

    function formatQametiMoney(value) {
      const num = Number(value || 0);
      return num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener("click", function(event) {
      const cloudCard = event.target.closest(".cloud-sync-card");
      if (!cloudCard) closeQametiCloudMenu();
    });

    document.addEventListener("DOMContentLoaded", function() {
      applySmartToolsTheme();
      repairAllQametiPaymentMonths();
      clearSelectedQameti();
      renderQametiPage();
      updateQametiCloudUI();
      waitForQametiCloudFile();
    });
  </script>

</body>
</html>
