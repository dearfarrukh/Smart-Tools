<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Weather</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
font-family:'SF Pro Display',sans-serif;
background:#000;
color:white;
}

body{
position:relative;
}

#weatherApp{
width:100%;
height:100vh;
overflow-y:auto;
overflow-x:hidden;
position:relative;
scroll-behavior:smooth;
background:
linear-gradient(
180deg,
#3b6cb7 0%,
#274472 30%,
#16253b 60%,
#0b1525 100%
);
}

#weatherBackground{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
overflow:hidden;
}

.cloud{
position:absolute;
background:rgba(255,255,255,0.12);
border-radius:100px;
filter:blur(10px);
animation:floatCloud 30s linear infinite;
}

.cloud1{
width:220px;
height:70px;
top:12%;
left:-240px;
animation-duration:40s;
}

.cloud2{
width:180px;
height:60px;
top:28%;
left:-200px;
animation-duration:50s;
}

.cloud3{
width:260px;
height:90px;
top:45%;
left:-260px;
animation-duration:60s;
}

@keyframes floatCloud{
0%{
transform:translateX(0);
}
100%{
transform:translateX(140vw);
}
}

#rainContainer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:1;
overflow:hidden;
}

.rainDrop{
position:absolute;
width:1.5px;
height:18px;
background:rgba(255,255,255,0.5);
animation:rainFall linear infinite;
}

@keyframes rainFall{
0%{
transform:translateY(-120vh);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(120vh);
opacity:0;
}
}

#mainContent{
position:relative;
z-index:5;
padding-bottom:150px;
}

#topBar{
width:100%;
padding:18px 18px 10px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:100;
backdrop-filter:blur(20px);
background:rgba(0,0,0,0.12);
}

#searchBox{
width:78%;
height:48px;
border:none;
outline:none;
border-radius:25px;
padding:0 18px;
font-size:16px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(20px);
color:white;
}

#searchBox::placeholder{
color:rgba(255,255,255,0.7);
}

#unitToggle{
width:54px;
height:48px;
border-radius:18px;
border:none;
background:rgba(255,255,255,0.15);
color:white;
font-size:18px;
backdrop-filter:blur(20px);
}

#mainWeather{
padding:20px 20px 10px;
text-align:center;
}

#cityName{
font-size:38px;
font-weight:600;
margin-bottom:8px;
}

#weatherCondition{
font-size:22px;
opacity:0.9;
margin-bottom:12px;
}

#mainTemp{
font-size:110px;
font-weight:200;
line-height:1;
}

#highLow{
font-size:20px;
margin-top:8px;
opacity:0.9;
}

.glassCard{
width:calc(100% - 24px);
margin:12px auto;
border-radius:30px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(25px);
padding:18px;
box-shadow:
0 8px 30px rgba(0,0,0,0.25);
border:1px solid rgba(255,255,255,0.08);
}

.cardTitle{
font-size:14px;
letter-spacing:1px;
text-transform:uppercase;
opacity:0.8;
margin-bottom:14px;
}

#hourlyForecast{
display:flex;
overflow-x:auto;
gap:14px;
padding-bottom:5px;
}

#hourlyForecast::-webkit-scrollbar{
display:none;
}

.hourCard{
min-width:70px;
text-align:center;
}

.hourTime{
font-size:14px;
margin-bottom:10px;
opacity:0.8;
}

.hourIcon{
font-size:28px;
margin-bottom:8px;
}

.hourTemp{
font-size:18px;
font-weight:600;
}

.dayRow{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 0;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.dayRow:last-child{
border-bottom:none;
}

.dayName{
width:25%;
font-size:17px;
font-weight:500;
}

.dayIcon{
width:15%;
text-align:center;
font-size:24px;
}

.dayTemps{
width:40%;
text-align:right;
font-size:18px;
}

#detailsGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.detailBox{
background:rgba(255,255,255,0.08);
border-radius:24px;
padding:18px;
min-height:120px;
}

.detailLabel{
font-size:13px;
opacity:0.7;
margin-bottom:12px;
}

.detailValue{
font-size:30px;
font-weight:600;
}

.detailSub{
margin-top:10px;
opacity:0.8;
font-size:14px;
}

#savedLocations{
display:flex;
flex-direction:column;
gap:14px;
}

.savedCity{
padding:18px;
border-radius:24px;
background:rgba(255,255,255,0.08);
display:flex;
justify-content:space-between;
align-items:center;
}

.savedCityName{
font-size:20px;
font-weight:600;
}

.savedCityTemp{
font-size:34px;
font-weight:300;
}

#radarMap{
width:100%;
height:320px;
border:none;
border-radius:24px;
overflow:hidden;
}

#bottomNav{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
width:92%;
height:78px;
border-radius:35px;
background:rgba(20,20,30,0.55);
backdrop-filter:blur(25px);
display:flex;
justify-content:space-around;
align-items:center;
z-index:200;
box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

.navButton{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:white;
font-size:12px;
opacity:0.7;
}

.navButton.active{
opacity:1;
}

.navIcon{
font-size:24px;
margin-bottom:4px;
}

#loadingScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#08111d;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.loader{
width:70px;
height:70px;
border-radius:50%;
border:4px solid rgba(255,255,255,0.15);
border-top:4px solid white;
animation:spin 1s linear infinite;
margin-bottom:20px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.loadingText{
font-size:18px;
opacity:0.9;
}

@media (min-width:700px){

#mainContent{
max-width:500px;
margin:auto;
}

}

</style>
</head>

<body>

<div id="loadingScreen">
<div class="loader"></div>
<div class="loadingText">Loading Weather...</div>
</div>

<div id="weatherBackground">

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

</div>

<div id="rainContainer"></div>

<div id="weatherApp">

<div id="mainContent">

<div id="topBar">

<input
type="text"
id="searchBox"
placeholder="Search city..."
>

<button id="unitToggle">°F</button>

</div>

<div id="mainWeather">

<div id="cityName">Loading...</div>

<div id="weatherCondition">Weather</div>

<div id="mainTemp">--°</div>

<div id="highLow">H: --°   L: --°</div>

</div>

<div class="glassCard">

<div class="cardTitle">
Hourly Forecast
</div>

<div id="hourlyForecast"></div>

</div>

<div class="glassCard">

<div class="cardTitle">
10-Day Forecast
</div>

<div id="dailyForecast"></div>

</div>

<div class="glassCard">

<div class="cardTitle">
Weather Details
</div>

<div id="detailsGrid">

<div class="detailBox">
<div class="detailLabel">Humidity</div>
<div class="detailValue" id="humidityValue">--%</div>
<div class="detailSub">Current humidity</div>
</div>

<div class="detailBox">
<div class="detailLabel">Wind</div>
<div class="detailValue" id="windValue">--</div>
<div class="detailSub">Wind speed</div>
</div>

<div class="detailBox">
<div class="detailLabel">Feels Like</div>
<div class="detailValue" id="feelsValue">--°</div>
<div class="detailSub">Feels like temp</div>
</div>

<div class="detailBox">
<div class="detailLabel">UV Index</div>
<div class="detailValue" id="uvValue">--</div>
<div class="detailSub">Sun exposure</div>
</div>

</div>

</div>

<div class="glassCard">

<div class="cardTitle">
Saved Locations
</div>

<div id="savedLocations"></div>

</div>

<div class="glassCard">

<div class="cardTitle">
Weather Radar
</div>

<iframe
id="radarMap"
src="https://embed.windy.com/embed2.html?lat=40.7128&lon=-74.0060&detailLat=40.7128&detailLon=-74.0060&width=650&height=450&zoom=5&level=surface&overlay=rain&product=ecmwf"
></iframe>

</div>

</div>

</div>

<div id="bottomNav">

<div class="navButton active">
<div class="navIcon">☀️</div>
<div>Weather</div>
</div>

<div class="navButton">
<div class="navIcon">🕒</div>
<div>Hourly</div>
</div>

<div class="navButton">
<div class="navIcon">📅</div>
<div>Daily</div>
</div>

<div class="navButton">
<div class="navIcon">📍</div>
<div>Saved</div>
</div>

<div class="navButton">
<div class="navIcon">⚙️</div>
<div>Settings</div>
</div>

</div>

<script>

const WEATHER_API = "https://api.open-meteo.com/v1/forecast";

let currentUnit = "fahrenheit";

let savedCities =
JSON.parse(localStorage.getItem("savedWeatherCities")) || [];

const cityName =
document.getElementById("cityName");

const weatherCondition =
document.getElementById("weatherCondition");

const mainTemp =
document.getElementById("mainTemp");

const highLow =
document.getElementById("highLow");

const hourlyForecast =
document.getElementById("hourlyForecast");

const dailyForecast =
document.getElementById("dailyForecast");

const humidityValue =
document.getElementById("humidityValue");

const windValue =
document.getElementById("windValue");

const feelsValue =
document.getElementById("feelsValue");

const uvValue =
document.getElementById("uvValue");

const savedLocations =
document.getElementById("savedLocations");

const searchBox =
document.getElementById("searchBox");

const unitToggle =
document.getElementById("unitToggle");

function createRain(){

const rainContainer =
document.getElementById("rainContainer");

for(let i=0;i<120;i++){

const drop =
document.createElement("div");

drop.className = "rainDrop";

drop.style.left =
Math.random()*100 + "vw";

drop.style.animationDuration =
(0.5 + Math.random()) + "s";

drop.style.animationDelay =
Math.random()*5 + "s";

rainContainer.appendChild(drop);

}

}

createRain();

async function getCoordinates(city){

const response =
await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`
);

const data =
await response.json();

if(data.results && data.results.length > 0){

return data.results[0];

}

return null;

}

function weatherEmoji(code){

if(code === 0) return "☀️";
if(code <= 3) return "⛅";
if(code <= 48) return "🌫️";
if(code <= 67) return "🌧️";
if(code <= 77) return "❄️";
if(code <= 99) return "⛈️";

return "☀️";

}

function weatherText(code){

if(code === 0) return "Clear";
if(code <= 3) return "Partly Cloudy";
if(code <= 48) return "Fog";
if(code <= 67) return "Rain";
if(code <= 77) return "Snow";
if(code <= 99) return "Storm";

return "Clear";

}

async function loadWeather(lat,lon,city="Current Location"){

const tempUnit =
currentUnit === "fahrenheit"
? "fahrenheit"
: "celsius";

const speedUnit =
currentUnit === "fahrenheit"
? "mph"
: "kmh";

const url =
`${WEATHER_API}?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&temperature_unit=${tempUnit}&wind_speed_unit=${speedUnit}&timezone=auto`;

const response =
await fetch(url);

const data =
await response.json();

cityName.innerText = city;

weatherCondition.innerText =
weatherText(data.current.weather_code);

mainTemp.innerText =
Math.round(data.current.temperature_2m) + "°";

highLow.innerText =
`H: ${Math.round(data.daily.temperature_2m_max[0])}°  L: ${Math.round(data.daily.temperature_2m_min[0])}°`;

humidityValue.innerText =
data.current.relative_humidity_2m + "%";

windValue.innerText =
Math.round(data.current.wind_speed_10m);

feelsValue.innerText =
Math.round(data.current.apparent_temperature) + "°";

uvValue.innerText =
Math.round(data.daily.uv_index_max[0]);

buildHourly(data);

buildDaily(data);

updateRadar(lat,lon);

document.getElementById("loadingScreen").style.display =
"none";

}

function buildHourly(data){

hourlyForecast.innerHTML = "";

for(let i=0;i<24;i++){

const hour =
new Date(data.hourly.time[i]);

const card =
document.createElement("div");

card.className = "hourCard";

card.innerHTML = `

<div class="hourTime">
${hour.getHours()}:00
</div>

<div class="hourIcon">
${weatherEmoji(data.hourly.weather_code[i])}
</div>

<div class="hourTemp">
${Math.round(data.hourly.temperature_2m[i])}°
</div>

`;

hourlyForecast.appendChild(card);

}

}

function buildDaily(data){

dailyForecast.innerHTML = "";

for(let i=0;i<10;i++){

const date =
new Date(data.daily.time[i]);

const row =
document.createElement("div");

row.className = "dayRow";

row.innerHTML = `

<div class="dayName">
${date.toLocaleDateString("en-US",{weekday:"short"})}
</div>

<div class="dayIcon">
${weatherEmoji(data.daily.weather_code[i])}
</div>

<div class="dayTemps">
${Math.round(data.daily.temperature_2m_max[i])}°
/
${Math.round(data.daily.temperature_2m_min[i])}°
</div>

`;

dailyForecast.appendChild(row);

}

}

function updateRadar(lat,lon){

document.getElementById("radarMap").src =
`https://embed.windy.com/embed2.html?lat=${lat}&lon=${lon}&detailLat=${lat}&detailLon=${lon}&width=650&height=450&zoom=5&level=surface&overlay=rain&product=ecmwf`;

}

function renderSavedCities(){

savedLocations.innerHTML = "";

savedCities.forEach(city => {

const item =
document.createElement("div");

item.className = "savedCity";

item.innerHTML = `

<div class="savedCityName">
${city}
</div>

<div class="savedCityTemp">
📍
</div>

`;

item.onclick = async () => {

const result =
await getCoordinates(city);

if(result){

loadWeather(
result.latitude,
result.longitude,
result.name
);

}

};

savedLocations.appendChild(item);

});

}

searchBox.addEventListener("keydown",async(e)=>{

if(e.key === "Enter"){

const city =
searchBox.value.trim();

if(!city) return;

const result =
await getCoordinates(city);

if(result){

loadWeather(
result.latitude,
result.longitude,
result.name
);

if(!savedCities.includes(result.name)){

savedCities.push(result.name);

localStorage.setItem(
"savedWeatherCities",
JSON.stringify(savedCities)
);

renderSavedCities();

}

}

searchBox.value = "";

}

});

unitToggle.addEventListener("click",()=>{

if(currentUnit === "fahrenheit"){

currentUnit = "celsius";

unitToggle.innerText = "°C";

}else{

currentUnit = "fahrenheit";

unitToggle.innerText = "°F";

}

getCurrentLocation();

});

function getCurrentLocation(){

navigator.geolocation.getCurrentPosition(

(position)=>{

loadWeather(
position.coords.latitude,
position.coords.longitude,
"Current Location"
);

},

()=>{

loadWeather(
40.7128,
-74.0060,
"New York"
);

}

);

}

renderSavedCities();

getCurrentLocation();

</script>

</body>
</html>
