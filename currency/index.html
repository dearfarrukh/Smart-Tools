<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USD PKR Converter</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(34,197,94,0.35), transparent 32%),
    radial-gradient(circle at top right, rgba(59,130,246,0.30), transparent 35%),
    linear-gradient(180deg,#061421 0%,#071a2b 48%,#03111f 100%);
  color:white;
  overflow-x:hidden;
}

.app{
  width:100%;
  min-height:100vh;
  padding:18px 5% 30px;
  display:flex;
  flex-direction:column;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.backBtn{
  width:46px;
  height:46px;
  border:none;
  border-radius:16px;
  background:rgba(255,255,255,0.14);
  color:white;
  font-size:26px;
  font-weight:900;
  cursor:pointer;
  backdrop-filter:blur(12px);
}

.titleBox{
  text-align:center;
}

.titleBox h1{
  font-size:24px;
  font-weight:900;
  letter-spacing:-0.5px;
}

.titleBox p{
  font-size:13px;
  color:rgba(255,255,255,0.72);
  margin-top:4px;
  font-weight:700;
}

.refreshBtn{
  width:46px;
  height:46px;
  border:none;
  border-radius:16px;
  background:rgba(255,255,255,0.14);
  color:white;
  font-size:22px;
  cursor:pointer;
  backdrop-filter:blur(12px);
}

.rateCard{
  width:100%;
  border-radius:30px;
  padding:24px 20px;
  background:linear-gradient(135deg,rgba(255,255,255,0.22),rgba(255,255,255,0.08));
  border:1px solid rgba(255,255,255,0.20);
  box-shadow:0 18px 50px rgba(0,0,0,0.30);
  backdrop-filter:blur(18px);
  margin-bottom:22px;
  text-align:center;
}

.rateLabel{
  font-size:13px;
  font-weight:800;
  color:rgba(255,255,255,0.72);
  text-transform:uppercase;
  letter-spacing:1px;
}

.rateValue{
  font-size:38px;
  font-weight:900;
  margin-top:10px;
  letter-spacing:-1px;
}

.rateSub{
  font-size:13px;
  color:rgba(255,255,255,0.70);
  margin-top:8px;
  font-weight:700;
}

.converterCard{
  width:100%;
  border-radius:32px;
  background:rgba(255,255,255,0.96);
  color:#111827;
  padding:20px;
  box-shadow:0 22px 55px rgba(0,0,0,0.30);
}

.currencyBox{
  border-radius:26px;
  padding:18px;
  background:#f4f7fb;
  border:1px solid rgba(15,23,42,0.06);
  margin-bottom:14px;
}

.currencyTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.currencyName{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  font-weight:900;
}

.flag{
  font-size:28px;
}

.currencyCode{
  color:#64748b;
  font-size:13px;
  font-weight:900;
}

.amountInput{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  font-size:38px;
  font-weight:900;
  color:#111827;
}

.amountInput::placeholder{
  color:#cbd5e1;
}

.swapCircle{
  width:54px;
  height:54px;
  border-radius:50%;
  border:5px solid white;
  background:#16a34a;
  color:white;
  font-size:26px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:-6px auto 8px;
  box-shadow:0 12px 28px rgba(22,163,74,0.35);
}

.actionRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.actionBtn{
  height:52px;
  border:none;
  border-radius:18px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.greenBtn{
  background:#16a34a;
  color:white;
}

.grayBtn{
  background:#e5e7eb;
  color:#111827;
}

.note{
  margin-top:18px;
  text-align:center;
  color:rgba(255,255,255,0.70);
  font-size:13px;
  font-weight:700;
  line-height:1.5;
}

.statusGood{
  color:#bbf7d0;
}

.statusBad{
  color:#fecaca;
}

@media(max-width:480px){
  .app{
    padding:16px 4% 26px;
  }

  .titleBox h1{
    font-size:21px;
  }

  .rateValue{
    font-size:34px;
  }

  .amountInput{
    font-size:34px;
  }

  .converterCard{
    padding:16px;
    border-radius:28px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <button class="backBtn" onclick="goBackHome()">‹</button>

    <div class="titleBox">
      <h1>Currency Converter</h1>
      <p>USD ⇄ PKR Live Rate</p>
    </div>

    <button class="refreshBtn" onclick="loadLiveRate()">↻</button>
  </div>

  <div class="rateCard">
    <div class="rateLabel">Live Exchange Rate</div>
    <div class="rateValue" id="rateValue">Loading...</div>
    <div class="rateSub" id="rateStatus">Getting latest USD to PKR rate</div>
  </div>

  <div class="converterCard">

    <div class="currencyBox">
      <div class="currencyTop">
        <div class="currencyName">
          <span class="flag">🇺🇸</span>
          <span>US Dollar</span>
        </div>
        <div class="currencyCode">USD</div>
      </div>

      <input
        id="usdInput"
        class="amountInput"
        type="number"
        inputmode="decimal"
        placeholder="0"
        oninput="convertFromUSD()"
      >
    </div>

    <div class="swapCircle">⇅</div>

    <div class="currencyBox">
      <div class="currencyTop">
        <div class="currencyName">
          <span class="flag">🇵🇰</span>
          <span>Pakistani Rupee</span>
        </div>
        <div class="currencyCode">PKR</div>
      </div>

      <input
        id="pkrInput"
        class="amountInput"
        type="number"
        inputmode="decimal"
        placeholder="0"
        oninput="convertFromPKR()"
      >
    </div>

    <div class="actionRow">
      <button class="actionBtn grayBtn" onclick="clearAmounts()">Clear</button>
      <button class="actionBtn greenBtn" onclick="loadLiveRate()">Update Rate</button>
    </div>

  </div>

  <div class="note" id="bottomNote">
    Uses live internet rate when available. Last saved rate is used if internet fails.
  </div>

</div>

<script>
let usdToPkrRate = 0;
let activeInput = "";

function goBackHome(){
  window.location.href = "../";
}

async function loadLiveRate(){
  const rateValue = document.getElementById("rateValue");
  const rateStatus = document.getElementById("rateStatus");

  rateValue.innerText = "Loading...";
  rateStatus.innerText = "Checking live rate...";
  rateStatus.className = "rateSub";

  try{
    const response = await fetch("https://open.er-api.com/v6/latest/USD?cache=" + Date.now());
    const data = await response.json();

    if(!data || !data.rates || !data.rates.PKR){
      throw new Error("PKR rate not found");
    }

    usdToPkrRate = Number(data.rates.PKR);

    localStorage.setItem("smartToolsUsdToPkrRate", String(usdToPkrRate));
    localStorage.setItem("smartToolsUsdToPkrRateTime", new Date().toLocaleString());

    showRate("live");
    recalculateCurrentInput();

  }catch(error){
    const savedRate = Number(localStorage.getItem("smartToolsUsdToPkrRate") || "0");

    if(savedRate > 0){
      usdToPkrRate = savedRate;
      showRate("saved");
      recalculateCurrentInput();
    }else{
      usdToPkrRate = 280;
      showRate("fallback");
      recalculateCurrentInput();
    }
  }
}

function showRate(type){
  const rateValue = document.getElementById("rateValue");
  const rateStatus = document.getElementById("rateStatus");
  const savedTime = localStorage.getItem("smartToolsUsdToPkrRateTime");

  rateValue.innerText = "1 USD = " + formatNumber(usdToPkrRate) + " PKR";

  if(type === "live"){
    rateStatus.innerText = "Live rate updated now";
    rateStatus.className = "rateSub statusGood";
  }else if(type === "saved"){
    rateStatus.innerText = "Using last saved rate: " + (savedTime || "");
    rateStatus.className = "rateSub statusGood";
  }else{
    rateStatus.innerText = "Internet failed. Temporary estimated rate is being used.";
    rateStatus.className = "rateSub statusBad";
  }
}

function convertFromUSD(){
  activeInput = "usd";

  const usdInput = document.getElementById("usdInput");
  const pkrInput = document.getElementById("pkrInput");

  const usd = Number(usdInput.value);

  if(!usdInput.value || usd <= 0){
    pkrInput.value = "";
    return;
  }

  pkrInput.value = roundMoney(usd * usdToPkrRate);
}

function convertFromPKR(){
  activeInput = "pkr";

  const usdInput = document.getElementById("usdInput");
  const pkrInput = document.getElementById("pkrInput");

  const pkr = Number(pkrInput.value);

  if(!pkrInput.value || pkr <= 0){
    usdInput.value = "";
    return;
  }

  usdInput.value = roundMoney(pkr / usdToPkrRate);
}

function recalculateCurrentInput(){
  if(activeInput === "pkr"){
    convertFromPKR();
  }else{
    convertFromUSD();
  }
}

function clearAmounts(){
  document.getElementById("usdInput").value = "";
  document.getElementById("pkrInput").value = "";
  activeInput = "";
}

function roundMoney(value){
  return Math.round(value * 100) / 100;
}

function formatNumber(value){
  return Number(value).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

document.addEventListener("DOMContentLoaded", function(){
  loadLiveRate();
});
</script>

</body>
</html>
