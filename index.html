<!DOCTYPE html>
<html lang="en">
<head>

  <!-- =========================
       IPHONE HOME SCREEN ICON
  ========================= -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Smart Tools">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" href="images/icon.png?v=20260515-security1">
  <link rel="icon" type="image/png" href="images/icon.png?v=20260515-security1">

  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Smart Tools</title>

  <style>
    /* =========================
       RESET
    ========================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(34,197,94,0.16), transparent 32%),
        radial-gradient(circle at top right, rgba(14,165,233,0.12), transparent 30%),
        linear-gradient(180deg, #07111f 0%, #0b1626 52%, #07111f 100%);
      color: #f8fafc;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       DASHBOARD SHELL
    ========================= */
    .dashboard-shell {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 4% 34px 4%;
      min-height: 100vh;
    }

    /* =========================
       TOP BAR
    ========================= */
    .dashboard-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 0 22px 0;
      border-bottom: 1px solid rgba(148,163,184,0.18);
      margin-bottom: 22px;
    }

    .dashboard-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .dashboard-logo {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: rgba(34,197,94,0.14);
      color: #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .dashboard-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dashboard-title {
      font-size: 28px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.8px;
      color: #f8fafc;
      white-space: nowrap;
    }

    .dashboard-title span {
      color: #22c55e;
    }

    .dashboard-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .dashboard-small-btn {
      width: 48px;
      height: 48px;
      border: 1px solid rgba(148,163,184,0.24);
      border-radius: 16px;
      background: rgba(15,23,42,0.78);
      color: #f8fafc;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 30px rgba(0,0,0,0.18);
      backdrop-filter: blur(14px);
    }

    .dashboard-small-btn:active {
      transform: scale(0.96);
    }

    /* =========================
       DROPDOWN MENU
    ========================= */
    .dashboard-menu-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 58px;
      width: 230px;
      padding: 10px;
      border-radius: 20px;
      background: rgba(15,23,42,0.96);
      border: 1px solid rgba(148,163,184,0.22);
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(18px);
      z-index: 40;
    }

    .dashboard-menu-dropdown.open {
      display: block;
    }

    .dashboard-menu-dropdown button {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 15px;
      background: transparent;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      font-size: 15px;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }

    .dashboard-menu-dropdown button:hover {
      background: rgba(148,163,184,0.13);
    }

    .hidden-file-input {
      display: none;
    }

    /* =========================
       SUMMARY CARDS
    ========================= */
    .dashboard-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .dashboard-stat-card {
      min-height: 102px;
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(30,41,59,0.82), rgba(15,23,42,0.78));
      border: 1px solid rgba(148,163,184,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 34px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
    }

    .dashboard-stat-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex: 0 0 auto;
    }

    .dashboard-stat-icon.green {
      background: rgba(34,197,94,0.14);
      color: #22c55e;
    }

    .dashboard-stat-icon.purple {
      background: rgba(168,85,247,0.14);
      color: #a855f7;
    }

    .dashboard-stat-icon.blue {
      background: rgba(59,130,246,0.14);
      color: #38bdf8;
    }

    .dashboard-stat-icon.orange {
      background: rgba(249,115,22,0.14);
      color: #fb923c;
    }

    .dashboard-stat-label {
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .dashboard-stat-value {
      color: #f8fafc;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.05;
    }

    .dashboard-stat-sub {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      margin-top: 5px;
    }

    /* =========================
       TOOL CARDS
    ========================= */
    .dashboard-tools-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .dashboard-tool-card {
      min-height: 186px;
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 18px;
      padding: 22px;
      background: linear-gradient(180deg, rgba(30,41,59,0.78), rgba(15,23,42,0.78));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 14px 36px rgba(0,0,0,0.20);
      color: #f8fafc;
      text-align: left;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .dashboard-tool-card:hover {
      transform: translateY(-3px);
      border-color: rgba(34,197,94,0.35);
      background: linear-gradient(180deg, rgba(30,41,59,0.92), rgba(15,23,42,0.88));
    }

    .dashboard-tool-card:active {
      transform: scale(0.98);
    }

    .dashboard-tool-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      margin-bottom: 32px;
    }

    .dashboard-tool-icon.green {
      color: #22c55e;
      background: rgba(34,197,94,0.12);
    }

    .dashboard-tool-icon.yellow {
      color: #fbbf24;
      background: rgba(251,191,36,0.12);
    }

    .dashboard-tool-icon.red {
      color: #fb7185;
      background: rgba(251,113,133,0.12);
    }

    .dashboard-tool-icon.cyan {
      color: #22d3ee;
      background: rgba(34,211,238,0.12);
    }

    .dashboard-tool-icon.purple {
      color: #a855f7;
      background: rgba(168,85,247,0.12);
    }

    .dashboard-tool-icon.blue {
      color: #60a5fa;
      background: rgba(96,165,250,0.12);
    }

    .dashboard-tool-icon.orange {
      color: #fb923c;
      background: rgba(251,146,60,0.12);
    }

    .dashboard-tool-card h3 {
      color: #f8fafc;
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -0.25px;
    }

    .dashboard-tool-card p {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.45;
      max-width: 92%;
    }

    .dashboard-card-arrow {
      position: absolute;
      right: 18px;
      bottom: 18px;
      color: #94a3b8;
      font-size: 26px;
      line-height: 1;
    }

    /* =========================
       FOOTER
    ========================= */
    .dashboard-footer {
      margin-top: 18px;
      min-height: 68px;
      border-radius: 18px;
      background: rgba(15,23,42,0.62);
      border: 1px solid rgba(148,163,184,0.15);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 22px;
      font-size: 14px;
      font-weight: 700;
    }

    /* =========================
       COLORFUL IOS HOME THEME
    ========================= */
    body.smart-tools-color-theme {
      background:
        radial-gradient(circle at top left, rgba(96,165,250,0.24), transparent 30%),
        radial-gradient(circle at top right, rgba(244,114,182,0.22), transparent 32%),
        linear-gradient(180deg, #f4f7ff 0%, #eef2ff 48%, #f8fafc 100%);
      color: #111827;
    }

    body.smart-tools-color-theme .dashboard-topbar {
      border-bottom: 1px solid rgba(15,23,42,0.08);
    }

    body.smart-tools-color-theme .dashboard-logo {
      background: linear-gradient(135deg, #dcfce7, #dbeafe);
      color: #16a34a;
      box-shadow: 0 8px 22px rgba(59,130,246,0.12);
    }

    body.smart-tools-color-theme .dashboard-title {
      color: #111827;
    }

    body.smart-tools-color-theme .dashboard-title span {
      color: #2563eb;
    }

    body.smart-tools-color-theme .dashboard-small-btn {
      background: rgba(255,255,255,0.86);
      color: #111827;
      border: 1px solid rgba(15,23,42,0.08);
      box-shadow: 0 12px 26px rgba(15,23,42,0.10);
    }

    body.smart-tools-color-theme .dashboard-menu-dropdown {
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(15,23,42,0.08);
      box-shadow: 0 24px 60px rgba(15,23,42,0.16);
    }

    body.smart-tools-color-theme .dashboard-menu-dropdown button {
      color: #111827;
    }

    body.smart-tools-color-theme .dashboard-menu-dropdown button:hover {
      background: rgba(37,99,235,0.08);
    }

    body.smart-tools-color-theme .dashboard-stat-card,
    body.smart-tools-color-theme .dashboard-tool-card,
    body.smart-tools-color-theme .dashboard-footer {
      background: rgba(255,255,255,0.84);
      border: 1px solid rgba(15,23,42,0.07);
      box-shadow: 0 14px 34px rgba(15,23,42,0.10);
    }

    body.smart-tools-color-theme .dashboard-tool-card:nth-child(1) {
      background: linear-gradient(135deg, #ecfdf5, #ffffff);
    }

    body.smart-tools-color-theme .dashboard-tool-card:nth-child(2) {
      background: linear-gradient(135deg, #fffbeb, #ffffff);
    }

    body.smart-tools-color-theme .dashboard-tool-card:nth-child(3) {
      background: linear-gradient(135deg, #fff1f2, #ffffff);
    }

    body.smart-tools-color-theme .dashboard-tool-card:nth-child(4) {
      background: linear-gradient(135deg, #ecfeff, #ffffff);
    }

    body.smart-tools-color-theme .dashboard-tool-card:nth-child(5) {
      background: linear-gradient(135deg, #f3e8ff, #ffffff);
    }

    body.smart-tools-color-theme .dashboard-tool-card:nth-child(6) {
      background: linear-gradient(135deg, #ffedd5, #ffffff);
    }

    body.smart-tools-color-theme .dashboard-tool-card:nth-child(7) {
      background: linear-gradient(135deg, #dcfce7, #ffffff);
    }

    body.smart-tools-color-theme .dashboard-tool-card:nth-child(8) {
      background: linear-gradient(135deg, #eff6ff, #ffffff);
    }

    body.smart-tools-color-theme .dashboard-tool-card:hover {
      background: #ffffff;
      border-color: rgba(37,99,235,0.18);
    }

    body.smart-tools-color-theme .dashboard-stat-label,
    body.smart-tools-color-theme .dashboard-tool-card p,
    body.smart-tools-color-theme .dashboard-footer {
      color: #64748b;
    }

    body.smart-tools-color-theme .dashboard-stat-value,
    body.smart-tools-color-theme .dashboard-tool-card h3 {
      color: #111827;
    }

    body.smart-tools-color-theme .dashboard-stat-sub,
    body.smart-tools-color-theme .dashboard-card-arrow {
      color: #94a3b8;
    }

    /* =========================
       RESPONSIVE
    ========================= */
    @media (max-width: 1000px) {
      .dashboard-stats-grid,
      .dashboard-tools-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .dashboard-shell {
        padding: 18px 4% 28px 4%;
      }

      .dashboard-topbar {
        padding-bottom: 16px;
        margin-bottom: 16px;
      }

      .dashboard-title {
        font-size: 24px;
      }

      .dashboard-logo {
        width: 40px;
        height: 40px;
        font-size: 23px;
      }

      .dashboard-small-btn {
        width: 44px;
        height: 44px;
        border-radius: 15px;
      }

      .dashboard-stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .dashboard-stat-card {
        min-height: 88px;
        padding: 12px;
        gap: 10px;
        border-radius: 16px;
      }

      .dashboard-stat-icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        font-size: 23px;
      }

      .dashboard-stat-value {
        font-size: 18px;
      }

      .dashboard-stat-label,
      .dashboard-stat-sub {
        font-size: 12px;
      }

      .dashboard-tools-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .dashboard-tool-card {
        min-height: 150px;
        padding: 16px;
        border-radius: 17px;
      }

      .dashboard-tool-icon {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        font-size: 24px;
        margin-bottom: 22px;
      }

      .dashboard-tool-card h3 {
        font-size: 16px;
        margin-bottom: 7px;
      }

      .dashboard-tool-card p {
        font-size: 12px;
        line-height: 1.35;
      }

      .dashboard-card-arrow {
        right: 14px;
        bottom: 12px;
        font-size: 22px;
      }

      .dashboard-footer {
        min-height: 58px;
        padding: 0 14px;
        font-size: 12px;
      }
    }
  </style>
</head>

  <!-- =========================
       HIDDEN BACKUP IMPORT INPUT
  ========================= -->
  <input
    id="smartToolsBackupFileInput"
    class="hidden-file-input"
    type="file"
    accept=".json,application/json"
    onchange="restoreSmartToolsBackup(event)"
  />

  <script>
    // =========================
    // OPEN FOLDER PAGE
    // =========================
    function openFolderPage(folderPath) {
      window.location.href = folderPath;
    }

    // =========================
    // HOME THEME
    // This key controls main page and folder pages.
    // Folder pages read this same key: smartToolsHomeTheme
    // =========================
    function applySmartToolsHomeTheme() {
      const savedTheme = localStorage.getItem("smartToolsHomeTheme") || "dark";
      const themeBtn = document.getElementById("smartThemeToggleBtn");

      document.body.classList.remove("smart-tools-color-theme");
      document.body.classList.remove("smart-tools-dark-theme");

      if (savedTheme === "color") {
        document.body.classList.add("smart-tools-color-theme");
        if (themeBtn) themeBtn.innerText = "☾";
      } else {
        document.body.classList.add("smart-tools-dark-theme");
        if (themeBtn) themeBtn.innerText = "☀";
      }
    }

    // =========================
    // TOGGLE HOME THEME
    // =========================
    function toggleSmartToolsHomeTheme(event) {
      if (event) event.stopPropagation();

      const isDark = document.body.classList.contains("smart-tools-dark-theme");

      if (isDark) {
        localStorage.setItem("smartToolsHomeTheme", "color");
      } else {
        localStorage.setItem("smartToolsHomeTheme", "dark");
      }

      applySmartToolsHomeTheme();
    }

    // =========================
    // TOGGLE HOME TOOLS MENU
    // =========================
    function toggleHomeToolsMenu(event) {
      if (event) event.stopPropagation();

      const menu = document.getElementById("homeToolsMenu");

      if (!menu) return;

      menu.classList.toggle("open");
    }

    // =========================
    // CLOSE HOME TOOLS MENU
    // =========================
    function closeHomeToolsMenu() {
      const menu = document.getElementById("homeToolsMenu");

      if (menu) {
        menu.classList.remove("open");
      }
    }

    // =========================
    // CLOSE MENU WHEN TAPPING OUTSIDE
    // =========================
    document.addEventListener("click", function() {
      closeHomeToolsMenu();
    });

    // =========================
    // POWERFUL REFRESH APP - KEEP SAVED DATA SAFE
    // =========================
    async function hardRefreshAppKeepData() {
      closeHomeToolsMenu();

      const confirmed = confirm(
        "Refresh app now?\n\nThis will clear old app cache and load newest GitHub files.\n\nYour saved notes, cars, passwords, qameti, and app data will NOT be deleted."
      );

      if (!confirmed) return;

      try {
        localStorage.setItem("smartToolsLastRefresh", new Date().toISOString());
        localStorage.setItem("smartToolsForceReloadVersion", String(Date.now()));

        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();

          await Promise.all(registrations.map(async function(registration) {
            try {
              if (registration.waiting) {
                registration.waiting.postMessage({ type: "SKIP_WAITING" });
              }

              if (registration.active) {
                registration.active.postMessage({ type: "CLEAR_CACHE" });
              }

              await registration.update();
              await registration.unregister();
            } catch (error) {
              console.log("Service worker refresh step skipped:", error);
            }
          }));
        }

        if ("caches" in window) {
          const cacheNames = await caches.keys();

          await Promise.all(cacheNames.map(function(cacheName) {
            return caches.delete(cacheName);
          }));
        }

        const refreshVersion = Date.now();

        document.querySelectorAll("img").forEach(function(img) {
          try {
            const oldSrc = img.getAttribute("src");
            if (!oldSrc) return;

            const cleanSrc = oldSrc.split("?")[0];
            img.setAttribute("src", cleanSrc + "?v=" + refreshVersion);
          } catch (error) {
            console.log("Image refresh skipped:", error);
          }
        });

        document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(function(link) {
          try {
            const oldHref = link.getAttribute("href");
            if (!oldHref) return;

            const cleanHref = oldHref.split("?")[0];
            link.setAttribute("href", cleanHref + "?v=" + refreshVersion);
          } catch (error) {
            console.log("Icon refresh skipped:", error);
          }
        });

      } catch (error) {
        console.log("Power refresh cleanup skipped:", error);
      }

      const cleanUrl = window.location.origin + window.location.pathname;
      const freshUrl = cleanUrl + "?forceRefresh=" + Date.now();

      setTimeout(function() {
        window.location.replace(freshUrl);
      }, 250);
    }

    // =========================
    // AUTO CLEAN REFRESH URL
    // =========================
    function cleanSmartToolsRefreshUrl() {
      if (window.location.search.indexOf("forceRefresh=") !== -1) {
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
      }
    }

    // =========================
    // FORCE ICON CACHE BUSTER ON LOAD
    // =========================
    function forceSmartToolsIconCacheBuster() {
      const version = localStorage.getItem("smartToolsForceReloadVersion") || "20260515-security1";

      document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(function(link) {
        const oldHref = link.getAttribute("href");
        if (!oldHref) return;

        const cleanHref = oldHref.split("?")[0];
        link.setAttribute("href", cleanHref + "?v=" + version);
      });

      document.querySelectorAll(".dashboard-logo img").forEach(function(img) {
        const oldSrc = img.getAttribute("src");
        if (!oldSrc) return;

        const cleanSrc = oldSrc.split("?")[0];
        img.setAttribute("src", cleanSrc + "?v=" + version);
      });
    }

    // =========================
    // OPEN SMART TOOLS BACKUP FILE CHOOSER
    // =========================
    function openSmartToolsBackupFileChooser() {
      closeHomeToolsMenu();

      const input = document.getElementById("smartToolsBackupFileInput");

      if (input) {
        input.value = "";
        input.click();
      } else {
        alert("Import Backup input was not found.");
      }
    }

    // =========================
    // DOWNLOAD SMART TOOLS BACKUP
    // =========================
    function downloadSmartToolsBackup() {
      closeHomeToolsMenu();

      const backup = {
        appName: "Smart Tools",
        backupVersion: 1,
        createdAt: new Date().toISOString(),
        localStorageData: {}
      };

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);

        if (!key) continue;

        backup.localStorageData[key] = localStorage.getItem(key);
      }

      const backupText = JSON.stringify(backup, null, 2);
      const blob = new Blob([backupText], { type: "application/json" });
      const url = URL.createObjectURL(blob);

           const link = document.createElement("a");
      link.href = url;

      // Same backup name every time.
      // On most computers, if you save to the same folder, it can replace the old backup.
      link.download = "smart-tools-backup.json";

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

    // =========================
    // RESTORE SMART TOOLS BACKUP
    // =========================
    function restoreSmartToolsBackup(event) {
      const file = event.target.files && event.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(loadEvent) {
        try {
          const parsed = JSON.parse(loadEvent.target.result);

          if (!parsed || !parsed.localStorageData) {
            alert("This backup file is not valid.");
            return;
          }

          const confirmed = confirm(
            "Import backup now? This will replace saved Smart Tools data on this browser."
          );

          if (!confirmed) return;

          Object.keys(parsed.localStorageData).forEach(key => {
            localStorage.setItem(key, parsed.localStorageData[key]);
          });

          alert("Backup imported successfully.");
          applySmartToolsHomeTheme();
          updateSmartToolsDashboard();

        } catch (error) {
          alert("Could not import this backup file.");
        }
      };

      reader.readAsText(file);
    }

    // =========================
    // UPDATE SMART TOOLS DASHBOARD
    // =========================
    function updateSmartToolsDashboard() {
      updateDashboardDate();
      updateDashboardNotesCount();
    }

    // =========================
    // UPDATE DASHBOARD DATE
    // =========================
    function updateDashboardDate() {
      const dateEl = document.getElementById("dashboardTodayDate");
      const dayEl = document.getElementById("dashboardTodayDay");

      const now = new Date();

      if (dateEl) {
        dateEl.innerText = now.toLocaleDateString([], {
          month: "short",
          day: "numeric"
        });
      }

      if (dayEl) {
        dayEl.innerText = now.toLocaleDateString([], {
          weekday: "long"
        });
      }
    }

    // =========================
    // UPDATE DASHBOARD NOTES COUNT
    // =========================
    function updateDashboardNotesCount() {
      const notesCountEl = document.getElementById("dashboardNotesCount");

      if (!notesCountEl) return;

      try {
        const notes = JSON.parse(localStorage.getItem("pocketToolsNotes") || "[]");
        notesCountEl.innerText = Array.isArray(notes) ? notes.length : "0";
      } catch (error) {
        notesCountEl.innerText = "0";
      }
    }

    // =========================
    // PAGE LOAD
    // =========================
    document.addEventListener("DOMContentLoaded", function() {
      cleanSmartToolsRefreshUrl();
      forceSmartToolsIconCacheBuster();
      applySmartToolsHomeTheme();
      updateSmartToolsDashboard();
    });
  </script>

</body>
</html>
