
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f0ece4;min-height:100vh;padding:0}

:root{
  --navy:#1a2744;
  --navy2:#243055;
  --gold:#c8972a;
  --gold2:#e8b340;
  --cream:#f9f5ee;
  --cream2:#f0ece4;
  --surface:#ffffff;
  --text1:#1a2744;
  --text2:#4a5568;
  --text3:#8a94a6;
  --border:#e2ddd5;
  --tag-bg:#e8f4fd;
  --tag-text:#1a6fa8;
  --green:#1a7a4a;
  --green-bg:#e8f5ee;
  --red:#c0392b;
  --red-bg:#fdecea;
}

.app{max-width:480px;margin:0 auto;background:var(--cream2);min-height:100vh;position:relative;overflow:hidden}

/* Header */
.header{background:var(--navy);color:#fff;padding:20px 20px 0;position:relative}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.app-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:500}
.header-logo{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.logo-icon{width:36px;height:36px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon i{font-size:20px;color:var(--navy)}
.logo-text{font-size:22px;font-weight:600;color:#fff;letter-spacing:-.3px}
.header-stats{display:flex;gap:20px;margin-bottom:0;padding-bottom:18px}
.stat{text-align:center}
.stat-num{font-size:22px;font-weight:600;color:#fff;font-family:'Space Mono',monospace;line-height:1}
.stat-label{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:1px;text-transform:uppercase;margin-top:3px}
.header-wave{height:24px;background:var(--cream2);border-radius:24px 24px 0 0;margin-top:0}

/* Filter bar */
.filter-bar{display:flex;gap:6px;padding:14px 16px 10px;background:var(--cream2)}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid transparent;cursor:pointer;transition:all .18s;font-family:'DM Sans',sans-serif}
.filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.filter-btn:not(.active){background:var(--surface);color:var(--text2);border-color:var(--border)}
.filter-btn:not(.active):hover{border-color:var(--navy);color:var(--navy)}

/* Search */
.search-wrap{padding:0 16px 12px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:9px 14px}
.search-box i{color:var(--text3);font-size:17px}
.search-box input{border:none;outline:none;font-size:14px;color:var(--text1);background:transparent;flex:1;font-family:'DM Sans',sans-serif}
.search-box input::placeholder{color:var(--text3)}

/* Trip cards */
.cards-wrap{padding:0 16px 80px;display:flex;flex-direction:column;gap:12px}

.trip-card{background:var(--surface);border-radius:16px;overflow:hidden;border:1.5px solid var(--border);cursor:pointer;transition:transform .15s,box-shadow .15s}
.trip-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(26,39,68,.10)}

.card-stripe{height:6px;background:var(--navy)}
.card-stripe.upcoming{background:linear-gradient(90deg,var(--navy),var(--gold))}
.card-stripe.history{background:var(--border)}

.card-body{padding:14px 16px 12px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.trip-name{font-size:15px;font-weight:600;color:var(--text1);line-height:1.2}
.trip-meta{display:flex;align-items:center;gap:6px;margin-top:3px}
.airline-badge{font-size:11px;font-weight:600;background:var(--tag-bg);color:var(--tag-text);padding:2px 8px;border-radius:6px;font-family:'Space Mono',monospace}
.flight-num{font-size:11px;color:var(--text3);font-family:'Space Mono',monospace}

.card-menu-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:2px;border-radius:6px;position:relative;font-size:18px;line-height:1}
.card-menu-btn:hover{color:var(--text1);background:var(--cream2)}

/* Route display */
.route-row{display:flex;align-items:center;gap:0;margin:10px 0 8px}
.airport-code{font-size:22px;font-weight:700;color:var(--text1);font-family:'Space Mono',monospace;line-height:1}
.airport-city{font-size:10px;color:var(--text3);margin-top:1px;text-transform:uppercase;letter-spacing:.5px}
.route-line{flex:1;display:flex;align-items:center;gap:0;padding:0 10px}
.route-dash{flex:1;border-top:1.5px dashed var(--border)}
.route-plane{color:var(--gold);font-size:16px;margin:0 4px}
.route-dot{width:6px;height:6px;border-radius:50%;background:var(--border)}

.card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px;margin-top:4px}
.trip-date{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px}
.trip-date i{font-size:13px;color:var(--text3)}
.status-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px}
.status-pill.upcoming{background:var(--green-bg);color:var(--green)}
.status-pill.history{background:var(--cream2);color:var(--text3)}
.connecting-badge{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:3px}
.connecting-badge i{font-size:12px}

/* Dropdown menu */
.dropdown{position:absolute;right:12px;top:32px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(26,39,68,.13);z-index:100;min-width:160px;overflow:hidden}
.dropdown-item{display:flex;align-items:center;gap:9px;padding:11px 14px;font-size:13px;font-weight:500;color:var(--text1);cursor:pointer;transition:background .12s}
.dropdown-item:hover{background:var(--cream2)}
.dropdown-item i{font-size:16px;color:var(--text3)}
.dropdown-item.danger{color:var(--red)}
.dropdown-item.danger i{color:var(--red)}
.dropdown-item:not(:last-child){border-bottom:1px solid var(--border)}

/* FAB */
.fab-wrap{position:fixed;bottom:70px;right:calc(50% - 220px);z-index:200}
.fab{background:var(--navy);color:#fff;border:none;border-radius:50px;padding:13px 22px;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(26,39,68,.35);transition:transform .15s,box-shadow .15s}
.fab:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(26,39,68,.40)}
.fab i{font-size:18px}
.fab-menu{position:absolute;bottom:56px;right:0;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;box-shadow:0 8px 24px rgba(26,39,68,.14);overflow:hidden;min-width:170px}
.fab-item{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:14px;font-weight:500;color:var(--text1);cursor:pointer;transition:background .12s;font-family:'DM Sans',sans-serif}
.fab-item:hover{background:var(--cream2)}
.fab-item i{font-size:18px;color:var(--navy)}
.fab-item:not(:last-child){border-bottom:1px solid var(--border)}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1.5px solid var(--border);display:flex;padding:8px 0 12px;z-index:300}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px;transition:color .15s}
.nav-item i{font-size:22px;color:var(--text3)}
.nav-item span{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.3px}
.nav-item.active i,.nav-item.active span{color:var(--navy)}

/* Detail modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,40,.55);z-index:400;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--cream2);width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:90vh;overflow-y:auto;padding-bottom:32px}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:14px auto 0}
.modal-header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:1}
.modal-title{font-size:17px;font-weight:600;color:var(--text1)}
.modal-close{background:var(--cream2);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:18px}
.modal-section{padding:14px 20px;background:var(--surface);margin:10px 16px;border-radius:14px;border:1px solid var(--border)}
.modal-section-label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.detail-row:not(:last-child){border-bottom:1px solid var(--border)}
.detail-key{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:7px}
.detail-key i{font-size:15px;color:var(--text3)}
.detail-val{font-size:13px;font-weight:500;color:var(--text1);text-align:right;font-family:'Space Mono',monospace;font-size:12px}

/* Add/Import form */
.form-overlay{position:fixed;inset:0;background:rgba(15,20,40,.55);z-index:400;display:flex;align-items:flex-end;justify-content:center}
.form-sheet{background:var(--cream2);width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;padding-bottom:32px}
.form-header{padding:14px 20px 12px;display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:24px 24px 0 0;position:sticky;top:0;z-index:1}
.form-title{font-size:17px;font-weight:600;color:var(--text1)}
.form-group{padding:0 16px;margin-bottom:10px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.3px;margin-bottom:5px;display:block}
.form-input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-size:14px;color:var(--text1);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--navy)}
.form-row{display:flex;gap:8px;padding:0 16px;margin-bottom:10px}
.form-row .form-group{padding:0;flex:1;margin-bottom:0}
.form-section-head{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;padding:6px 16px 4px;margin-top:6px}
.checkbox-row{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer}
.checkbox-row input{width:17px;height:17px;accent-color:var(--navy);cursor:pointer}
.checkbox-row label{font-size:14px;font-weight:500;color:var(--text1);cursor:pointer}
.save-btn{margin:16px 16px 0;width:calc(100% - 32px);background:var(--navy);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .15s}
.save-btn:hover{background:var(--navy2)}
.textarea-input{resize:vertical;min-height:70px}
.import-area{margin:0 16px;background:var(--surface);border:1.5px dashed var(--border);border-radius:12px;padding:12px;font-size:13px;color:var(--text1);font-family:'DM Sans',sans-serif;min-height:100px;outline:none;width:calc(100% - 32px);display:block}
.import-area:focus{border-color:var(--navy)}
.import-note{font-size:12px;color:var(--text3);padding:6px 16px 10px;line-height:1.5}
.parse-btn{margin:0 16px 10px;width:calc(100% - 32px);background:var(--gold);color:var(--navy);border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}

/* hidden */
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <span class="app-title">Smart Tools</span>
    </div>
    <div class="header-logo">
      <div class="logo-icon"><i class="ti ti-plane" aria-hidden="true"></i></div>
      <span class="logo-text">Travel Wallet</span>
    </div>
    <div class="header-stats">
      <div class="stat">
        <div class="stat-num" id="stat-upcoming">2</div>
        <div class="stat-label">Upcoming</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-history">3</div>
        <div class="stat-label">History</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-total">5</div>
        <div class="stat-label">Total trips</div>
      </div>
    </div>
  </div>
  <div class="header-wave"></div>

  <!-- Filter + Search -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('upcoming',this)">Upcoming</button>
    <button class="filter-btn" onclick="setFilter('history',this)">History</button>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" placeholder="Search trips, flights, cities..." id="search-input" oninput="renderCards()">
    </div>
  </div>

  <!-- Cards -->
  <div class="cards-wrap" id="cards-wrap"></div>

  <!-- FAB -->
  <div class="fab-wrap">
    <div class="fab-menu hidden" id="fab-menu">
      <div class="fab-item" onclick="openManual()"><i class="ti ti-edit" aria-hidden="true"></i>Manual entry</div>
      <div class="fab-item" onclick="openImport()"><i class="ti ti-clipboard-text" aria-hidden="true"></i>Import / paste receipt</div>
    </div>
    <button class="fab" onclick="toggleFabMenu()">
      <i class="ti ti-plus" aria-hidden="true"></i> Add trip
    </button>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <div class="nav-item active">
      <i class="ti ti-wallet" aria-hidden="true"></i>
      <span>Wallet</span>
    </div>
    <div class="nav-item">
      <i class="ti ti-history" aria-hidden="true"></i>
      <span>History</span>
    </div>
    <div class="nav-item">
      <i class="ti ti-users" aria-hidden="true"></i>
      <span>Travelers</span>
    </div>
    <div class="nav-item">
      <i class="ti ti-settings" aria-hidden="true"></i>
      <span>Settings</span>
    </div>
  </nav>
</div>

<!-- Detail Modal -->
<div class="modal-overlay hidden" id="detail-modal" onclick="closeDetail(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="detail-title">Trip Details</span>
      <button class="modal-close" onclick="closeDetailBtn()"><i class="ti ti-x"></i></button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<!-- Add Trip Form -->
<div class="form-overlay hidden" id="form-overlay" onclick="closeForm(event)">
  <div class="form-sheet" onclick="event.stopPropagation()">
    <div class="form-header">
      <span class="form-title" id="form-title">Add Trip</span>
      <button class="modal-close" onclick="closeFormBtn()"><i class="ti ti-x"></i></button>
    </div>
    <div id="form-body"></div>
  </div>
</div>

<script>
var trips = [];

var activeFilter='all';
var openMenu=null;
var editingId=null;

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function updateStats(){
  var up=trips.filter(t=>t.status==='upcoming').length;
  var hi=trips.filter(t=>t.status==='history').length;
  document.getElementById('stat-upcoming').textContent=up;
  document.getElementById('stat-history').textContent=hi;
  document.getElementById('stat-total').textContent=trips.length;
}

function renderCards(){
  var q=(document.getElementById('search-input').value||'').toLowerCase();
  var filtered=trips.filter(t=>{
    if(activeFilter==='upcoming'&&t.status!=='upcoming')return false;
    if(activeFilter==='history'&&t.status!=='history')return false;
    if(q&&!(t.name.toLowerCase().includes(q)||t.from.toLowerCase().includes(q)||t.to.toLowerCase().includes(q)||(t.airline||'').toLowerCase().includes(q)||(t.flightNum||'').toLowerCase().includes(q)))return false;
    return true;
  });
  var wrap=document.getElementById('cards-wrap');
  wrap.innerHTML='';
  if(!filtered.length){
    wrap.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--text3);font-size:14px"><i class="ti ti-plane-off" style="font-size:36px;display:block;margin-bottom:10px;opacity:.4"></i>No trips found</div>';
    return;
  }
  filtered.forEach(function(t){
    var finalDest=t.connecting?t.to:t.to;
    var c=document.createElement('div');
    c.className='trip-card';
    c.innerHTML=
      '<div class="card-stripe '+(t.status==='upcoming'?'upcoming':'history')+'"></div>'+
      '<div class="card-body">'+
        '<div class="card-top">'+
          '<div>'+
            '<div class="trip-name">'+t.name+'</div>'+
            '<div class="trip-meta">'+
              '<span class="airline-badge">'+t.code+'</span>'+
              '<span class="flight-num">'+t.flightNum+(t.connecting?' · '+t.flight2:'')+'</span>'+
            '</div>'+
          '</div>'+
          '<div style="position:relative">'+
            '<button class="card-menu-btn" onclick="toggleMenu(event,'+t.id+')"><i class="ti ti-dots-vertical"></i></button>'+
            '<div class="dropdown hidden" id="menu-'+t.id+'">'+
              '<div class="dropdown-item" onclick="editTrip('+t.id+')"><i class="ti ti-edit" aria-hidden="true"></i>Edit itinerary</div>'+
              '<div class="dropdown-item" onclick="markDone('+t.id+')"><i class="ti ti-circle-check" aria-hidden="true"></i>'+(t.status==='upcoming'?'Mark as done':'Mark upcoming')+'</div>'+
              '<div class="dropdown-item" onclick="printTrip('+t.id+')"><i class="ti ti-printer" aria-hidden="true"></i>Print itinerary</div>'+
              '<div class="dropdown-item danger" onclick="deleteTrip('+t.id+')"><i class="ti ti-trash" aria-hidden="true"></i>Delete</div>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div class="route-row">'+
          '<div>'+
            '<div class="airport-code">'+t.from+'</div>'+
            '<div class="airport-city">'+(t.from==='JFK'?'New York':t.from==='LGA'?'New York':t.from)+'</div>'+
          '</div>'+
          '<div class="route-line">'+
            '<div class="route-dot"></div>'+
            '<div class="route-dash"></div>'+
            '<i class="ti ti-plane route-plane" aria-hidden="true"></i>'+
            '<div class="route-dash"></div>'+
            '<div class="route-dot"></div>'+
          '</div>'+
          '<div style="text-align:right">'+
            '<div class="airport-code">'+finalDest+'</div>'+
            '<div class="airport-city">'+(finalDest==='LHR'?'London':finalDest==='DXB'?'Dubai':finalDest==='MIA'?'Miami':finalDest==='ORD'?'Chicago':finalDest==='CUN'?'Cancun':finalDest)+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="card-footer">'+
          '<span class="trip-date"><i class="ti ti-calendar" aria-hidden="true"></i>'+t.date+'</span>'+
          '<div style="display:flex;align-items:center;gap:8px">'+
            (t.connecting?'<span class="connecting-badge"><i class="ti ti-git-branch" aria-hidden="true"></i>Connecting</span>':'')+
            '<span class="status-pill '+(t.status==='upcoming'?'upcoming':'history')+'">'+(t.status==='upcoming'?'Upcoming':'History')+'</span>'+
          '</div>'+
        '</div>'+
      '</div>';
    c.querySelector('.card-body').addEventListener('click',function(e){
      if(!e.target.closest('.card-menu-btn')&&!e.target.closest('.dropdown'))openDetail(t.id);
    });
    wrap.appendChild(c);
  });
}

function toggleMenu(e,id){
  e.stopPropagation();
  var m=document.getElementById('menu-'+id);
  if(openMenu&&openMenu!==m)openMenu.classList.add('hidden');
  m.classList.toggle('hidden');
  openMenu=m.classList.contains('hidden')?null:m;
}

document.addEventListener('click',function(){if(openMenu){openMenu.classList.add('hidden');openMenu=null;}});

function closeMenus(){if(openMenu){openMenu.classList.add('hidden');openMenu=null;}}

function markDone(id){
  closeMenus();
  var t=trips.find(x=>x.id===id);
  if(t)t.status=t.status==='upcoming'?'history':'upcoming';
  updateStats();renderCards();
}

function deleteTrip(id){
  closeMenus();
  trips=trips.filter(x=>x.id!==id);
  updateStats();renderCards();
}

function printTrip(id){
  closeMenus();
  var t=trips.find(x=>x.id===id);
  if(!t)return;
  var w=window.open('','_blank');
  w.document.write('<html><head><title>'+t.name+'</title><style>body{font-family:sans-serif;padding:30px;max-width:600px;margin:0 auto}h1{font-size:20px;margin-bottom:4px}h2{font-size:15px;color:#555;border-bottom:1px solid #eee;padding-bottom:6px;margin:18px 0 8px}p{margin:4px 0;font-size:14px}label{font-weight:600;color:#444}</style></head><body>');
  w.document.write('<h1>'+t.name+'</h1><p>'+t.from+' → '+t.to+'</p>');
  w.document.write('<h2>Flight 1</h2>');

function saveTrip(){
  var conn=document.getElementById('f-conn').checked;
  var obj={
    id:editingId||(Date.now()),
    name:document.getElementById('f-name').value||'New Trip',
    status:editingId?(trips.find(x=>x.id===editingId)||{}).status||'upcoming':'upcoming',
    airline:document.getElementById('f-airline').value,
    code:document.getElementById('f-code').value,
    flightNum:document.getElementById('f-flightnum').value,
    from:document.getElementById('f-from').value.toUpperCase(),
    to:document.getElementById('f-to').value.toUpperCase(),
    connecting:conn,
    date:document.getElementById('f-date').value,
    dep:document.getElementById('f-dep').value,
    arr:document.getElementById('f-arr').value,
    confirm:document.getElementById('f-confirm').value,
    airline2:conn?document.getElementById('f-airline2').value:'',
    flight2:conn?document.getElementById('f-flight2').value:'',
    from2:conn?document.getElementById('f-from2').value.toUpperCase():'',
    date2:conn?document.getElementById('f-date2').value:'',
    dep2:conn?document.getElementById('f-dep2').value:'',
    arr2:conn?document.getElementById('f-arr2').value:'',
    confirm2:conn?document.getElementById('f-confirm2').value:'',
    ticket:document.getElementById('f-ticket').value,
    bookingCode:document.getElementById('f-booking').value,
    traveler:document.getElementById('f-traveler').value,
    traveler2:document.getElementById('f-traveler2').value,
    hotel:document.getElementById('f-hotel').value,
    hotelCheckin:document.getElementById('f-cin').value,
    hotelCheckout:document.getElementById('f-cout').value,
    hotelConfirm:document.getElementById('f-hconfirm').value,
    notes:document.getElementById('f-notes').value

  else{trips.unshift(obj);}
  closeFormBtn();
  updateStats();renderCards();
}

    '<div class="import-note">After auto-fill, review and edit any fields before saving.</div>'+
    '<button class="parse-btn" onclick="parseImport()"><i class="ti ti-sparkles" style="font-size:16px"></i>Auto-fill from text</button>'+
    '<div id="parsed-form"></div>';

function parseImport(){
  var raw=document.getElementById('import-text').value;
  var d={};
  var m;
  m=raw.match(/confirmation[:\s#]*([A-Z0-9\-]{4,12})/i);if(m)d.confirm=m[1];
  m=raw.match(/booking[:\s#]*([A-Z0-9\-]{4,12})/i);if(m)d.bookingCode=m[1];
  m=raw.match(/flight[:\s#]*([A-Z]{2}\d{2,4})/i);if(m)d.flightNum=m[1];
  m=raw.match(/([A-Z]{2,3})\s*(?:→|->|to)\s*([A-Z]{2,3})/);if(m){d.from=m[1];d.to=m[2];}
  m=raw.match(/(\d{1,2}:\d{2}\s*[AP]M|\d{2}:\d{2})/g);if(m&&m.length>=2){d.dep=m[0];d.arr=m[1];}
  m=raw.match(/passenger[:\s]*([A-Za-z ]+)/i);if(m)d.traveler=m[1].trim();
  m=raw.match(/ticket[:\s#]*(\d{10,})/i);if(m)d.ticket=m[1];
  m=raw.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{1,2},?\s*\d{4}/i);if(m)d.date=m[0];
  m=raw.match(/(American|Delta|United|JetBlue|Southwest|Emirates|Icelandair|British Airways|Lufthansa|Air France)/i);if(m)d.airline=m[1];
  editingId=null;
  document.getElementById('form-title').textContent='Review & save';
  renderManualForm(d);
  document.querySelector('.save-btn').scrollIntoView({behavior:'smooth'});
}

function closeFormBtn(){document.getElementById('form-overlay').classList.add('hidden');editingId=null;}

document.addEventListener('click',function(e){
  var menu=document.getElementById('fab-menu');
