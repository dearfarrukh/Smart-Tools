<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Wallet – Smart Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f0f7;
      --glass: rgba(255,255,255,0.90);
      --glass-border: rgba(180,170,220,0.35);
      --accent: #7c3aed;
      --accent-deep: #5b21b6;
      --accent-light: #ede9fe;
      --text: #1a1035;
      --text-muted: #8878b0;
      --font: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      padding: 32px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .header-title { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
    .header-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .btn-add {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      border: none; border-radius: 14px;
      color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 18px; cursor: pointer;
      font-family: var(--font);
      box-shadow: 0 4px 16px rgba(124,58,237,0.4);
      white-space: nowrap;
    }

    /* ── Search ── */
    .search-wrap {
      padding: 18px 20px 0;
    }
    .search-box {
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      padding: 13px 16px;
      gap: 10px;
    }
    .search-box input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: 15px; font-family: var(--font);
      flex: 1; min-width: 0;
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-clear {
      color: var(--text-muted); font-size: 20px; cursor: pointer;
      display: none; line-height: 1; user-select: none;
    }

    /* ── Card List ── */
    .card-list { padding: 20px 20px 60px; }

    .empty-state {
      text-align: center; color: var(--text-muted); margin-top: 80px;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 14px; }
    .empty-state .title { font-size: 15px; font-weight: 500; }
    .empty-state .sub { font-size: 13px; color: #b0a8cc; margin-top: 6px; }

    /* ── Visual Card ── */
    .card-item { margin-bottom: 24px; }
    .card-visual {
      border-radius: 22px;
      padding: 22px 24px 20px;
      position: relative;
      overflow: hidden;
      min-height: 164px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }
    .card-visual .deco1 {
      position: absolute; top: -40px; right: -40px;
      width: 140px; height: 140px; border-radius: 50%;
      background: rgba(255,255,255,0.05); pointer-events: none;
    }
    .card-visual .deco2 {
      position: absolute; bottom: -30px; right: 50px;
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255,255,255,0.04); pointer-events: none;
    }
    .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
    .card-bank-label { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 3px; }
    .card-bank-name { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
    .card-type-badge {
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(8px);
      border-radius: 8px; padding: 4px 11px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    }
    .card-number { font-size: 21px; font-weight: 700; letter-spacing: 4px; margin-bottom: 18px; }
    .card-bottom-row { display: flex; justify-content: space-between; align-items: flex-end; }
    .card-exp-label { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 2px; }
    .card-exp-val { font-size: 15px; font-weight: 600; }
    .card-network { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,0.8); }

    .card-actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn-edit, .btn-delete {
      flex: 1; border-radius: 13px; padding: 11px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: var(--font); border: 1px solid;
      backdrop-filter: blur(10px);
    }
    .btn-edit {
      background: #fff;
      border-color: #ddd8f5;
      color: #4c3d8a;
    }
    .btn-delete {
      background: #fff5f5;
      border-color: #fcd0d0;
      color: #e53e3e;
    }

    /* ── Modal Overlay ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: flex-end;
      z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.active { opacity: 1; pointer-events: all; }

    .sheet {
      width: 100%;
      background: #fafafa;
      border-radius: 26px 26px 0 0;
      padding: 20px 22px 48px;
      border: 1px solid #e2ddf5;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      max-height: 92vh;
      overflow-y: auto;
    }
    .overlay.active .sheet { transform: translateY(0); }

    .drag-handle {
      width: 38px; height: 4px; border-radius: 2px;
      background: #d4cef0;
      margin: 0 auto 20px;
    }
    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

    /* ── Form Fields ── */
    .field-label {
      font-size: 11px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 7px; display: block;
    }
    .glass-input {
      width: 100%;
      background: #fff;
      border: 1.5px solid #e0daf5;
      border-radius: 13px;
      padding: 12px 14px;
      color: var(--text); font-size: 15px;
      font-family: var(--font);
      outline: none;
      margin-bottom: 14px;
    }
    .glass-input:focus { border-color: var(--accent); }
    .glass-input::placeholder { color: #b0a8cc; }

    .row-2 { display: flex; gap: 12px; }
    .row-2 > div { flex: 1; }

    .toggle-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .toggle-btn {
      flex: 1; padding: 10px 6px; border-radius: 11px;
      border: 1.5px solid #e0daf5;
      background: #fff;
      color: #9588bc;
      font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: var(--font);
      transition: all 0.15s;
    }
    .toggle-btn.active {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }

    .color-row { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 22px; }
    .color-dot {
      width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all 0.15s;
    }
    .color-dot.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(167,139,250,0.5);
    }

    .btn-save {
      width: 100%; padding: 15px;
      border-radius: 15px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: var(--font);
      box-shadow: 0 4px 16px rgba(124,58,237,0.3);
      transition: opacity 0.2s;
    }
    .btn-save:disabled { opacity: 0.4; cursor: default; }

    /* ── Delete Confirm ── */
    .del-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.70);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      z-index: 300; padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .del-overlay.active { opacity: 1; pointer-events: all; }
    .del-box {
      background: #fff;
      border-radius: 22px; padding: 28px 24px;
      border: 1px solid #e8e2f8;
      max-width: 320px; width: 100%; text-align: center;
      transform: scale(0.9);
      transition: transform 0.2s;
    }
    .del-overlay.active .del-box { transform: scale(1); }
    .del-icon { font-size: 36px; margin-bottom: 12px; }
    .del-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .del-sub { font-size: 13px; color: #8878b0; margin-bottom: 24px; }
    .del-btns { display: flex; gap: 12px; }
    .btn-cancel {
      flex: 1; padding: 12px; border-radius: 13px;
      border: 1.5px solid #e0daf5;
      background: #f5f3ff;
      color: var(--text); font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: var(--font);
    }
    .btn-del-confirm {
      flex: 1; padding: 12px; border-radius: 13px;
      border: none;
      background: linear-gradient(135deg, #ff4444, #cc0000);
      color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: var(--font);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div>
      <div class="header-title">💳 My Cards</div>
      <div class="header-sub" id="card-count">0 cards saved</div>
    </div>
    <button class="btn-add" onclick="openAdd()">+ Add Card</button>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b0a8cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search-input" type="tel" maxlength="4" placeholder="Search by last 4 digits…" oninput="onSearch(this.value)" />
      <span class="search-clear" id="search-clear" onclick="clearSearch()">×</span>
    </div>
  </div>

  <!-- Card List -->
  <div class="card-list" id="card-list"></div>

  <!-- Add / Edit Sheet -->
  <div class="overlay" id="form-overlay" onclick="onOverlayClick(event)">
    <div class="sheet">
      <div class="drag-handle"></div>
      <div class="sheet-title" id="form-title">Add New Card</div>

      <label class="field-label">Bank Name</label>
      <input class="glass-input" id="f-bank" type="text" placeholder="e.g. Chase, Wells Fargo, Citi" />

      <div class="row-2">
        <div>
          <label class="field-label">Last 4 Digits</label>
          <input class="glass-input" id="f-last4" type="tel" maxlength="4" placeholder="0000"
            oninput="this.value=this.value.replace(/\D/g,'').slice(0,4)" />
        </div>
        <div>
          <label class="field-label">Expiry</label>
          <input class="glass-input" id="f-expiry" type="text" maxlength="5" placeholder="MM/YY" oninput="formatExpiry(this)" />
        </div>
      </div>

      <label class="field-label">Card Type</label>
      <div class="toggle-row" id="type-row">
        <button class="toggle-btn active" onclick="setType('Credit')">Credit</button>
        <button class="toggle-btn" onclick="setType('Debit')">Debit</button>
      </div>

      <label class="field-label">Network</label>
      <div class="toggle-row" id="network-row">
        <button class="toggle-btn active" onclick="setNetwork('Visa')">Visa</button>
        <button class="toggle-btn" onclick="setNetwork('Mastercard')">MC</button>
        <button class="toggle-btn" onclick="setNetwork('Amex')">Amex</button>
        <button class="toggle-btn" onclick="setNetwork('Discover')">Disc</button>
      </div>

      <label class="field-label">Card Color</label>
      <div class="color-row" id="color-row"></div>

      <button class="btn-save" id="btn-save" onclick="handleSave()">Add Card</button>
    </div>
  </div>

  <!-- Delete Confirm -->
  <div class="del-overlay" id="del-overlay">
    <div class="del-box">
      <div class="del-icon">🗑️</div>
      <div class="del-title">Delete this card?</div>
      <div class="del-sub">This can't be undone.</div>
      <div class="del-btns">
        <button class="btn-cancel" onclick="closeDelete()">Cancel</button>
        <button class="btn-del-confirm" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "smarttools-card-wallet";

    const GRADIENTS = [
      ["#1a1a2e","#16213e"],
      ["#0f3460","#533483"],
      ["#1b4332","#2d6a4f"],
      ["#4a0e6e","#7b2d8b"],
      ["#7b0000","#c9181e"],
      ["#c0392b","#ff6b35"],
      ["#2c3e50","#4ca1af"],
      ["#373b44","#4286f4"],
    ];

    let cards = [];
    let editingId = null;
    let deleteId = null;
    let currentType = "Credit";
    let currentNetwork = "Visa";
    let currentColor = 0;
    let searchVal = "";

    /* ── Storage ── */
    function load() {
      try { cards = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { cards = []; }
    }
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    }

    /* ── Render ── */
    function render() {
      const list = document.getElementById("card-list");
      const count = document.getElementById("card-count");
      count.textContent = `${cards.length} card${cards.length !== 1 ? "s" : ""} saved`;

      const filtered = searchVal
        ? cards.filter(c => c.last4.includes(searchVal))
        : [...cards];

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">💳</div>
            <div class="title">${searchVal ? `No cards ending in ${searchVal}` : "No cards saved yet"}</div>
            ${!searchVal ? '<div class="sub">Tap "+ Add Card" to get started</div>' : ""}
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(card => {
        const [from, to] = GRADIENTS[card.colorIndex % GRADIENTS.length];
        return `
          <div class="card-item">
            <div class="card-visual" style="background:linear-gradient(140deg,${from},${to})">
              <div class="deco1"></div>
              <div class="deco2"></div>
              <div class="card-top-row">
                <div>
                  <div class="card-bank-label">Bank</div>
                  <div class="card-bank-name">${esc(card.bank)}</div>
                </div>
                <div class="card-type-badge">${esc(card.type)}</div>
              </div>
              <div class="card-number">•••• &nbsp;•••• &nbsp;•••• &nbsp;${esc(card.last4)}</div>
              <div class="card-bottom-row">
                <div>
                  <div class="card-exp-label">Expires</div>
                  <div class="card-exp-val">${esc(card.expiry)}</div>
                </div>
                <div class="card-network">${esc(card.network)}</div>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn-edit" onclick="openEdit('${card.id}')">✏️ Edit</button>
              <button class="btn-delete" onclick="openDelete('${card.id}')">🗑️ Delete</button>
            </div>
          </div>`;
      }).join("");
    }

    function esc(str) {
      return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
    }

    /* ── Search ── */
    function onSearch(val) {
      searchVal = val.replace(/\D/g, "").slice(0, 4);
      document.getElementById("search-input").value = searchVal;
      document.getElementById("search-clear").style.display = searchVal ? "block" : "none";
      render();
    }
    function clearSearch() {
      searchVal = "";
      document.getElementById("search-input").value = "";
      document.getElementById("search-clear").style.display = "none";
      render();
    }

    /* ── Color Dots ── */
    function buildColorDots() {
      const row = document.getElementById("color-row");
      row.innerHTML = GRADIENTS.map(([f,t], i) => `
        <div class="color-dot${i === currentColor ? " active" : ""}"
          style="background:linear-gradient(135deg,${f},${t})"
          onclick="setColor(${i})"></div>
      `).join("");
    }
    function setColor(i) {
      currentColor = i;
      document.querySelectorAll(".color-dot").forEach((d,idx) => {
        d.classList.toggle("active", idx === i);
      });
    }

    /* ── Toggle Buttons ── */
    function setType(val) {
      currentType = val;
      document.querySelectorAll("#type-row .toggle-btn").forEach(b => {
        b.classList.toggle("active", b.textContent === val);
      });
    }
    function setNetwork(val) {
      currentNetwork = val;
      const labels = { Visa:"Visa", Mastercard:"MC", Amex:"Amex", Discover:"Disc" };
      document.querySelectorAll("#network-row .toggle-btn").forEach(b => {
        b.classList.toggle("active", b.textContent === labels[val]);
      });
    }

    /* ── Open Add ── */
    function openAdd() {
      editingId = null;
      currentType = "Credit";
      currentNetwork = "Visa";
      currentColor = Math.floor(Math.random() * GRADIENTS.length);

      document.getElementById("form-title").textContent = "Add New Card";
      document.getElementById("btn-save").textContent = "Add Card";
      document.getElementById("f-bank").value = "";
      document.getElementById("f-last4").value = "";
      document.getElementById("f-expiry").value = "";

      setType("Credit");
      setNetwork("Visa");
      buildColorDots();
      setColor(currentColor);

      document.getElementById("form-overlay").classList.add("active");
    }

    /* ── Open Edit ── */
    function openEdit(id) {
      const card = cards.find(c => c.id === id);
      if (!card) return;
      editingId = id;
      currentType = card.type;
      currentNetwork = card.network;
      currentColor = card.colorIndex;

      document.getElementById("form-title").textContent = "Edit Card";
      document.getElementById("btn-save").textContent = "Save Changes";
      document.getElementById("f-bank").value = card.bank;
      document.getElementById("f-last4").value = card.last4;
      document.getElementById("f-expiry").value = card.expiry;

      setType(card.type);
      setNetwork(card.network);
      buildColorDots();
      setColor(card.colorIndex);

      document.getElementById("form-overlay").classList.add("active");
    }

    /* ── Save ── */
    function handleSave() {
      const bank   = document.getElementById("f-bank").value.trim();
      const last4  = document.getElementById("f-last4").value.trim();
      const expiry = document.getElementById("f-expiry").value.trim();

      if (!bank || last4.length !== 4 || !expiry) {
        alert("Please fill in Bank Name, Last 4 Digits, and Expiry Date.");
        return;
      }

      if (editingId) {
        cards = cards.map(c => c.id === editingId
          ? { ...c, bank, last4, expiry, type: currentType, network: currentNetwork, colorIndex: currentColor }
          : c);
      } else {
        cards.push({ id: Date.now().toString(), bank, last4, expiry, type: currentType, network: currentNetwork, colorIndex: currentColor });
      }

      save();
      closeForm();
      render();
    }

    /* ── Delete ── */
    function openDelete(id) {
      deleteId = id;
      document.getElementById("del-overlay").classList.add("active");
    }
    function closeDelete() {
      deleteId = null;
      document.getElementById("del-overlay").classList.remove("active");
    }
    function confirmDelete() {
      cards = cards.filter(c => c.id !== deleteId);
      save();
      closeDelete();
      render();
    }

    /* ── Close Form ── */
    function closeForm() {
      document.getElementById("form-overlay").classList.remove("active");
    }
    function onOverlayClick(e) {
      if (e.target === document.getElementById("form-overlay")) closeForm();
    }

    /* ── Expiry Formatting ── */
    function formatExpiry(input) {
      let val = input.value.replace(/[^\d/]/g, "");
      if (val.length === 2 && !val.includes("/")) val = val + "/";
      input.value = val.slice(0, 5);
    }

    /* ── Init ── */
    load();
    render();
  </script>
</body>
</html>
